name: Publish release containers

# A release tag is the publication boundary. The normal CI workflow must pass on the pull request
# before the change reaches main; this workflow also refuses to publish a tag not contained in main.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and ancestry
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || {
            echo "::error::release tag must look like v0.77 or v1.2.3"; exit 1;
          }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::release commit is not contained in origin/main"; exit 1;
          }

  images:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: lesson3-app
            target: runner
          - package: lesson3-migrate
            target: builder
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ${{ matrix.package }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./app
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          # Publish only immutable release tags. The two matrix legs complete independently, so
          # moving `latest` in each leg can advertise app and migrate images from different releases
          # when one build fails. Deployment bundles already pin both version AND digest.
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.package }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.package }}
          cache-to: type=gha,mode=max,scope=${{ matrix.package }}
          provenance: mode=max
          sbom: true

  release:
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build checksummed deployment bundle
        run: |
          app_image="ghcr.io/${{ github.repository_owner }}/lesson3-app:$GITHUB_REF_NAME"
          migrate_image="ghcr.io/${{ github.repository_owner }}/lesson3-migrate:$GITHUB_REF_NAME"
          app_digest="$(docker buildx imagetools inspect "$app_image" | awk '$1 == "Digest:" {print $2; exit}')"
          migrate_digest="$(docker buildx imagetools inspect "$migrate_image" | awk '$1 == "Digest:" {print $2; exit}')"
          scripts/build-local-deploy-bundle.sh \
            "$GITHUB_REF_NAME" dist "$app_digest" "$migrate_digest"
      # The release is PUBLISHED WITH ITS BUNDLE ALREADY ATTACHED, by way of a draft.
      #
      # Creating a release first and uploading assets afterwards leaves a window in which GitHub
      # advertises the version as "Latest" while `releases/latest/download/...` returns 404. v0.80
      # spent the whole 17 minutes of this job in that state, because the release had been created by
      # hand before the job ran. A draft is never served by `releases/latest`, so assembling the
      # release as a draft and making it visible only once its assets are on it CLOSES that window
      # rather than shortening it. Pushing the tag is now the only step a human performs.
      - name: Publish the release with its bundle attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-release-bundle.sh "$GITHUB_REF_NAME" dist/lesson3-online-deploy.tar.gz

      # A release that is ADVERTISED but not INSTALLABLE is worse than no release: GitHub keeps
      # serving it as "Latest" while `releases/latest/download/...` returns 404, and the first person
      # to find out is whoever tried to deploy. v0.80 sat in exactly that state for the length of this
      # job, because the release was created by hand before the bundle existed. So the last thing this
      # workflow does is walk the DOCUMENTED install path from docs/LOCAL-SERVER-DEPLOYMENT.md and
      # fail if it does not lead to this release.
      #
      # The VERSION check is doing double duty: it proves the bundle is intact AND that `latest`
      # resolves HERE. If an older release were still being served as Latest, the download would
      # succeed and the version inside would be wrong — which is the silent failure this guards.
      - name: Verify the documented install path resolves to this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          asset=lesson3-online-deploy.tar.gz

          # `releases/latest` deliberately skips prereleases, so for one of those assert the tagged
          # URL instead of failing a state that is correct on purpose.
          if [[ "$(gh release view "$tag" --json isPrerelease -q .isPrerelease)" == "true" ]]; then
            base="https://github.com/${{ github.repository }}/releases/download/$tag"
            echo "note: $tag is a prerelease — 'latest' intentionally does not point here"
          else
            base="https://github.com/${{ github.repository }}/releases/latest/download"
          fi

          work="$(mktemp -d)"
          cd "$work"
          # Asset availability can lag the upload by a moment; a few retries, not indefinite patience.
          for attempt in 1 2 3 4 5; do
            if curl -fsSLO "$base/$asset" && curl -fsSLO "$base/$asset.sha256"; then break; fi
            if [[ "$attempt" == 5 ]]; then
              echo "::error::$base/$asset is not downloadable — the documented install path is broken"
              exit 1
            fi
            sleep 6
          done

          sha256sum -c "$asset.sha256"
          tar -xzf "$asset"
          got="$(tr -d '[:space:]' <lesson3-deploy/VERSION)"
          if [[ "$got" != "$tag" ]]; then
            echo "::error::documented install path serves '$got', expected '$tag'"
            exit 1
          fi
          echo "verified: $base/$asset installs $got"
