# Attribution and licensing text for all generated outputs.
# Single source of truth: generators must read this file, never hardcode the text.
# Applies to every grade and subject (Grade 10 now, Grade 11 next, non-STEM later).
#
# {YEAR} is replaced at render time with the current calendar year (the year
# the file is generated), per project decision 2026-09-29.

year: 2026   # Lesson3: fixed configured copyright year (upstream: auto); see PROVENANCE.md

license:
