chnical implementation by ARES (with AI assistance from Claude). Licensed under &lt;a href=&quot;https://creativecommons.org/licenses/by-nc/4.0/&quot;&gt;CC BY-NC 4.0&lt;/a&gt; (&lt;a href=&quot;https://creativecommons.org/licenses/by-nc/4.0/&quot;&gt;https://creativecommons.org/licenses/by-nc/4.0/&lt;/a&gt;).&lt;/p&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;3&quot;&gt;&lt;p&gt;&lt;strong&gt;DIFFERENTIATION AND INCLUSION&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Learner Need&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Support Strategies&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Extension Strategies&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;English Language Learners&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Provide bilingual glossaries; allow use of first language for initial model drawing.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Write extended explanations of observations; lead group discussions in English.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;Students with learning difficulties&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Provide structured note frames; pair with a supportive partner during investigations.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Mentor peers; create additional visual models to explain concepts.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;Gifted and advanced learners&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Access to additional reading materials; challenge questions during DQB.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Lead model-building discussions; research and present extension topics to class.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/details&gt;

&lt;details class=&quot;lp-section&quot; id=&quot;doc-final-explanation&quot; data-document-section&gt;
  &lt;summary&gt;Final Explanation&lt;/summary&gt;
  &lt;div class=&quot;lp-document doc-preview&quot;&gt;&lt;p&gt;&lt;strong&gt;FINAL EXPLANATION: BIOLOGY GRADE 10&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;em&gt;Teacher Key: Exemplar Answers and Marking Guide&lt;/em&gt;&lt;/p&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;FINAL EXPLANATION: BIOLOGY GRADE 10 – SUB-STRAND 1.1 CELL STRUCTURE: FINAL EXPLANATION&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;Teacher Key: Exemplar Answers (do not give to students)&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;INSTRUCTIONS GIVEN TO STUDENTS&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;Driving question: Why do cells in our body look so different from each other, and how does the shape of a cell determine the job it can do? Use everything you learned in Lessons 1 to 12 to write a complete, evidence-based explanation of The Healing Cut: the Form 1 student in Nairobi who cut a finger while slicing onions for supper. Answer each section in the space under its prompt. Write in full sentences, use correct scientific words, and refer to evidence from our lessons (diagrams, the onion and cheek cell practicals, the specialised cell studies, the sickle-cell micrographs and the cell organisation hierarchy). Where a question asks you to make a claim, give your Claim, your Evidence and your Reasoning. Sketches and labelled diagrams are welcome.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;Section 1: Cells as the Starting Point&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Think about the cut finger. (a) State the three tenets of cell theory and name the scientist linked to the third tenet. (b) Use cell theory to explain where the new skin cells came from as the finger healed. (c) The bacteria that might infect the cut (for example E. coli from badly prepared nyama choma) are prokaryotes, while the body cells fighting them are eukaryotes. Describe two structural differences between these two cell types.&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;(a) Cell theory has three tenets: all living things are made of cells; the cell is the basic unit of life; and all cells arise from pre-existing cells. Virchow is linked to the third tenet (Schleiden and Schwann contributed the first two ideas). (b) Claim: the new skin cells came from existing skin cells. Evidence: at the cut, epidermal cells divide and migrate to close the surface. Reasoning: because all cells arise from pre-existing cells, new skin cannot appear from nothing; surviving epidermal cells at the wound edge divide to make new cells that seal the wound. (c) Prokaryotes such as E. coli have no membrane-bound nucleus (their DNA floats freely in a nucleoid region), whereas eukaryotic body cells have a membrane-bound nucleus. Prokaryotes also have no membrane-bound organelles, whereas eukaryotes do. Prokaryotes are also much smaller (about 1 to 5 micrometres) than eukaryotes (about 10 to 100 micrometres).&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;Section 2: Plant Cells and Animal Cells&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;In Lessons 4 to 7 you studied plant cells and animal cells, including onion epidermal cells and your own cheek cells under the microscope. (a) Name the structures that plant cells have but animal cells lack, and the structures animal cells have that plant cells lack. (b) What did you observe in the onion cells that was NOT there in your cheek cells, and what did you see in both? (c) You did not see chloroplasts in the onion epidermal cells. Explain why this is not a mistake. (d) Explain why the lack of a cell wall in animal cells is useful for the cells that close the cut finger.&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;(a) Plant cells uniquely have a cell wall, chloroplasts and a large central vacuole. Animal cells have lysosomes and centrioles, which plant cells lack. Both share a nucleus, mitochondria, ribosomes, endoplasmic reticulum, Golgi apparatus and a cell membrane. (b) The onion cells had a rigid cell wall, giving a regular rectangular shape, and a large central vacuole, which the cheek cells did not have. Both onion and cheek cells had a cell membrane, cytoplasm and a nucleus (stained by iodine in onion and by methylene blue in cheek cells). (c) The onion bulb grows underground and is not exposed to light, so its epidermal cells are specialised for protection and storage, not photosynthesis. Cells build and keep only the structures their job needs, so the absence of chloroplasts is evidence of specialisation. (d) Without a rigid cell wall, animal cells such as epidermal cells can change shape, flatten and migrate. This flexibility lets epidermal cells spread across the wound and close the surface. A rigid wall would stop this movement. (Platelets are cell fragments that gather at the cut to form the clot; they do not migrate to close the skin.)&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;Section 3: Specialised Cells and the Healing Cut&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Healing the cut involves platelets (cell fragments), neutrophils, macrophages, fibroblasts and epidermal cells. (a) Choose THREE of these. For each, describe one structural feature and explain how it suits the job it does in the healing sequence. (b) Use the sickle-cell anaemia micrographs from Lesson 8 as evidence to write a Claim, Evidence and Reasoning paragraph answering: Does the shape of a cell affect the job it can do? (c) Choose one specialised plant cell (such as a root hair cell, xylem vessel or palisade cell) and explain how its structure suits its function.&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;(a) Any three of: Platelets are small cell fragments with no nucleus and are sticky, so they aggregate quickly at the cut and start clotting to slow the bleeding. Neutrophils have a multi-lobed nucleus and abundant lysosomes full of digestive enzymes, so they can engulf and digest bacteria. Macrophages have an irregular, flexible membrane, so they can engulf debris and dead cells. Fibroblasts are elongated with extensive rough endoplasmic reticulum and Golgi apparatus, so they can make and secrete collagen to rebuild the tissue. Epidermal cells are tightly packed with an active nucleus, so they divide and migrate to close the skin surface. (b) Claim: yes, cell shape determines the job a cell can do. Evidence: in the micrographs, normal red blood cells are biconcave discs with no nucleus, while the sickle cells are distorted and no longer biconcave. Reasoning: the normal biconcave shape lets red blood cells carry oxygen to the tissues. When the shape is disrupted, as in sickle-cell anaemia, the cells carry oxygen less effectively and function is catastrophically compromised, even though the cells are still alive and contain the same kind of DNA. Because the loss of shape leads to the loss of function, shape is the physical basis of function. (c) A root hair cell has a long extension that increases surface area, so it absorbs water and minerals from the soil more efficiently. (Alternatively: xylem vessels are hollow and lignified, so they can transport water; palisade cells have many chloroplasts, so they carry out photosynthesis.)&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;Section 4: Same DNA, Different Cells&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;The puzzle that started our unit was: if all cells in one organism carry the same DNA, why do they look so different? (a) Use what you learned to answer this puzzle. (b) Use your evidence from the onion and cheek cell practicals, or the specialised cells you studied, to support your answer to (a). (c) Using the cell organisation hierarchy, explain why no single cell, such as a platelet or a fibroblast, can heal the cut alone.&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;(a) All the cells carry the same DNA, but different genes are expressed in different cells. Each cell makes only the structures it needs, so cells develop different shapes and organelles. These structures are suited to each cell&#x27;s job, which is why a platelet, a neutrophil and a fibroblast look so different. (b) Gene expression is selective, so cells with the same DNA end up with different structures. For example, the onion epidermal cells we observed had a cell wall, vacuole and nucleus but no chloroplasts, while a plant palisade cell has dense chloroplasts. Likewise, a neutrophil with many lysosomes and a fibroblast with extensive rough ER and Golgi are very different. This shows that a cell&#x27;s structures follow the job it is specialised to do, not simply the DNA it carries. (c) Cells of the same type form tissues (epidermal cells form epithelial tissue), tissues form organs (the skin), organs form organ systems (the integumentary system), and organ systems form the whole organism. Platelets, neutrophils, macrophages, fibroblasts and epidermal cells each do only one part of the job. Healing needs all of them organised and working together, so shape determines the job at the cell level, but organisation determines survival at the organism level.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;Section 5: Final Explanation of The Healing Cut&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Write a complete explanation answering the driving question: Why do cells in our body look so different from each other, and how does the shape of a cell determine the job it can do? Tell the story of the cut finger in order, from the moment of the cut until the skin is closed. Name at least four cell types or cell fragments involved, describe the shape or organelle that suits each to its job, and show how they work together. Finish by saying how your thinking has changed since Lesson 1.&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;When the Nairobi student cuts a finger, platelets, which are small, sticky cell fragments with no nucleus, gather at the wound and start clotting, so bleeding slows and a scab forms. Neutrophils, with a multi-lobed nucleus and many lysosomes, engulf and digest bacteria that enter the cut. Macrophages, with irregular, flexible membranes, engulf debris and dead cells. Fibroblasts, which are elongated with lots of rough endoplasmic reticulum and Golgi apparatus, make and secrete collagen to rebuild the tissue. Epidermal cells, which are tightly packed with an active nucleus, divide and migrate across the wound to close the surface, and they can move because animal cells have no rigid cell wall. All the cells came from the same organism and carry the same DNA, but different genes are expressed in each, so each builds different structures. Every cell&#x27;s shape is a solution to a particular job, so shape determines function. These cells and fragments are organised into tissues, organs (the skin) and organ systems, so they work together as a team and heal the finger so that it looks almost as it did before. At the start I thought healing was one simple process that just happens. Now I understand that it is many jobs done by different specialised cells, each shaped for its job, and organised into a living, self-repairing body.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;4&quot;&gt;&lt;p&gt;&lt;strong&gt;RUBRIC&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Criterion&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Excellent (4)&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Proficient (3)&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Developing (1–2)&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;Use of cell structure knowledge&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Accurately names and describes organelles and structures (cell theory, prokaryote versus eukaryote, plant versus animal cells) and links each to its function with correct scientific vocabulary.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Names most structures and functions correctly, with minor errors or gaps in the comparisons.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Names few structures, or confuses plant and animal features or prokaryotes and eukaryotes.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;Linking structure to function&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;For several specialised cells, clearly explains how a specific structural feature enables the job the cell does, including the sickle-cell evidence.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Explains structure-function links for some cells but the reasoning is sometimes incomplete.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Lists features or functions without connecting them to each other.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;Use of evidence and reasoning (CER)&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Makes clear claims supported by specific evidence from lessons (onion and cheek practicals, micrographs) and reasons logically from evidence to claim.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Gives claims with some evidence, but the reasoning is thin or one part of CER is missing.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Makes statements with little or no evidence from the lessons.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;Explaining the healing cut and the driving question&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Gives a complete, correctly sequenced story of healing, naming at least four cell types or fragments, explaining same DNA with different gene expression, and the tissue-to-organism hierarchy.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Gives a mostly complete explanation, with some cell types, the sequence or the DNA and hierarchy ideas weak.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Gives a partial or unordered explanation that does not answer the driving question.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;Reflection and communication&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Clearly shows how thinking has changed since Lesson 1, written in organised, clear sentences with correct terms.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Shows some change in thinking, with generally clear writing.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Reflection is missing or very general, and the writing is hard to follow.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;p&gt;&lt;strong&gt;ATTRIBUTION AND LICENSING&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Curriculum Alignment: &lt;/strong&gt;Structured in pedagogical alignment with the competence-based curriculum format and learning outcomes established by the Kenya Institute of Curriculum Development (KICD). This material is independently developed and is not officially endorsed or published by KICD.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Content &amp;amp; Pedagogy: &lt;/strong&gt;Developed and adapted by the educator team at SeaVuria (registered 501(c)(3) in the United States and registered NGO in Kenya, No. 872-850A-BF11), who designed the pedagogical framework, lesson templates and exemplar lessons on which this material is based.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Production &amp;amp; Layout: &lt;/strong&gt;Educational design and curriculum sequencing by SeaVuria. Technical layout, structural formatting, and digital optimization/implementation executed in partnership with ARES Education (registered 501(c)(3) in the United States and Canada (as Afretech Aid) and registered NGO in Kenya), with lesson drafting and compilation assisted by AI (Claude, Anthropic).&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Licensing &amp;amp; Copyright: &lt;/strong&gt;© 2026 SeaVuria and ARES Education. This work is licensed under a &lt;a href=&quot;https://creativecommons.org/licenses/by-nc/4.0/&quot;&gt;Creative Commons Attribution-NonCommercial 4.0 International License&lt;/a&gt; (&lt;a href=&quot;https://creativecommons.org/licenses/by-nc/4.0/&quot;&gt;CC BY-NC 4.0&lt;/a&gt;). To view a copy of this license, visit &lt;a href=&quot;https://creativecommons.org/licenses/by-nc/4.0/&quot;&gt;https://creativecommons.org/licenses/by-nc/4.0/&lt;/a&gt;. You are free to copy, redistribute, and adapt this material in any medium or format, provided appropriate credit is given and the material is not used for commercial purposes. KICD learning outcomes and curriculum designations reproduced here for alignment purposes remain the property of KICD and are not covered by this license. Linked external resources (e.g. CK-12, Khan Academy, PhET) are subject to their own licenses.&lt;/p&gt;&lt;/div&gt;

&lt;details class=&quot;lp-section&quot; id=&quot;doc-summary-table&quot; data-document-section&gt;
  &lt;summary&gt;Summary Table&lt;/summary&gt;
  &lt;div class=&quot;lp-document doc-preview&quot;&gt;&lt;p&gt;&lt;strong&gt;SUMMARY TABLE: BIOLOGY GRADE 10&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;em&gt;Sub-Strand 1.1: Cell Structure — Teacher Reference (Pre-filled)&lt;/em&gt;&lt;/p&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;SUMMARY TABLE: BIOLOGY GRADE 10&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Sub-Strand&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Sub-Strand 1.1: Cell Structure&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Driving Question&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;DRIVING QUESTION: &quot;Why do cells in our body look so different from each other — and how does the shape of a cell determine the job it can do?&quot;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;INSTRUCTIONS&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;FOR TEACHERS: This is the teacher reference version — each row is pre-filled with expected student responses. Use it to assess student Summary Tables, identify gaps, and prepare discussion questions. The student version has blank cells for students to complete after each lesson.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Lesson # and Title&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;What did I observe?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;What did I learn?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;How does this explain the phenomenon?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Lesson 1&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;The Healing Cut: Launching Our Investigation Into Why Cells Look Different&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;We observed a sequence of changes that happen when a finger is cut — bleeding slows, a clot forms, a scab develops, and new skin appears over several days&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;We learned that this familiar process is actually made up of many simultaneous events, and that scientists have found many different types of tiny structures working together during wound healing&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;We cannot yet explain why different structures look different or how each one knows what job to do — these are exactly the questions our Driving Question Board will help us answer over the next eleven lessons&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Lesson 2&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;What Is a Cell? Introduction to Cell Theory&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;In this lesson, learners observed labelled diagrams of generalised animal cells, plant cells, and prokaryotic cells. They sorted structural feature cards into Prokaryote and Eukaryote categories and studied the ugali-kitchen analogy mapped onto cell structure components.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners learned the three tenets of cell theory (all living things are made of cells; the cell is the basic unit of life; all cells arise from pre-existing cells) and the contributions of Schleiden, Schwann, and Virchow. They learned the key structural differences between prokaryotic and eukaryotic cells, including the presence or absence of a membrane-bound nucleus and membrane-bound organelles.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners explained, using a Claim–Evidence–Reasoning paragraph, how Virchow&#x27;s tenet (&#x27;all cells from pre-existing cells&#x27;) accounts for the production of new skin cells during the healing of Amina&#x27;s finger. They also explained their Version 1 cell model using a labelled diagram with a structural-function key and articulated the limitations of their current model.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Lesson 3&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Prokaryotic vs. Eukaryotic Cells: Two Worlds Inside One Body&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners observed two labelled diagrams — E. coli (prokaryote, linked to nyama choma food poisoning) and a human cheek cell (eukaryote) — and identified structural differences including the presence or absence of a membrane-bound nucleus, membrane-bound organelles, relative size, and cell wall composition.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Prokaryotic cells (such as E. coli bacteria) lack a membrane-bound nucleus and membrane-bound organelles; their DNA floats freely in a nucleoid region. Eukaryotic cells (such as human cheek cells) have a membrane-bound nucleus and membrane-bound organelles. Prokaryotes are generally much smaller (1–5 micrometres) than eukaryotes (10–100 micrometres). Both cell types contain ribosomes, but ribosomes are not membrane-bound in either.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;The bacteria that could infect Amina&#x27;s cut (E. coli) are prokaryotes — structurally far simpler than her own body cells, which are eukaryotes. The presence of a membrane-bound nucleus in eukaryotic cells allows DNA to be protected and gene expression to be regulated in ways that support the complexity needed for wound healing. This structural difference explains why, even though bacteria and human cells are both alive, they behave so differently — and why Amina&#x27;s white blood cells (eukaryotes) can carry out the complex task of recognising and destroying E. coli (prokaryote) cells in the wound.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Lesson 4&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Plant Cell Ultrastructure — Every Organelle Has a Farming Job&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;A fully labelled plant cell diagram and (where available) electron micrograph images of a maize leaf chloroplast, a central vacuole in an onion cell, and a plant cell wall boundary.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Plant cells contain nine key organelles — cell wall, cell membrane, nucleus, chloroplasts, large central vacuole, mitochondria, endoplasmic reticulum, ribosomes, and Golgi apparatus — each with a specific structure-linked function, mapped to roles on a Rift Valley maize farm.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Unlike the animal cells (e.g., epidermal cells, platelets) involved in healing Amina&#x27;s cut, plant cells have organelles such as chloroplasts and a large central vacuole that reflect their unique job: making their own food and maintaining structural pressure. Structure and function are inseparable — a principle that applies equally to the specialised cells in the wound-healing phenomenon.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Lesson 5&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Animal Cell Ultrastructure — Comparing Plant and Animal Cells&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners received and analysed a labelled animal cell ultrastructure diagram alongside their Lesson 4 plant cell diagram. They completed a structured Comparison Table identifying organelles as present or absent in each cell type, and delivered group presentations of annotated diagrams with peer feedback.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Animal cells contain lysosomes (membrane-bound sacs of digestive enzymes) and centrioles (which organise cell division) — organelles absent in plant cells. Plant cells uniquely possess a cell wall, chloroplasts, and a large central vacuole. Nucleus, mitochondria, ribosomes, ER, Golgi apparatus, and cell membrane are shared. These structural differences reflect the different functional demands on each cell type.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners constructed Functional Justifications explaining why animal cells lack cell walls (flexibility needed for movement and shape change), chloroplasts (they obtain energy from food, not photosynthesis), and large vacuoles (no need for turgor pressure maintenance). They connected organelles to specific cells in the cut finger phenomenon — e.g., lysosomes in neutrophils digesting bacteria, centrioles enabling epidermal cell division during wound closure. Version 3 of the cumulative cell model was completed: a side-by-side colour-coded Plant vs. Animal diagram with a Model Revision Note.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Lesson 6&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Microscopy Practical 1 — Observing Onion Epidermal Cells&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Onion epidermal cells prepared as temporary wet mount slides stained with iodine: rectangular cells with visible cell wall, large central vacuole, nucleus stained dark brown/yellow by iodine, cytoplasm, and cell membrane pressed against the inner cell wall. NO chloroplasts observed.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Onion epidermal cells are plant cells that contain a cell wall, vacuole, and nucleus — but NO chloroplasts, because the onion bulb grows underground and is not exposed to light. This is evidence of cell specialisation: the onion epidermal cell is adapted for protection and storage, not photosynthesis. All plant cells share some features (cell wall, vacuole) but differ in which organelles they contain depending on their function.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;The absence of chloroplasts in onion skin cells is not an error — it is evidence of specialisation. Cells only build and maintain the structures they need for their specific job. Just as the cells healing the Nairobi student&#x27;s cut finger are each specialised (platelets for clotting, fibroblasts for collagen, epidermal cells for surface repair), the onion epidermal cell is specialised for its role. This confirms that having the same DNA does not mean every cell builds the same structures — gene expression is selective, and structure is determined by function.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Lesson 7&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Microscopy Practical 2 — Human Cheek Cells: Observing Animal Cell Structure&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners prepared temporary wet mounts of their own cheek (buccal) cells using methylene blue stain, focused them under a compound light microscope, and produced labelled biological drawings. They directly observed a cell membrane, cytoplasm, and nucleus in each cheek cell.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Animal cells (such as human cheek epithelial cells) contain a cell membrane, cytoplasm, and a membrane-bound nucleus, but lack a cell wall, chloroplasts, and a large central vacuole — structures present in the plant (onion) cells observed in Lesson 6. The absence of a rigid cell wall allows animal cells to adopt flexible, irregular shapes.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;The structural differences between plant and animal cells are not random — they reflect the different needs and lifestyles of each cell type. The absence of a cell wall in animal cells allows them to change shape, which is directly relevant to the anchoring phenomenon: cells such as platelets and epidermal cells can flatten, extend, and migrate during wound healing precisely because they are not constrained by a rigid outer wall. This is one piece of the larger puzzle of how cell shape determines cell function.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Lesson 8&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Cell Specialisation: Meaning, Significance, and Specialised Animal Cells&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners examined annotated diagrams and micrographs of five specialised animal cells — red blood cells (biconcave, no nucleus), white blood cells (irregular shape, many lysosomes), nerve cells (long axon, myelin sheath), sperm cells (flagellum, mitochondria-packed midpiece), and muscle cells (many mitochondria, myofilaments) — and compared normal red blood cells with sickle cells using printed micrograph evidence.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners learned that cell specialisation is the process by which cells develop distinct structures that equip them for specific functions; that structural features such as the absence of a nucleus (RBC), a long axon (neuron), or a flagellum (sperm) are not random but are direct adaptations to function; and that when cell shape is disrupted — as in sickle-cell anaemia — function is catastrophically compromised, providing powerful evidence that shape determines function.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners explained how each of the five specialised animal cells contributes to the healing-cut phenomenon sequence — red blood cells deliver oxygen to repair tissue, white blood cells engulf bacteria at the wound site, nerve cells transmit pain signals, muscle cells enable movement that keeps the wound protected, and sperm cells (while not directly involved in healing) demonstrate the principle that extreme specialisation trades generalist survival for singular functional excellence. Learners used the Claim-Evidence-Reasoning framework to argue from the sickle-cell micrograph that cell shape is the physical basis of cell function.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Lesson 9&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Specialised Plant Cells: Form Meets Function in the Bean Seedling&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners observed detailed diagrams (and where available, microscope slides or projected images) of five specialised plant cells — root hair cell, guard cell, xylem vessel, phloem sieve tube, and palisade mesophyll cell — recording labelled scientific drawings and completing a three-column observation table of structural features, alongside a contextual comparison of stomatal aperture in dry Turkana vs. humid Kericho.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners learned that plant cells specialise just as animal cells do; that each of the five cells has a specific structural adaptation (e.g., the long extension of root hair cells for absorption, the hollow lignified lumen of xylem for water transport, the dense chloroplasts of palisade cells for photosynthesis) that directly enables its function; and that specialised plant cells work in coordinated systems — absorption → transport → photosynthesis → regulation — mirroring the coordinated cell systems seen in wound healing.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners explained, using the Claim-Evidence-Reasoning frame, why each plant cell&#x27;s shape suits its function; constructed a &#x27;Plant Side&#x27; addition to their cumulative specialisation model with directional arrows showing how root hair cells, xylem, phloem, palisade, and guard cells work together; and drew a &#x27;bridge arrow&#x27; articulating how plant cell specialisation (particularly photosynthesis in palisade cells) provides the glucose energy that ultimately powers animal cell processes such as fibroblast collagen synthesis during wound healing.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Lesson 10&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Cell Organisation: Cells → Tissues → Organs → Organ Systems → Organism&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Annotated microscope images and diagrams showing one epidermal cell → stratified squamous epithelial tissue → skin organ cross-section → integumentary system → human body; parallel Kenyan school analogy diagram (student → class → Mwangaza Secondary School → Nairobi County Education → Kenyan society).&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Cells of the same type group together to form tissues; different tissues combine to form organs; organs working together form organ systems; organ systems together constitute the whole organism. In the wound-healing phenomenon, epidermal cells form epithelial tissue, which is part of the skin organ, which belongs to the integumentary system, which protects the entire organism.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;No single specialised cell — not the platelet, the neutrophil, the fibroblast, nor the epidermal cell — can heal the cut finger alone. Healing requires all four cell types to be organised into tissues, organs, and systems that coordinate their functions. The organisational hierarchy is what transforms individual specialised cells into a living, self-repairing organism — answering the driving question by showing that shape determines job at the cell level, but ORGANISATION determines survival at the organism level.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Lesson 11&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Synthesis and Model Revision: Putting the Cell Story Together&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;In this lesson I observed that learners could integrate their cumulative cell knowledge into a four-zone poster model, that peer feedback during the gallery walk was most precise when learners referenced specific organelles and functions rather than general impressions, and that the DQB closure generated genuine discussion about which questions were fully answered versus partially answered.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners consolidated that plant cells and animal cells share core organelles but differ in the presence of a cell wall, large central vacuole, and chloroplasts; that specialised cells in the wound-healing response have structural features directly suited to their functions; and that the organisational hierarchy from cell to organism explains how individual cell functions combine to produce complex responses such as healing.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners explained the driving question — why cells look so different and how shape determines function — by constructing an integrated model that connected organelle structure to cell function to tissue and organ roles to whole-organism response, using the Nairobi wound-healing phenomenon as the unifying explanatory context.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Lesson 12&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Consolidation, DQB Closure, and Final Explanation — The Healing Cut Fully Explained&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;The class co-constructed a complete, sequential, cell-by-cell explanation of wound healing on the board — from the moment of the cut to the closure of the skin — naming platelets, neutrophils, macrophages, fibroblasts, and epidermal cells with their shapes and key organelles. A minimum of 8 students contributed publicly via cold-call.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;All specialised cells in the body originate from the same organism and carry the same DNA, but different genes are expressed in different cells, producing different structures — and those structures directly determine function. The shape of a cell is not accidental: it is the physical expression of the job that cell is specialised to do. This is the complete answer to the driving question.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;The anchoring phenomenon — The Healing Cut — is fully explained: platelets (small, anucleate, sticky) aggregate and initiate clotting; neutrophils (multi-lobed nucleus, abundant lysosomes) engulf bacteria; macrophages (irregular, flexible membrane) engulf debris and dead cells; fibroblasts (elongated, extensive rough ER and Golgi) secrete collagen scaffolding; epidermal cells (tightly packed, active nucleus) divide and migrate to close the surface. Every cell&#x27;s shape is a solution to a specific biological problem — and that is why cells in the same organism look so completely different from each other.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;p&gt;&lt;strong&gt;ATTRIBUTION AND LICENSING&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Curriculum Alignment: &lt;/strong&gt;Structured in pedagogical alignment with the competence-based curriculum format and learning outcomes established by the Kenya Institute of Curriculum Development (KICD). This material is independently developed and is not officially endorsed or published by KICD.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Content &amp;amp; Pedagogy: &lt;/strong&gt;Developed and adapted by the educator team at SeaVuria (registered 501(c)(3) in the United States and registered NGO in Kenya, No. 872-850A-BF11), who designed the pedagogical framework, lesson templates and exemplar lessons on which this material is based.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Production &amp;amp; Layout: &lt;/strong&gt;Educational design and curriculum sequencing by SeaVuria. Technical layout, structural formatting, and digital optimization/implementation executed in partnership with ARES Education (registered 501(c)(3) in the United States and Canada (as Afretech Aid) and registered NGO in Kenya), with lesson drafting and compilation assisted by AI (Claude, Anthropic).&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Licensing &amp;amp; Copyright: &lt;/strong&gt;© 2026 SeaVuria and ARES Education. This work is licensed under a &lt;a href=&quot;https://creativecommons.org/licenses/by-nc/4.0/&quot;&gt;Creative Commons Attribution-NonCommercial 4.0 International License&lt;/a&gt; (&lt;a href=&quot;https://creativecommons.org/licenses/by-nc/4.0/&quot;&gt;CC BY-NC 4.0&lt;/a&gt;). To view a copy of this license, visit &lt;a href=&quot;https://creativecommons.org/licenses/by-nc/4.0/&quot;&gt;https://creativecommons.org/licenses/by-nc/4.0/&lt;/a&gt;. You are free to copy, redistribute, and adapt this material in any medium or format, provided appropriate credit is given and the material is not used for commercial purposes. KICD learning outcomes and curriculum designations reproduced here for alignment purposes remain the property of KICD and are not covered by this license. Linked external resources (e.g. CK-12, Khan Academy, PhET) are subject to their own licenses.&lt;/p&gt;&lt;/div&gt;

      root.querySelector(&#x27;#lp-signin&#x27;).addEventListener(&#x27;submit&#x27;,e=&gt;{e.preventDefault();show(&#x27;catalogue&#x27;);});
      root.querySelectorAll(&#x27;[data-demo]&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,e=&gt;{e.preventDefault();const id=state.screen===&#x27;login&#x27;?&#x27;auth&#x27;:state.screen;root.querySelector(&#x27;#lp-&#x27;+id+&#x27;-status&#x27;).textContent=b.dataset.demo+&#x27; · preview only&#x27;;}));

      function openSection(id){const d=root.querySelector(&#x27;#&#x27;+id);if(!d)return;const panel=d.closest(&#x27;details&#x27;);if(panel)panel.open=true;d.scrollIntoView({block:&#x27;start&#x27;,behavior:window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches?&#x27;auto&#x27;:&#x27;smooth&#x27;});}
