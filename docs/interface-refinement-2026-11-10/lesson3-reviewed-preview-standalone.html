ld that prediction. Lesson 7 — we test it.&#x27; Close by pointing to the DQB: &#x27;We now have real evidence from a real cell. Our model is stronger. But we still have questions. That is exactly how science works.&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Cumulative Model Revision — learners do not start a new diagram each lesson; they annotate and revise a single evolving model across all 12 lessons. The requirement to use a different colour for each lesson&#x27;s additions makes the growth of understanding visually explicit. Citing evidence sources (&#x27;based on evidence from…&#x27;) develops scientific epistemic habits — knowing not just WHAT we believe but WHY and on what basis.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicator: The revised model contains at least one addition or correction made in a new colour that is traceable to today&#x27;s practical observation (not copied from a textbook diagram). The chloroplast annotation explicitly notes the condition under which chloroplasts are present (light-exposed cells) versus absent (onion epidermis, animal cells). The prediction sentence for Lesson 7 names at least one specific structural difference between plant and animal cells. Teacher collects practical books of one group (rotate groups each lesson) for detailed written feedback — returned before Lesson 7.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;D. TEACHER REFLECTION&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;After the lesson, reflect on the following questions before planning Lesson 7:&lt;/p&gt;&lt;p&gt;(1) EVIDENCE QUALITY: Did every learner produce a labelled drawing with at least 4 structures at both low and high power? If not — was this a focusing skill issue (needs more practice), a labelling knowledge issue (needs vocabulary consolidation), or a time issue (practical took too long)? Adjust Lesson 7 timing accordingly.&lt;/p&gt;&lt;p&gt;(2) THE CHLOROPLAST MOMENT: Did the absence of chloroplasts generate genuine surprise and productive discussion, or did learners already know this and treat it as routine? If the latter, the anomaly was not sufficiently foregrounded — consider opening Lesson 7 with a more provocative prediction prompt.&lt;/p&gt;&lt;p&gt;(3) CER WRITING: How many learners successfully linked their observation to the anchoring phenomenon in their 3-sentence explanation? If fewer than 60% made the explicit connection to the healing finger, begin Lesson 7 with a 3-minute re-read of the phenomenon before any new content.&lt;/p&gt;&lt;p&gt;(4) DQB VITALITY: Are the new questions on the DQB substantive and forward-pointing (e.g., &#x27;Will animal cells have a cell wall?&#x27;, &#x27;How does the fibroblast know to make collagen?&#x27;) or vague and generic? Substantive questions indicate learners are genuinely engaging with the phenomenon. Vague questions may indicate the DQB routine needs re-scaffolding.&lt;/p&gt;&lt;p&gt;(5) SAFETY: Were all safety protocols followed without prompting? Note any groups that needed reminders about goggles or broken glass disposal — address this explicitly at the START of Lesson 7 before the second microscopy practical begins.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;E. SUMMARY TABLE PROMPT  (pre-filled example for this lesson)&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;What did I observe?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Onion epidermal cells prepared as temporary wet mount slides stained with iodine: rectangular cells with visible cell wall, large central vacuole, nucleus stained dark brown/yellow by iodine, cytoplasm, and cell membrane pressed against the inner cell wall. NO chloroplasts observed.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;What did I learn?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Onion epidermal cells are plant cells that contain a cell wall, vacuole, and nucleus — but NO chloroplasts, because the onion bulb grows underground and is not exposed to light. This is evidence of cell specialisation: the onion epidermal cell is adapted for protection and storage, not photosynthesis. All plant cells share some features (cell wall, vacuole) but differ in which organelles they contain depending on their function.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;How does this explain the phenomenon?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;The absence of chloroplasts in onion skin cells is not an error — it is evidence of specialisation. Cells only build and maintain the structures they need for their specific job. Just as the cells healing the Nairobi student&#x27;s cut finger are each specialised (platelets for clotting, fibroblasts for collagen, epidermal cells for surface repair), the onion epidermal cell is specialised for its role. This confirms that having the same DNA does not mean every cell builds the same structures — gene expression is selective, and structure is determined by function.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;p&gt;© 2026 SeaVuria and ARES Education. Aligned with KICD objectives. Developed by SeaVuria; technical implementation by ARES (with AI assistance from Claude). Licensed under &lt;a href=&quot;https://creativecommons.org/licenses/by-nc/4.0/&quot;&gt;CC BY-NC 4.0&lt;/a&gt; (&lt;a href=&quot;https://creativecommons.org/licenses/by-nc/4.0/&quot;&gt;https://creativecommons.org/licenses/by-nc/4.0/&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
&lt;/details&gt;

&lt;details class=&quot;lp-section&quot; id=&quot;lesson-7&quot; data-document-section&gt;
  &lt;summary&gt;Lesson 7 · Microscopy Practical 2 — Human Cheek Cells: Observing Animal Cell Structure&lt;/summary&gt;
  &lt;div class=&quot;lp-document doc-preview&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;LESSON 7 (80 minutes): Microscopy Practical 2 — Human Cheek Cells: Observing Animal Cell Structure&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;A. SPECIFIC LEARNING OUTCOMES&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Category&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Specific Learning Outcomes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Purpose&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;To enable learners to prepare temporary slides of human cheek (buccal) cells, observe their structure under a microscope, and directly compare animal cell architecture with the plant cell observations made in Lesson 6.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Knowledge&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners will know that animal cells possess a cell membrane, cytoplasm, and nucleus but lack a cell wall, chloroplasts, and a large central vacuole. Learners will know that the absence of a rigid cell wall gives animal cells a flexible, irregular shape suited to their functions.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Skills&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners will be able to: (i) prepare a temporary wet mount of cheek cells using methylene blue stain; (ii) focus a compound light microscope to obtain a clear image of cheek cells; (iii) produce a labelled biological drawing of cheek cells to standard conventions; (iv) articulate at least two directly observed structural differences between plant (onion) and animal (cheek) cells.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Attitudes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners will appreciate the value of careful, systematic observation in revealing biological truths that are otherwise invisible to the naked eye, and will take personal responsibility for hygienic laboratory practice.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Key Inquiry Question&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;What are the structural differences between plant and animal cells, and what do those differences suggest about how each cell type functions?&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Purpose in Storyline&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;In Lessons 1–6 learners established that the healing cut involves multiple specialised cells, and in Lesson 6 they built a reference image of a plant cell from onion epidermis. Lesson 7 now gives learners their first direct look at an animal cell — their own cheek cells — so they can gather concrete, first-hand evidence of what animal cells do and do not contain. This evidence is essential for answering the driving question: the flexible, wall-free shape of a cheek epithelial cell foreshadows why a red blood cell can be disc-shaped, why a platelet can change form during clotting, and why epidermal cells can migrate across a wound. Every structural observation today feeds directly into the class model of cell specialisation.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Safety Notes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners must use clean cotton swabs (one per learner — never shared) to collect cheek cells; used swabs must be disposed of immediately into a closed bin containing dilute disinfectant (1% bleach solution prepared by the teacher in advance). Methylene blue is a mild irritant — learners must avoid contact with eyes and skin and wash hands thoroughly after the practical. Microscope slides and cover slips are fragile — broken glass must be reported immediately and swept up by the teacher using a dustpan, never bare hands. No learner should perform this practical if they have an open sore or active oral infection; the teacher should identify and assign them the role of data recorder instead.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;B. LESSON OVERVIEW&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;Learners open the lesson by revisiting their Lesson 6 annotated drawings of onion epidermal cells and making written predictions about what they expect to find — or not find — in a human cell. They then conduct a full microscopy practical: scraping their own cheek cells with a cotton swab, preparing a methylene blue wet mount, focusing the microscope, and producing a labelled biological drawing. A structured pair-comparison activity places the cheek cell drawing directly beside the onion cell drawing, and learners generate a two-column evidence table of observed similarities and differences. The lesson closes with a Driving Question Board (DQB) update in which learners add new evidence cards and revise their cumulative class model of cell structure, sharpening the contrast between plant and animal cell architecture.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;5&quot;&gt;&lt;p&gt;&lt;strong&gt;C. LESSON IMPLEMENTATION FRAMEWORK&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Phase&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Learner Experience&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Teacher Moves&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Sensemaking Strategy&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Formative Assessment Strategy&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Predict Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/8640601f847a586e97f0030c90135a9c&quot;&gt;Comparing animal and plant cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+cheek+buccal+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/26cbebba12c35a488ff3d37d5427b3eb&quot;&gt;Plant vs animal cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+cheek+buccal+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners retrieve their Lesson 6 annotated drawings of onion epidermal cells from their science notebooks. Working individually for 3 minutes, they write a &#x27;Prediction Card&#x27; answering: &#x27;I am about to look at a cell from the inside of my own cheek. Compared with the onion cell I drew last lesson, I predict I will see ___ and I predict I will NOT see ___, because ___.&#x27; Learners then share predictions with a shoulder partner (2 min), and the teacher cold-calls four pairs to share one agreement and one point of disagreement before the practical begins.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Display the Lesson 6 onion cell drawing on the board (use a pre-prepared exemplar or photograph a strong student drawing from Lesson 6). Say: &#x27;Before we touch any equipment, I want your brain to do some work. Look at your onion cell drawing. That was a PLANT cell. You are about to look at YOUR OWN cell — an animal cell. On your Prediction Card, complete these two stems: I predict I WILL see… and I predict I will NOT see… Give me a reason for each.&#x27; Allow 3 minutes of silent individual writing. DO NOT accept verbal answers yet — enforce silence to protect thinking time. After 3 minutes say: &#x27;Turn to your shoulder partner. You have 2 minutes — find ONE thing you agree on and ONE thing you disagree on.&#x27; After pair talk, cold-call exactly 4 pairs using the class register (rows 1, 3, 5, 7): &#x27;Pair in row 1 — what did you AGREE on?&#x27; Record responses on the board under two columns: AGREED and DISAGREED. Do not correct misconceptions yet — annotate with a &#x27;?&#x27; to flag for revisiting. Close the predict phase by saying: &#x27;Keep your Prediction Card visible — we will come back to it the moment we finish observing. Scientists always test their own predictions.&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Prediction Activation with Anchored Retrieval — learners are required to retrieve prior observational knowledge (onion cell structure from Lesson 6) and apply it as a cognitive baseline before new evidence is gathered. This creates productive cognitive dissonance when animal cell observations diverge from predictions, making the structural differences more memorable and meaningful.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Teacher circulates during individual writing and scans Prediction Cards for two indicators: (1) Does the learner correctly identify at least one plant-cell-specific structure (cell wall, chloroplasts, large vacuole) that they predict will be absent in the cheek cell? (2) Does the learner offer a reason connected to cell type (plant vs. animal), not just a guess? Cards that show neither indicator flag learners who need targeted questioning during the practical phase. Record names for follow-up.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Observe Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/8640601f847a586e97f0030c90135a9c&quot;&gt;Comparing animal and plant cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+cheek+buccal+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/26cbebba12c35a488ff3d37d5427b3eb&quot;&gt;Plant vs animal cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+cheek+buccal+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners work in pairs at bench stations. Each learner independently prepares their own cheek cell slide following a step-by-step printed protocol card: (1) Gently scrape the inner cheek with the flat end of a clean cotton swab. (2) Smear the swab in a thin circle on the centre of a clean glass slide. (3) Add ONE drop of methylene blue stain. (4) Lower a cover slip at 45° to avoid bubbles. (5) Use tissue to blot excess stain. (6) Place on microscope stage and focus under low power (×4 objective), then switch to medium power (×10), then high power (×40). (7) Select the clearest, most isolated cell visible and produce a large pencil biological drawing (minimum 5 cm diameter) in the designated box in their notebook. Learners label every structure they can positively identify with a ruled label line and a clear label word. They annotate their drawing with the magnification used and the date. Partner observes the same slide and verifies the drawing before the slide is discarded safely.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Before learners touch equipment, deliver a 4-minute safety and technique briefing: &#x27;Three non-negotiables today: one swab per person — no sharing; used swabs go directly into the bleach bin — do not place them on the bench; if a slide breaks, hands OFF and call me immediately.&#x27; Demonstrate the cheek smear and staining technique live at the front bench, narrating each step aloud. Emphasise: &#x27;The smear should be thin enough to read newsprint through it — too thick and you will not see individual cells.&#x27; Circulate continuously during the practical. At each station ask one diagnostic question — rotate through: &#x27;What is the blue stain doing to the cell?&#x27;, &#x27;Why can you see the nucleus more clearly now?&#x27;, &#x27;What structure would you expect to see in the onion cell that you do NOT see here?&#x27;. Allow 25 minutes total for slide preparation, focusing, and drawing. At the 20-minute mark give a verbal time warning: &#x27;Five minutes remaining for your drawing — make sure every structure you can see has a label line.&#x27; After drawings are complete, direct learners to compare their drawing side-by-side with their Lesson 6 onion cell drawing and complete a two-column evidence table in their notebooks: ONION CELL (plant) | CHEEK CELL (animal) — list every structure under each column, marking shared structures with a tick and unique structures with a star.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Direct Observational Drawing with Structured Comparative Table — biological drawing is not merely an art task; requiring learners to commit to labelled lines forces active discrimination between what is and is not visible. The immediate side-by-side comparison with the Lesson 6 onion drawing transforms two individual observations into comparative evidence, which is the core epistemic move needed to answer the driving question about structural differences between cell types.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Teacher uses a &#x27;Drawing Checklist Clipboard&#x27; — a printed grid with learner names. For each pair, check: (1) Drawing is large (≥5 cm), in pencil, with smooth outlines — no shading or artistic hatching. (2) At least three structures labelled (cell membrane, cytoplasm, nucleus at minimum). (3) Magnification recorded. (4) No cell wall labelled — if a learner has labelled a cell wall on the cheek cell, stop and ask: &#x27;Show me the cell wall on your slide right now under the microscope.&#x27; This is the single most critical misconception to intercept in real time. Record any learner who cannot distinguish cell wall absence as a targeted follow-up for Phase 3.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Explain Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/98ccf1c8b3d35cfea5093cdb61b64836&quot;&gt;Prokaryotic and eukaryotic cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+cheek+buccal+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 HTML:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/f8334e2c3d2b5e83ab4079366011884a&quot;&gt;Cell Membrane (Flexbook)&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+cheek+buccal+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners participate in a whole-class &#x27;Evidence Harvest&#x27; (10 min). Each pair contributes ONE observation from their comparative evidence table to a class T-chart built on the board: PRESENT IN BOTH | ONLY IN PLANT CELL (onion) | ONLY IN ANIMAL CELL (cheek). After the T-chart is populated, learners individually write a 3-sentence scientific explanation in their notebooks answering: &#x27;What structural differences between plant and animal cells did you directly observe today, and what might the absence of a cell wall mean for an animal cell&#x27;s ability to change shape?&#x27; Learners then connect their explanation back to the anchoring phenomenon by completing the sentence stem: &#x27;When the platelets in Aisha&#x27;s cut finger change shape to form a clot, this is possible because animal cells…&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Facilitate the Evidence Harvest using a structured round-robin: go around the room, one pair per turn, each pair contributes ONE item to the T-chart. Say: &#x27;I need one observation from your table — something you actually SAW, not something from the textbook.&#x27; After the T-chart is complete (allow 6–7 minutes), ask the class: &#x27;Look at the ONLY IN PLANT CELL column. Every item in that column — what do they all have in common in terms of function?&#x27; Wait 12 seconds (count silently). Cold-call three learners. Guide toward the answer that plant-specific structures (cell wall, large vacuole, chloroplasts) are all related to the plant&#x27;s fixed, non-moving lifestyle. Then say: &#x27;Now look at the ONLY IN ANIMAL CELL column — or notice what is NOT there. What does the absence of a rigid cell wall allow an animal cell to do that a plant cell cannot easily do?&#x27; Wait 10 seconds. Cold-call two learners. After responses, explicitly connect to the phenomenon: &#x27;Remember Aisha&#x27;s platelets — tiny, irregular animal cells that flatten and extend pseudopods to patch the wound. Could they do that if they had a rigid cell wall? Turn and tell your partner — 30 seconds.&#x27; Cold-call one pair. Close the explain phase by directing learners to write their 3-sentence individual explanation and the phenomenon sentence stem. Circulate and read over shoulders — look for correct use of the terms: cell membrane, cytoplasm, nucleus, cell wall, flexibility.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Evidence Harvest T-Chart followed by Phenomenon-Anchored Sentence Stem Writing — the T-chart externalises and organises collective observational evidence so the class builds a shared knowledge base rather than 30 isolated individual observations. The phenomenon sentence stem then requires each learner to privately apply that shared knowledge back to the original puzzling event, closing the predict–observe–explain loop and reinforcing that science observations have explanatory power.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Collect and read the 3-sentence explanations and the phenomenon stem as an exit indicator. Look for three quality markers: (1) At least two specific structures named with correct terminology. (2) The word &#x27;flexible&#x27; or an equivalent (e.g., &#x27;can change shape&#x27;, &#x27;no rigid wall&#x27;) appears in the explanation. (3) The phenomenon sentence correctly links the absence of a cell wall to platelet function or animal cell motility. Learners who meet all three markers are ready for Phase 4. Learners who meet one or zero markers receive a targeted prompt card at the DQB phase: &#x27;Go back to your T-chart — which column has cell wall? Is a cheek cell in that column?&#x27;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Driving Question Board (DQB) Creation&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/modules/Seavuria/Seavuria%20Science%20Videos/Biology/Biology%20Videos/02%20Structure%20%26%20Function%20of%20the%20Cell%20Membrane/01%20Overview%20of%20The%20Cell%20Membrane.mp4&quot;&gt;01 Overview Of The Cell Membrane&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Seavuria&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+cheek+buccal+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/50b582eb14ba5b978153e0741a6cdddb&quot;&gt;Cell Membrane Practice&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+cheek+buccal+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Each learner writes one new &#x27;Evidence Card&#x27; (on a sticky note or index card) using the sentence frame provided: &#x27;We observed that animal cells have no cell wall — this tells us…&#x27; They post their card on the class DQB under the section labelled &#x27;Lesson 7 Evidence&#x27;. Learners then read at least two classmates&#x27; cards and place a small tick on any card that adds an idea they had not written themselves. The class briefly discusses (5 min) which new evidence cards most directly advance the driving question: &#x27;Why do cells look so different from each other, and how does shape determine job?&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Give learners 3 minutes of silent writing time for their Evidence Card. Enforce silence: &#x27;This is YOUR thinking — no copying from the board yet.&#x27; After cards are posted, say: &#x27;Walk the board. Read at least two cards that are NOT yours. Tick any card that teaches you something new.&#x27; Allow 2 minutes of gallery walk. Then facilitate a 5-minute whole-class DQB debrief: &#x27;Which card on this board most directly answers part of our driving question?&#x27; Cold-call three learners to nominate a card and explain their choice. Ask: &#x27;What NEW question does today&#x27;s evidence raise that we have not yet answered?&#x27; Record any new questions on the DQB under a &#x27;NEW QUESTIONS — Lesson 7&#x27; strip. Likely emergent questions include: &#x27;If animal cells have no wall, what stops them from bursting?&#x27;, &#x27;Do all animal cells look like cheek cells?&#x27;, and &#x27;Why does the nucleus look darker in some cells?&#x27; Validate all questions: &#x27;These are exactly the questions a biologist would ask. We will need more evidence to answer them.&#x27; Point to the driving question displayed at the top of the DQB and ask: &#x27;Can we answer it yet — fully? Partially? What piece of the puzzle are we still missing?&#x27; Accept partial answers only — the full answer requires specialisation lessons ahead.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Collaborative Evidence Curation on a Living DQB — the DQB is not a display; it is a living epistemic record that makes the class&#x27;s growing understanding visible and accountable. Requiring learners to read and tick peers&#x27; cards introduces social comparison of ideas, which research shows increases conceptual depth. The teacher&#x27;s move of explicitly naming &#x27;new questions raised by new evidence&#x27; models the iterative nature of scientific inquiry and sustains intellectual curiosity across the 12-lesson sequence.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Teacher photographs the DQB after the lesson for analysis. Evaluate the distribution of Evidence Cards against three tiers: Tier 1 — card simply restates observation (&#x27;We saw no cell wall&#x27;); Tier 2 — card makes an inference (&#x27;This tells us animal cells can be more flexible&#x27;); Tier 3 — card connects to the phenomenon (&#x27;This tells us platelets can change shape to plug Aisha&#x27;s wound because they have no rigid wall&#x27;). Aim: by Lesson 7, at least 50% of cards should be Tier 2 or 3. Cards that are Tier 1 only flag learners for the teacher&#x27;s targeted small-group discussion at the start of Lesson 8.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Model Building Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/9f2d3e6f004d59c7a0106ab068d0cf53&quot;&gt;Organelles in eukaryotic cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+cheek+buccal+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/9909fc051e7e54c99380f1f894102ddb&quot;&gt;The cell membrane&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+cheek+buccal+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners open their cumulative &#x27;Cell Structure Model&#x27; page — a running annotated diagram that has been updated in every lesson since Lesson 1. Today they add a second diagram: a correctly proportioned, labelled animal cell (cheek cell) drawn to the same scale as their existing plant cell diagram. They then draw arrows between matching structures in the two diagrams (e.g., nucleus ↔ nucleus) and write one sentence next to each structure that is ABSENT in the animal cell, explaining what function that missing structure serves in the plant cell. Finally, learners write a &#x27;Model Update Statement&#x27; at the bottom of the page: &#x27;My model now shows… but does not yet explain…&#x27; to track the boundary of their current understanding.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Say: &#x27;Open to your Cell Structure Model page. You have been building this since Lesson 1. Today you are adding the animal cell — draw it next to your plant cell. Make them roughly the same size so we can compare directly.&#x27; Allow 8 minutes of independent drawing and annotation. Circulate and check: (1) Is the animal cell drawn without a cell wall? (2) Is the nucleus drawn as a distinct, membrane-bound structure inside the cytoplasm? (3) Are label lines ruled and horizontal? After 8 minutes, ask learners to write their Model Update Statement: &#x27;Write: My model now shows… but does not yet explain…&#x27;. Say: &#x27;The second part is just as important as the first. A scientist who knows what their model CANNOT explain yet is a scientist who knows what to investigate next.&#x27; Cold-call three learners to read their &#x27;does not yet explain&#x27; clause aloud. Record these on the board as &#x27;Open Questions for Our Model&#x27; — they become the bridge to Lesson 8 on cell specialisation. Close the lesson: &#x27;You have just looked at your own cells under a microscope — the same type of cell that lines the inside of the wound when Aisha cut her finger. Next lesson, we ask: if all these cells started the same way, how did they end up so different?&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Cumulative Annotated Model Building with Explicit Knowledge-Boundary Tracking — requiring learners to add to a running model (rather than draw a fresh one each lesson) makes conceptual progression visible and tangible. The &#x27;does not yet explain&#x27; clause is a metacognitive tool: it trains learners to distinguish between what the model represents and what it cannot yet account for, which is a core science and engineering practice (developing and using models, NGSS SEP 2) and directly sustains the epistemic arc of the 12-lesson sequence.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Teacher collects or photographs the Model pages at the end of the lesson. Assess against four criteria: (1) Animal cell drawn without cell wall — PASS/FAIL. (2) At least three structures correctly labelled on the animal cell. (3) At least two &#x27;absent structure&#x27; sentences correctly link missing structure to its plant-cell function. (4) Model Update Statement names a specific, scientifically valid gap (e.g., &#x27;does not yet explain why red blood cells have no nucleus&#x27; rather than &#x27;does not yet explain everything&#x27;). Criterion 1 failure requires intervention at the start of Lesson 8. Criteria 3–4 inform groupings for the Lesson 8 cell specialisation collaborative task.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;D. TEACHER REFLECTION&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;After the lesson, reflect on the following questions in your professional journal:&lt;/p&gt;&lt;p&gt;1. PRACTICAL SAFETY &amp;amp; HYGIENE — Was the bleach disposal bin used correctly by all learners? Were there any incidents of swab sharing or unsafe glass handling? What adjustments will I make to the safety briefing before the next practical lesson?&lt;/p&gt;&lt;p&gt;2. DRAWING QUALITY — How many learners produced drawings that met the biological drawing standard (large, pencil, labelled, magnification recorded)? Which aspects of technique (label lines, outline smoothness, proportions) were most commonly weak? Do I need to model biological drawing conventions again at the start of Lesson 8?&lt;/p&gt;&lt;p&gt;3. CRITICAL MISCONCEPTION — Did any learners label a cell wall on their cheek cell drawing? If yes, how many, and did my in-the-moment questioning resolve the misconception? Will I need to address this again in Lesson 8 with a targeted comparison activity?&lt;/p&gt;&lt;p&gt;4. DQB EVIDENCE CARD QUALITY — What proportion of Evidence Cards reached Tier 2 or Tier 3 (inference or phenomenon connection)? What does this tell me about learners&#x27; readiness to engage with cell specialisation in Lesson 8?&lt;/p&gt;&lt;p&gt;5. PHENOMENON CONNECTION — During the Explain phase, did learners spontaneously connect the flexibility of the animal cell to platelet function in the healing cut, or did they need heavy scaffolding from me? If scaffolding was heavy, I should revisit the phenomenon narrative at the start of Lesson 8 before introducing new content.&lt;/p&gt;&lt;p&gt;6. EQUITY &amp;amp; INCLUSION — Were there any learners who could not participate in the cheek swab practical (oral sores, personal discomfort)? Were alternative roles (data recorder, drawing analyst) genuinely meaningful for those learners, or did they feel excluded? How can I design Lesson 8 to ensure full re-engagement?&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;E. SUMMARY TABLE PROMPT  (pre-filled example for this lesson)&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;What did I observe?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners prepared temporary wet mounts of their own cheek (buccal) cells using methylene blue stain, focused them under a compound light microscope, and produced labelled biological drawings. They directly observed a cell membrane, cytoplasm, and nucleus in each cheek cell.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;What did I learn?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Animal cells (such as human cheek epithelial cells) contain a cell membrane, cytoplasm, and a membrane-bound nucleus, but lack a cell wall, chloroplasts, and a large central vacuole — structures present in the plant (onion) cells observed in Lesson 6. The absence of a rigid cell wall allows animal cells to adopt flexible, irregular shapes.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;How does this explain the phenomenon?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;The structural differences between plant and animal cells are not random — they reflect the different needs and lifestyles of each cell type. The absence of a cell wall in animal cells allows them to change shape, which is directly relevant to the anchoring phenomenon: cells such as platelets and epidermal cells can flatten, extend, and migrate during wound healing precisely because they are not constrained by a rigid outer wall. This is one piece of the larger puzzle of how cell shape determines cell function.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;p&gt;© 2026 SeaVuria and ARES Education. Aligned with KICD objectives. Developed by SeaVuria; technical implementation by ARES (with AI assistance from Claude). Licensed under &lt;a href=&quot;https://creativecommons.org/licenses/by-nc/4.0/&quot;&gt;CC BY-NC 4.0&lt;/a&gt; (&lt;a href=&quot;https://creativecommons.org/licenses/by-nc/4.0/&quot;&gt;https://creativecommons.org/licenses/by-nc/4.0/&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
&lt;/details&gt;

&lt;details class=&quot;lp-section&quot; id=&quot;lesson-8&quot; data-document-section&gt;
  &lt;summary&gt;Lesson 8 · Cell Specialisation: Meaning, Significance, and Specialised Animal Cells&lt;/summary&gt;
  &lt;div class=&quot;lp-document doc-preview&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;LESSON 8 (80 minutes): Cell Specialisation: Meaning, Significance, and Specialised Animal Cells&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;A. SPECIFIC LEARNING OUTCOMES&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Category&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Specific Learning Outcomes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Purpose&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;To enable learners to explain the concept of cell specialisation and relate the structural adaptations of specialised animal cells to their specific functions, using the healing-cut phenomenon as the anchoring context.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Knowledge&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners will know: (1) the meaning and significance of cell specialisation; (2) the structural features of red blood cells, white blood cells, nerve cells, sperm cells, and muscle cells; (3) how each structural feature directly enables the cell&#x27;s function; (4) how sickle-cell anaemia illustrates the consequences of disrupted structure-function relationships.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Skills&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners will be able to: (1) identify and describe specialised animal cells from diagrams and micrographs; (2) construct annotated diagrams of at least three specialised animal cells; (3) logically link each structural adaptation to its functional advantage; (4) use evidence from the sickle-cell supporting phenomenon to argue that cell shape determines cell function.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Attitudes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners will: (1) appreciate how microscopic cell differences underpin complex body processes such as wound healing; (2) show curiosity and open-mindedness when confronting unfamiliar cell shapes; (3) value collaborative sensemaking and respect peers&#x27; reasoning during discussions.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Key Inquiry Question&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;How does cell specialisation enable organisms to carry out complex life functions?&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Purpose in Storyline&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Lesson 8 is the pivot point of the evidence-gathering sequence. Learners have spent Lessons 1–7 building knowledge of cell structure, organelles, and the distinction between plant and animal cells. Now they must answer the central puzzle of the anchoring phenomenon: if all cells share the same DNA, why do platelets, neutrophils, fibroblasts, and epidermal cells look so radically different? This lesson introduces cell specialisation as the explanatory framework, anchors five key specialised animal cells to their roles in wound healing, and uses sickle-cell anaemia as a powerful supporting phenomenon that proves structure determines function. By the end, learners can update their cumulative model with a new layer: cells are not generic — they are shaped by function.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Safety Notes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;No hazardous materials are used in this lesson. If printed micrograph cards are handled, ensure hands are washed before and after. Remind learners that the sickle-cell discussion involves a medical condition — maintain sensitivity and respectful language at all times. If any learner discloses personal or family experience with sickle-cell disease, acknowledge with care and redirect focus to the science.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;B. LESSON OVERVIEW&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;In this 80-minute lesson, learners revisit the anchoring phenomenon — the healing cut — and confront the question of why cells involved in healing look so different from one another despite originating from the same organism. The teacher re-anchors the class by displaying the phenomenon image and posing a targeted challenge question. Learners then move through a structured 5-phase cycle: they predict which structural features different animal cells might need; gather evidence by examining annotated diagrams and micrographs of five specialised animal cells (red blood cells, white blood cells, nerve cells, sperm cells, and muscle cells); construct structure-function explanations using a graphic organiser; update the Driving Question Board; and revise their cumulative cell model. The sickle-cell anaemia supporting phenomenon is woven through the Explain phase to consolidate the argument that shape is not cosmetic — it is functional. All five cells are explicitly connected to their roles in the healing-cut sequence. Lesson 8 of 12 in the evidence-gathering sequence.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;5&quot;&gt;&lt;p&gt;&lt;strong&gt;C. LESSON IMPLEMENTATION FRAMEWORK&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Phase&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Learner Experience&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Teacher Moves&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Sensemaking Strategy&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Formative Assessment Strategy&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Predict Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/47f0affff997571f967424304315abd3&quot;&gt;Red blood cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+specialised+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 HTML:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/2743305661b456e3a7657b9e17bf6ea9&quot;&gt;Nerve Cells (Flexbook)&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+specialised+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners are shown the phenomenon anchor image (a close-up of a healing finger cut) and a split-screen showing five unlabelled micrograph outlines of specialised animal cells. Working individually for 3 minutes, each learner records predictions in their science notebook under the prompt: &#x27;Each of these cells plays a role in healing this cut. Sketch what structural features you think each cell might need — and explain why.&#x27; Learners then share predictions with a shoulder partner for 2 minutes before a whole-class cold-call share-out. Predictions are displayed on a sticky-note cluster on the Driving Question Board under the header &#x27;What we THINK we know — Lesson 8&#x27;.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Display the phenomenon image and the five cell outlines side by side. Say verbatim: &#x27;You have all seen a cut heal. You now know cells have organelles. Here is the puzzle for today — these five cells all live in your body right now, and each one helped heal that cut on the finger. But they look completely different. Before I tell you anything, I want you to predict: what structural features would each cell NEED to do its job?&#x27; Distribute the prediction sheet. Allow 3 minutes of individual silent thinking — do NOT circulate or prompt during this time (enforce wait time). After 3 minutes, say: &#x27;Turn to your shoulder partner. You have 2 minutes. Compare your sketches — where do you agree? Where do you disagree?&#x27; After partner talk, cold-call 5 different learners (one per cell outline) — say: &#x27;Amina, tell me what feature you predicted for the round cell and why.&#x27; Record key predictions verbatim on the board in a &#x27;Predictions&#x27; column. Do not confirm or correct — say: &#x27;We will come back to every one of these predictions.&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Activation of Prior Knowledge + Phenomenon Re-anchoring. By forcing learners to predict before instruction, the teacher surfaces existing mental models (including misconceptions) and creates a cognitive need — a &#x27;prediction gap&#x27; — that motivates the Observe phase. Connecting predictions explicitly to the healing-cut phenomenon ensures the lesson question feels authentic rather than abstract.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicator: Each learner has at least one annotated sketch in their notebook before partner talk begins. During cold-call, listen for whether learners connect structural features to function (e.g., &#x27;it needs to be flat to carry more oxygen&#x27;) versus purely visual guesses (e.g., &#x27;it looks round&#x27;). Record names of learners who show functional reasoning — these learners can be used as peer resources in Phase 3. Flag learners who leave the prediction blank for targeted support in Phase 2.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Observe Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/fa6ac9feccb05eb7bf57bbf7568a1261&quot;&gt;Red blood cells -dubbed(KY)&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (Kiswahili)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+specialised+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/6e98b02340eb595094c87c71ef8baed9&quot;&gt;Nerve Cells Practice&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+specialised+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners work in groups of four to examine an evidence pack containing: (a) labelled, annotated diagrams of five specialised animal cells — red blood cell (biconcave disc, no nucleus, packed with haemoglobin), white blood cell/neutrophil (irregular lobed nucleus, many lysosomes, flexible membrane), nerve cell/neuron (long axon, myelin sheath, dendrites, synaptic knobs), sperm cell (streamlined head, midpiece packed with mitochondria, long flagellum), and muscle cell/myocyte (many mitochondria, parallel myofilaments, multinucleate); (b) two printed micrograph images (one showing normal red blood cells vs. sickle cells; one showing a nerve cell stained with methylene blue); and (c) a data card stating: &#x27;A red blood cell lives for ~120 days and makes ~170,000 circuits of the body. A neutrophil lives for ~6 hours during active infection.&#x27; Each group completes a structured observation table with columns: Cell Name | Structural Features Observed | Features Absent | Questions Raised. Groups are given 15 minutes. A gallery of enlarged cell diagrams is posted around the classroom walls — groups may rotate to examine them at any point during this phase.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Distribute evidence packs and say: &#x27;Your job right now is NOT to explain — your job is to observe carefully and record what you see. Use the observation table. For every structural feature you notice, write it down. For features that are absent — like a nucleus that isn&#x27;t there — write that down too. Absences are just as important as presences.&#x27; Set a visible 15-minute timer. Circulate and narrate observations without explaining: e.g., say &#x27;I can see your group has noticed the biconcave shape — keep going, what else?&#x27; Do NOT answer &#x27;why&#x27; questions yet — redirect with: &#x27;Write that question in the Questions Raised column — that is exactly what Phase 3 is for.&#x27; At the 8-minute mark, do a mid-observation check: cold-call one group: &#x27;Group 3 — read me one feature you noticed about the nerve cell that surprised you.&#x27; At the 14-minute mark, give a 1-minute warning. After 15 minutes, say: &#x27;Pens down. Every group should have at least 3 structural features per cell recorded.&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Structured Observation with Noticing Frames. The observation table scaffolds learners to separate raw observation from interpretation — a core NGSS Science and Engineering Practice (Planning and Carrying Out Investigations; Analysing and Interpreting Data). Requiring learners to record absences (e.g., no nucleus in RBCs) is a deliberate strategy: absence as evidence is a higher-order observation skill that directly sets up the structure-function argument in Phase 3. The sickle-cell micrograph creates a visual contrast that primes the supporting phenomenon discussion.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicator: Each group&#x27;s observation table has entries in all four columns for at least 4 of the 5 cells within 15 minutes. Circulate and check that learners are recording specific structural features (e.g., &#x27;long axon&#x27;, &#x27;no nucleus&#x27;) rather than vague descriptors (e.g., &#x27;looks different&#x27;). If a group&#x27;s &#x27;Questions Raised&#x27; column is empty, prompt: &#x27;If you were that red blood cell squeezed through a capillary thinner than itself, what question would YOU have?&#x27; Use the data card responses as a quick check — groups that can connect the 120-day lifespan to the absence of a nucleus (no energy wasted on DNA replication) are demonstrating advanced reasoning to flag for Phase 3 cold-calls.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Explain Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/c941474a0a675516ac5cb04b06bce24c&quot;&gt;Anatomy of a neuron&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+specialised+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 HTML:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/2743305661b456e3a7657b9e17bf6ea9&quot;&gt;Nerve Cells (Flexbook)&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+specialised+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners remain in their groups and receive a Structure-Function Graphic Organiser — a table with columns: Cell | Key Structural Feature | Why That Feature Matters (Function) | Connection to the Healing Cut | Evidence from Sickle-Cell Phenomenon. Groups spend 20 minutes completing the organiser, constructing written explanations that directly link each structural feature to its functional advantage. The teacher then leads a whole-class share-out (10 minutes) using a completed version of the organiser projected on the board, cold-calling groups to contribute one cell at a time. The sickle-cell anaemia supporting phenomenon is introduced at this point: the teacher displays the micrograph comparison (normal vs. sickle RBCs) and poses the key argument question: &#x27;Sickle-cell red blood cells have haemoglobin — so why do people with sickle-cell disease still suffer from anaemia and blocked vessels?&#x27; Learners argue from evidence in pairs for 3 minutes before a whole-class cold-call. The teacher uses the Claim-Evidence-Reasoning (CER) frame to scaffold responses: &#x27;Make a CLAIM about what the problem is. Give EVIDENCE from the micrograph. Give REASONING connecting shape to function.&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Distribute the graphic organiser and say: &#x27;Now we move from observing to explaining. For every structural feature you recorded, I want you to answer: WHY does that feature exist? What job does it help the cell do? And — critically — how does that connect to what happened the day that Form 1 student in Nairobi cut their finger?&#x27; Allow 20 minutes for group work. Circulate and use targeted prompts: For RBCs — &#x27;You said no nucleus. What does a nucleus do? So what happens to all that space inside the cell?&#x27; For nerve cells — &#x27;You said long axon. How far does a pain signal need to travel from a fingertip to the brain? What does length make possible?&#x27; For muscle cells — &#x27;You said many mitochondria. What do mitochondria produce? Why would a muscle cell need a LOT of that?&#x27; After 20 minutes, begin whole-class share-out. Cold-call one group per cell — say: &#x27;Group 2, give me your CER for the red blood cell — Claim, Evidence, Reasoning.&#x27; After each response, ask the class: &#x27;Does any group want to add or challenge?&#x27; For sickle-cell: display the micrograph and say — &#x27;Look at the shape of the sickle cell. Here is the argument question: the sickle cell still contains haemoglobin. So why does the shape matter?&#x27; Allow 10 seconds of wait time (count silently). Cold-call 3 learners. Listen for the key reasoning: the abnormal shape prevents the cell from passing through small blood vessels and reduces its ability to carry oxygen efficiently. Confirm and extend: &#x27;This is your most powerful piece of evidence yet that SHAPE IS FUNCTION. Shape is not decoration.&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Claim-Evidence-Reasoning (CER) Framework + Supporting Phenomenon Integration. CER is an NGSS-aligned sensemaking strategy (Constructing Explanations and Designing Solutions; Engaging in Argument from Evidence) that requires learners to move beyond description into causal explanation. Using sickle-cell anaemia as the supporting phenomenon is deliberately chosen because it provides a natural experiment: same molecule (haemoglobin), different shape, catastrophically different function. This makes the structure-function argument falsifiable and evidence-based rather than assertion-based. The graphic organiser bridges group thinking and public argumentation.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicator: Each group&#x27;s graphic organiser has a complete CER for at least 3 cells, with the &#x27;Connection to the Healing Cut&#x27; column populated. During cold-calls, listen specifically for causal language: words like &#x27;because&#x27;, &#x27;therefore&#x27;, &#x27;which means&#x27;, &#x27;as a result&#x27; indicate explanatory reasoning rather than simple description. A learner who says &#x27;the red blood cell has no nucleus because that leaves more room for haemoglobin, which means it can carry more oxygen to the healing tissue&#x27; is demonstrating target-level reasoning. A learner who says &#x27;the red blood cell has no nucleus and carries oxygen&#x27; is demonstrating a lower level — record for follow-up. The sickle-cell CER responses are the highest-stakes formative checkpoint of the lesson: if fewer than 60% of cold-called learners can articulate the shape-blockage-function link, pause and re-teach using the blood vessel diameter analogy before moving to Phase 4.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Driving Question Board (DQB) Creation&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/321e5effdadc508892c337e9c3ae2145&quot;&gt;Anatomy of a skeletal muscle cell&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+specialised+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/6e98b02340eb595094c87c71ef8baed9&quot;&gt;Nerve Cells Practice&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+specialised+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Each learner individually writes on a sticky note (or index card) their single most important update to their understanding of the driving question: &#x27;Why do cells in our body look so different from each other — and how does the shape of a cell determine the job it can do?&#x27; Learners also write one new question that this lesson has raised for them. Sticky notes are placed on the class DQB in two columns: &#x27;What we NOW understand&#x27; and &#x27;New questions we have.&#x27; The teacher reads 4–5 contributions aloud and facilitates a 5-minute whole-class discussion to identify patterns — what has the class collectively come to understand? What remains puzzling? The teacher draws explicit attention to how today&#x27;s lesson has shifted the class from &#x27;cells look different&#x27; (observation) to &#x27;cells look different BECAUSE they do different jobs&#x27; (explanation).&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Distribute sticky notes and say: &#x27;Three minutes, individual and silent. Write one thing you now understand about our driving question that you did NOT understand at the start of today&#x27;s lesson. On the back, write one question this lesson has raised for you.&#x27; After 3 minutes, direct learners to post their notes on the DQB. Scan the board quickly, then read 4–5 aloud — choose a mix of strong explanations and interesting new questions. Ask the class: &#x27;Which of these new questions do you think will be answered in our next lesson? Which ones might take us all the way to the end of the unit?&#x27; Point to the phenomenon image and say: &#x27;At the start of this unit, we asked: how does the body send exactly the right response to heal that cut? Today you built part of that answer. You now know that the right response is possible BECAUSE each cell has a shape that makes it perfect for its job. That is cell specialisation.&#x27; Record the 3–4 most generative new questions on the permanent DQB display for the class to track over Lessons 9–12.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Collaborative Knowledge Tracking via the Driving Question Board. The DQB is a living sensemaking artefact — it externalises the class&#x27;s growing understanding and makes the trajectory of learning visible to learners themselves. Requiring both an &#x27;update&#x27; and a &#x27;new question&#x27; on the same card forces metacognitive reflection: learners must assess what they know AND identify the boundary of their current understanding. The teacher&#x27;s act of reading cards aloud and identifying patterns models the scientific practice of synthesising evidence across multiple sources (Obtaining, Evaluating, and Communicating Information — NGSS SEP 8).&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicator: Every learner has posted a sticky note with both an understanding update and a new question. Read all posted notes after the lesson — sort them into three categories: (1) target understanding achieved (structure-function language present); (2) partial understanding (structure described without functional link); (3) misconception or surface-level response. Use this sort to plan the opening re-anchor of Lesson 9. New questions that reference organs, tissues, or systems (e.g., &#x27;Does every organ have its own special cells?&#x27;) indicate learners are ready to advance toward the tissue/organ level in Lessons 9–10.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Model Building Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/7fa2ecc745f652de9ca7013ac19e52b5&quot;&gt;Anatomy of a neuron -dubbed(KY)&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (Kiswahili)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+specialised+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 HTML:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/98e329e18e82515fa852ab830bdcf0fd&quot;&gt;Nerve Cells and Nerve Impulses (Flexbook)&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+specialised+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners retrieve their cumulative cell model — begun in Lesson 1 and revised in each subsequent lesson. Today&#x27;s revision task is specific: learners must ADD at least two specialised animal cells to their model, annotating each with (a) 3 structural features, (b) the function each feature enables, and (c) an arrow or label connecting the cell to the healing-cut phenomenon sequence (e.g., &#x27;RED BLOOD CELL → delivers oxygen to healing tissue → biconcave shape + no nucleus = maximum haemoglobin capacity&#x27;). Learners also add a new model layer labelled &#x27;Cell Specialisation&#x27; and write a one-sentence model claim: &#x27;In our body, cell shape is not random — it is determined by function.&#x27; The teacher circulates, stamps or initials completed models, and selects 2–3 models to share under
