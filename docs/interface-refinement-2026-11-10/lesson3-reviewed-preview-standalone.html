e class: &#x27;Is this a growing understanding — something we are beginning to explain? Or is this a new mystery we still need to investigate?&#x27; Use a thumbs-up (understanding) or question-mark gesture (new mystery) from all learners for each note. Draw the connecting line on the DQB and say: &#x27;We are building an answer — slowly, piece by piece, just like the cells rebuilding Amina&#x27;s finger.&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Driving Question Board — Knowledge Tracking. The DQB makes the cumulative nature of the evidence-gathering sequence visible. Sorting notes into &#x27;growing understanding&#x27; vs. &#x27;new mystery&#x27; teaches learners that science is an iterative process — not all questions are resolved in one lesson. The physical connecting line models how evidence from different lessons can converge into an explanation.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicator: Every learner produces a written DQB note. Teacher scans for notes that are off-topic or merely restate a fact (&#x27;chloroplasts do photosynthesis&#x27;) without connecting to the driving question. These learners are prompted: &#x27;How does knowing that help explain why Amina&#x27;s skin cells look different from a leaf cell?&#x27;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Model Building Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/9f2d3e6f004d59c7a0106ab068d0cf53&quot;&gt;Organelles in eukaryotic cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+plant+ultrastructure+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 HTML:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/64eedd0564b25ce08f407812919dbd53&quot;&gt;Plant Cell Structures (Flexbook)&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+plant+ultrastructure+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners open their science exercise books to their cumulative cell model — currently Version 1, the generalised cell drawn in Lesson 2 and revised in Lesson 3. On the facing page, learners draw Version 2 — the Plant Cell. Using their annotated outline and the board diagram as references, they draw and label the plant cell, including all 9 organelles studied today. Beside each organelle label, learners write its farm-metaphor role in brackets. In the top corner of the Version 2 diagram, learners write one sentence stating the most important structural difference between their Version 1 and Version 2 models, and one sentence predicting what this difference tells us about plant vs. animal cell function. Learners who finish early add colour-coding: green for organelles unique to plant cells, blue for organelles shared with animal cells.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Say: &#x27;Version 2 starts now. Open to the page facing your animal cell model. You are going to draw your plant cell large enough to fill the full page — we need room for all nine organelles and their farm labels.&#x27; Allow 12 minutes for drawing and labelling. Circulate and check: (1) Is the cell wall clearly outside the cell membrane? (2) Is the vacuole drawn large and central? (3) Are chloroplasts drawn as distinct oval structures inside the cell? For any of these three errors, crouch beside the learner and ask: &#x27;Look at the EM image on the board — where is the vacuole relative to the membrane?&#x27; rather than correcting directly. After 10 minutes, prompt the summary sentences: &#x27;Pause your drawing. Write your two sentences in the top corner now — you can finish the diagram after.&#x27; Read two summary sentences aloud from volunteers and give brief whole-class feedback. Close the lesson by saying: &#x27;Your model now has two versions. In Lesson 5, we compare them side-by-side to answer a key part of our driving question. Hold onto every version — your model is your growing understanding made visible.&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Cumulative Model Revision (Version 2 — Plant Cell). Placing the animal cell and plant cell models on facing pages in the same book creates a persistent visual comparison that learners carry forward across all 12 lessons. Writing the difference sentence forces learners to synthesise rather than merely reproduce. The farm-metaphor brackets inside the model integrate the lesson&#x27;s metaphor anchor directly into the scientific record.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicator: Version 2 diagrams contain all 9 labelled organelles, both a label and a farm-metaphor bracket, and 2 summary sentences. Teacher collects 6 books (two from each seating cluster) to assess overnight. Look specifically for: correct placement of cell wall outside membrane, large central vacuole, and at least one of the two summary sentences identifying chloroplast/vacuole as a plant-unique feature. Return with written feedback at the start of Lesson 5.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;D. TEACHER REFLECTION&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;After the lesson, consider: Did the Rift Valley Maize Farm metaphor help learners retain function, or did it oversimplify any organelle&#x27;s role? Review the Organelle Job Cards — were there patterns of error (e.g., confusion between ribosomes and Golgi apparatus as &#x27;makers&#x27; vs. &#x27;dispatchers&#x27;)? Did the DQB notes show genuine connection to the driving question, or did learners treat the board as a vocabulary exercise? Check the 6 collected model books: are learners drawing the cell wall correctly positioned outside the membrane? If not, open Lesson 5 with a targeted correction using the EM image. Note: if fewer than 70% of learners completed Version 2 with all 9 organelles, budget 5 minutes at the start of Lesson 5 for model completion before the comparative analysis begins.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;E. SUMMARY TABLE PROMPT  (pre-filled example for this lesson)&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;What did I observe?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;A fully labelled plant cell diagram and (where available) electron micrograph images of a maize leaf chloroplast, a central vacuole in an onion cell, and a plant cell wall boundary.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;What did I learn?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Plant cells contain nine key organelles — cell wall, cell membrane, nucleus, chloroplasts, large central vacuole, mitochondria, endoplasmic reticulum, ribosomes, and Golgi apparatus — each with a specific structure-linked function, mapped to roles on a Rift Valley maize farm.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;How does this explain the phenomenon?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Unlike the animal cells (e.g., epidermal cells, platelets) involved in healing Amina&#x27;s cut, plant cells have organelles such as chloroplasts and a large central vacuole that reflect their unique job: making their own food and maintaining structural pressure. Structure and function are inseparable — a principle that applies equally to the specialised cells in the wound-healing phenomenon.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;p&gt;© 2026 SeaVuria and ARES Education. Aligned with KICD objectives. Developed by SeaVuria; technical implementation by ARES (with AI assistance from Claude). Licensed under &lt;a href=&quot;https://creativecommons.org/licenses/by-nc/4.0/&quot;&gt;CC BY-NC 4.0&lt;/a&gt; (&lt;a href=&quot;https://creativecommons.org/licenses/by-nc/4.0/&quot;&gt;https://creativecommons.org/licenses/by-nc/4.0/&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
&lt;/details&gt;

&lt;details class=&quot;lp-section&quot; id=&quot;lesson-5&quot; data-document-section&gt;
  &lt;summary&gt;Lesson 5 · Animal Cell Ultrastructure — Comparing Plant and Animal Cells&lt;/summary&gt;
  &lt;div class=&quot;lp-document doc-preview&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;LESSON 5 (80 minutes): Animal Cell Ultrastructure — Comparing Plant and Animal Cells&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;A. SPECIFIC LEARNING OUTCOMES&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Category&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Specific Learning Outcomes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Purpose&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;To identify the ultrastructure of an animal cell, distinguish organelles unique to animal and plant cells respectively, and update the cumulative cell model to show both cell types side by side.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Knowledge&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners identify and describe the structure and function of organelles found in animal cells (including lysosomes and centrioles) and distinguish them from organelles exclusive to plant cells (chloroplasts, cell wall, large central vacuole).&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Skills&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners annotate diagrams of animal cells, construct a comparative two-column model (plant vs. animal), and deliver peer-reviewed group presentations of annotated diagrams.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Attitudes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners appreciate that the precise structural differences between plant and animal cells reflect their distinct roles in life processes — and connect this to the variety of cells involved in healing the cut finger in the anchoring phenomenon.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Key Inquiry Question&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;What are the structural differences between plant and animal cells, and how do those differences connect to what each cell type is built to do?&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Purpose in Storyline&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;In Lessons 1–4, learners established what a cell is, examined plant cell structure, and used the onion and elodea as evidence. Lesson 5 now asks: what is structurally different about the animal cells that are actually doing the work in the healing cut — the platelets, neutrophils, fibroblasts, and epidermal cells? By comparing animal cell ultrastructure with the plant cell already in their cumulative model, learners build Version 3 of their model (Plant vs. Animal side by side) and sharpen their answer to the driving question.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Safety Notes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;No hazardous chemicals or specimens are used in this lesson. If printed diagrams are distributed, ensure scissors (if used for cutting activities) are handled safely. Remind learners to wash hands after any handling of printed or physical materials. Supervise group seating to prevent overcrowding around shared diagrams.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;B. LESSON OVERVIEW&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;In this teacher-led diagram analysis lesson, learners receive a large unlabelled diagram of an animal cell and use prior knowledge plus guided instruction to annotate it. Through a structured comparison table, they identify organelles present in animal cells but absent in plant cells (lysosomes, centrioles) and organelles present in plant cells but absent in animal cells (chloroplasts, cell wall, large central vacuole). Shared organelles (nucleus, mitochondria, ribosomes, endoplasmic reticulum, Golgi apparatus, cell membrane) are confirmed. Groups then present their annotated diagrams with peer feedback. The lesson closes with learners revising their cumulative cell model to Version 3 — a side-by-side Plant vs. Animal diagram — and explicitly linking unique animal cell organelles to the cells involved in healing the cut finger (e.g., lysosomes in neutrophils digesting bacteria; centrioles enabling rapid cell division in epidermal repair).&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;5&quot;&gt;&lt;p&gt;&lt;strong&gt;C. LESSON IMPLEMENTATION FRAMEWORK&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Phase&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Learner Experience&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Teacher Moves&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Sensemaking Strategy&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Formative Assessment Strategy&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Predict Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/8640601f847a586e97f0030c90135a9c&quot;&gt;Comparing animal and plant cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+animal+ultrastructure+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/26cbebba12c35a488ff3d37d5427b3eb&quot;&gt;Plant vs animal cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+animal+ultrastructure+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners receive a blank outline silhouette of an animal cell (irregular, no cell wall) with no labels. Working individually for 4 minutes, they draw and label as many organelles as they can recall from Lessons 3 and 4, predicting which organelles from the plant cell they expect to find here and which they expect to be missing or different. They then share predictions with a partner using a Think-Pair-Share. On a sticky note, each pair writes one organelle they are CONFIDENT will be present and one they are UNSURE about, and posts both on the class Prediction Wall.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Distribute the blank animal cell outline. Say verbatim: &#x27;You have studied the plant cell in detail. Before I teach you anything new, I want you to predict — using only what you already know — what the inside of an animal cell looks like. Draw and label for 4 minutes. Go.&#x27; Set a visible timer. After 4 minutes, say: &#x27;Now share with your partner. Do you agree on every organelle, or are there differences?&#x27; Allow 2 minutes of pair talk. Cold-call 4 pairs (choose mixed-ability): &#x27;Tell me one organelle you are both confident about and explain why.&#x27; After each response, wait 12 seconds before affirming or probing. Then direct pairs to the Prediction Wall: &#x27;Write your CONFIDENT organelle in green and your UNSURE organelle in orange. Stick them up.&#x27; Photograph the wall for formative records. Do NOT correct predictions yet — affirm the thinking process: &#x27;These predictions are your hypotheses. We will test every one of them today.&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Think-Pair-Share with a Prediction Wall. This activates prior knowledge from Lessons 3–4, creates cognitive dissonance around expected differences, and gives the teacher real-time data on misconceptions before instruction begins. The Prediction Wall makes learner thinking visible and will be revisited at the end of the lesson to check and celebrate growth.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicator: Each learner has independently drawn and attempted to label at least 4 organelles on the blank outline. The Prediction Wall reveals class-wide patterns — if fewer than 60% of pairs correctly predict the nucleus and mitochondria as shared, the teacher re-activates this in the Observe phase before moving to differences.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Observe Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/c1adffcd23b5561ca8687b2d0a7fff8e&quot;&gt;Overview of animal and plant cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+animal+ultrastructure+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/26cbebba12c35a488ff3d37d5427b3eb&quot;&gt;Plant vs animal cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+animal+ultrastructure+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners receive a fully labelled, high-quality diagram of an animal cell ultrastructure (showing: cell membrane, cytoplasm, nucleus with nuclear envelope and nucleolus, rough and smooth ER, Golgi apparatus, mitochondria, ribosomes, lysosomes, centrioles, vacuoles — small and numerous). Alongside this, they have their Lesson 4 plant cell diagram. Working in groups of 4, learners complete a three-column Comparison Table: Column A — &#x27;Organelle&#x27;, Column B — &#x27;Present in Plant Cell? (✓/✗)&#x27;, Column C — &#x27;Present in Animal Cell? (✓/✗)&#x27;. The table lists 12 organelles. Groups must also write a one-sentence function for each organelle they mark as present. Groups have 15 minutes for this structured observation task.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Distribute both diagrams and the blank Comparison Table. Say: &#x27;You now have two diagrams in front of you — the plant cell you studied last lesson and today&#x27;s animal cell. Your job is NOT to memorise — your job is to observe carefully and find the differences. Use the table. You have 15 minutes.&#x27; Circulate continuously. At the 5-minute mark, prompt any group still on the first 3 rows: &#x27;You should be at least halfway through the table by now — keep moving.&#x27; At the 10-minute mark, stop the class for 60 seconds: &#x27;Without telling me the answer, raise your hand if your group has found at least TWO organelles that appear in the animal cell but NOT the plant cell.&#x27; Count hands publicly. Say: &#x27;Good — hold that thought.&#x27; At 15 minutes, call time. Cold-call 3 groups to share one unique animal cell organelle each — requiring them to state both its NAME and its FUNCTION. Wait 12 seconds after each response before commenting. Affirm accuracy; where a function is vague (e.g., &#x27;lysosomes break things&#x27;), press with: &#x27;Break what things, specifically? Think about the cut finger — what might a lysosome be breaking down in a neutrophil?&#x27; Wait 15 seconds.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Structured Comparison Table with dual-diagram analysis. By placing the plant cell diagram (prior lesson evidence) alongside the new animal cell diagram, learners engage in direct observational comparison — a core scientific practice (NGSS SEP 4: Analysing and Interpreting Data). The table format prevents passive looking and forces claim-level decisions (present/absent) with functional justification.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicator: Each group&#x27;s Comparison Table correctly identifies lysosomes and centrioles as animal-cell-only, and chloroplasts, cell wall, and large central vacuole as plant-cell-only, with at least a partial function noted for each. Teacher spot-checks 3 tables during circulation. Red flag: if groups mark &#x27;large vacuole&#x27; as present in animal cells (a common misconception), address this whole-class before Phase 3.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Explain Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/8640601f847a586e97f0030c90135a9c&quot;&gt;Comparing animal and plant cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+animal+ultrastructure+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 HTML:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/64eedd0564b25ce08f407812919dbd53&quot;&gt;Plant Cell Structures (Flexbook)&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+animal+ultrastructure+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;The teacher delivers a focused 12-minute guided explanation connecting each unique organelle to the anchoring phenomenon. Learners annotate their diagrams in real time using a colour code: blue for organelles unique to animal cells, green for organelles unique to plant cells, and black for shared organelles. After the explanation, learners individually write a 3-sentence &#x27;Functional Justification&#x27; for why an animal cell does NOT need a cell wall, a chloroplast, or a large central vacuole — using evidence from both the phenomenon and their diagram. Groups then consolidate one shared justification per unique organelle and prepare a 2-minute annotated diagram presentation.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Begin with a direct return to the phenomenon: &#x27;When Amina cut her finger in Nairobi, neutrophils arrived at the wound site within minutes and began engulfing bacteria. What organelle makes that digestion possible?&#x27; Wait 12 seconds. Accept responses, then affirm: &#x27;Lysosomes — membrane-bound sacs packed with digestive enzymes. Only animal cells have them in abundance. Ask yourself: does an onion cell need to engulf bacteria? No — so no lysosomes.&#x27; Proceed organelle by organelle: CENTRIOLES — &#x27;When Amina&#x27;s epidermal cells needed to divide rapidly to close the wound surface, centrioles organised the spindle fibres. Plant cells use a different mechanism — no centrioles.&#x27; CELL WALL — &#x27;Animal cells are flexible and can change shape. A neutrophil squeezes through capillary walls to reach the wound. Could it do that with a rigid cell wall?&#x27; Wait 10 seconds. Cold-call 2 learners. CHLOROPLASTS — &#x27;Amina&#x27;s skin cells do not photosynthesise. They get energy from glucose in her bloodstream. Why carry the machinery for something you will never do?&#x27; Wait 12 seconds. LARGE VACUOLE — &#x27;Animal cells have small, temporary vacuoles. They do not need to store large amounts of water or maintain turgor — that is a plant cell strategy.&#x27; Use the colour-coding annotation in real time on the projected diagram as you explain each point. After explanation, say: &#x27;Now write your 3-sentence Functional Justification independently. You have 5 minutes.&#x27; Circulate and read over shoulders. After 5 minutes, direct groups to consolidate: &#x27;As a group, agree on your best justification for each unique organelle. You will present in 5 minutes.&#x27; Cold-call 2 groups to share one justification before presentations begin.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Phenomenon-Anchored Direct Instruction with Colour-Code Annotation (NGSS SEP 6: Constructing Explanations). By tethering each organelle to a specific cell in the healing cut, the teacher transforms abstract organelle lists into functional explanations grounded in observable evidence. The colour-code annotation creates a visual key that learners carry forward into model building. The individual written justification (before group consolidation) ensures every learner constructs their own explanation rather than free-riding.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicator: Each learner&#x27;s 3-sentence Functional Justification correctly uses the word &#x27;because&#x27; or &#x27;therefore&#x27; to link structure to function for at least 2 of the 3 unique plant-cell organelles. Teacher reads at least 6 individual justifications during the 5-minute writing window. Red flag: justifications that describe what an organelle does without explaining why the animal cell does or does not need it — prompt these learners with: &#x27;You told me WHAT it does. Now tell me WHY the animal cell doesn&#x27;t need it, using the cut finger as your evidence.&#x27;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Driving Question Board (DQB) Creation&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/c1adffcd23b5561ca8687b2d0a7fff8e&quot;&gt;Overview of animal and plant cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+animal+ultrastructure+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/34d28635c2d45902bee3acf7a60fb2f7&quot;&gt;Plant Cell Structures Practice&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+animal+ultrastructure+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Groups deliver 2-minute presentations of their annotated animal cell diagrams, focusing on unique organelles and their functional justifications. Each presenting group receives structured peer feedback using the &#x27;WWW / EBI&#x27; protocol (What Went Well / Even Better If). After all presentations, the class returns to the Driving Question Board. Learners individually write a new sticky note addressing: &#x27;Can you now explain part of the driving question — how does an animal cell&#x27;s shape and structure connect to its job?&#x27; They post this under the DQB column &#x27;What I can NOW explain&#x27;. The teacher facilitates a 4-minute whole-class discussion to update the board and highlight which parts of the driving question remain unanswered (cell specialisation — addressed in later lessons).&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Signal the start of presentations: &#x27;Each group has exactly 2 minutes. Show your annotated diagram, name your unique organelles, and give your best functional justification. Peers — you are filling in your WWW/EBI card as they present.&#x27; Time each group strictly. After all presentations, cold-call 2 peer feedback givers per group: &#x27;Read your EBI aloud.&#x27; Probe any vague EBI (e.g., &#x27;be clearer&#x27;) with: &#x27;Clearer about what specifically?&#x27; After presentations, direct attention to the DQB: &#x27;Look at the question we started with: Why do cells look so different, and how does their shape determine their job? Write on a sticky note one part of that question you can now answer — and post it.&#x27; Allow 3 minutes of silent individual writing. Then facilitate: &#x27;Who wants to read theirs?&#x27; Cold-call 3 learners. After each, ask the class: &#x27;Does anyone disagree with that answer, or want to add evidence?&#x27; Wait 12 seconds. Close by pointing to remaining unanswered sticky notes from earlier lessons: &#x27;These questions about specialisation — about why a platelet has no nucleus — those are coming. Today we built the foundation.&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Structured Peer Presentation with WWW/EBI Feedback Protocol, followed by DQB Metacognitive Mapping (NGSS SEP 8: Obtaining, Evaluating, and Communicating Information). The presentation consolidates group learning through public articulation. The DQB update makes metacognitive progress visible — learners see their own growing explanatory power and identify the boundary between what they know and what still requires investigation.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicator: Each learner&#x27;s DQB sticky note references at least one specific organelle by name and connects it to a function relevant to the cut finger phenomenon or to the driving question. Teacher reads all sticky notes after the lesson and sorts them into &#x27;Strong explanation&#x27;, &#x27;Partial explanation&#x27;, and &#x27;Misconception present&#x27; piles to inform Lesson 6 planning.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Model Building Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/98ccf1c8b3d35cfea5093cdb61b64836&quot;&gt;Prokaryotic and eukaryotic cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+animal+ultrastructure+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 HTML:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/bbda32d5f73e53ccb586cee112a3f156&quot;&gt;Plant Cells (Flexbook)&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+animal+ultrastructure+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners open their cumulative cell model journal (begun in Lesson 2 and revised through Lessons 3 and 4). They now draw Version 3: a side-by-side diagram of a plant cell and an animal cell on a double-page spread. Both diagrams must be fully labelled with organelle names, colour-coded (blue for animal-only, green for plant-only, black for shared), and annotated with a brief function note beside each unique organelle. At the bottom of the double page, learners write a &#x27;Model Revision Note&#x27;: what changed from Version 2 (plant cell only) and why. They also circle one organelle on the animal cell diagram and write one sentence connecting it explicitly to the cut finger phenomenon. The model is signed, dated, and stored as a portfolio artefact.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Say: &#x27;Open your model journals to a fresh double page. Today you are building Version 3 — the most detailed model you have made so far. On the LEFT, redraw your plant cell from Lesson 4 — you may improve it. On the RIGHT, draw your animal cell using today&#x27;s diagram as reference. Both sides must be colour-coded and labelled. At the bottom, write your Model Revision Note — what is new, what changed, and why. Then circle one animal cell organelle and write one sentence connecting it to Amina&#x27;s cut finger.&#x27; Allow 15 minutes for model building. Circulate and comment specifically: &#x27;I can see you&#x27;ve drawn the lysosome — your label says it digests waste. Can you make that more specific? What waste, in what cell, in the phenomenon?&#x27; Wait 10 seconds for the learner to self-correct. With 3 minutes remaining, say: &#x27;Finish your Model Revision Note. It should be at least 2 sentences.&#x27; At time, cold-call 3 learners to read their cut-finger sentence aloud. After each, affirm the connection or press: &#x27;How does that organelle&#x27;s structure — not just its function — connect to what that cell looks like?&#x27; Close: &#x27;Version 3 is now your most powerful scientific model. In Lesson 6, we begin asking: how do these cells become so specialised — and what controls that process?&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Cumulative Model Revision (NGSS SEP 2: Developing and Using Models). The side-by-side Version 3 model externalises comparative understanding — it is not a copy of a textbook diagram but a learner-constructed artefact that records the growth of their explanation over five lessons. The Model Revision Note develops metacognitive awareness of how scientific models evolve as evidence accumulates. The mandatory phenomenon connection sentence ensures the model remains tethered to the driving question rather than becoming a decorative exercise.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicator: Version 3 models include at minimum 10 labelled organelles across both cell types, correct colour-coding for at least 5 organelles, and a Model Revision Note of at least 2 sentences that explicitly names what is new compared to Version 2. The cut-finger sentence names a specific animal cell organelle and a specific cell type from the phenomenon (e.g., &#x27;The lysosome in the neutrophil breaks down the engulfed bacteria using digestive enzymes, which is why the infection does not spread past the cut&#x27;). Teacher collects 6 journals at random to review overnight before Lesson 6.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;D. TEACHER REFLECTION&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;After the lesson, consider: (1) Did learners successfully distinguish lysosomes and centrioles as animal-cell-only organelles, or did common misconceptions persist (e.g., placing a large vacuole in the animal cell)? Review the Comparison Tables collected. (2) Were the group presentations evidence-based, or did learners rely on memorised lists without functional justification? If the latter, Lesson 6 should open with a brief re-anchoring to the phenomenon before moving to specialisation. (3) Were Version 3 models genuinely comparative, or did learners simply redraw the plant cell twice? If model quality is low, consider a structured model-critique activity at the start of Lesson 6 where pairs swap journals and give written feedback. (4) Review DQB sticky notes overnight: which parts of the driving question are learners now answering with confidence, and which misconceptions about cell structure versus cell specialisation remain? Use these to calibrate the entry point for Lesson 6 (Cell Specialisation). (5) Note which learners are consistently silent during cold-calls and create a targeted participation strategy for Lesson 6.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;E. SUMMARY TABLE PROMPT  (pre-filled example for this lesson)&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;What did I observe?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners received and analysed a labelled animal cell ultrastructure diagram alongside their Lesson 4 plant cell diagram. They completed a structured Comparison Table identifying organelles as present or absent in each cell type, and delivered group presentations of annotated diagrams with peer feedback.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;What did I learn?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Animal cells contain lysosomes (membrane-bound sacs of digestive enzymes) and centrioles (which organise cell division) — organelles absent in plant cells. Plant cells uniquely possess a cell wall, chloroplasts, and a large central vacuole. Nucleus, mitochondria, ribosomes, ER, Golgi apparatus, and cell membrane are shared. These structural differences reflect the different functional demands on each cell type.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;How does this explain the phenomenon?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners constructed Functional Justifications explaining why animal cells lack cell walls (flexibility needed for movement and shape change), chloroplasts (they obtain energy from food, not photosynthesis), and large vacuoles (no need for turgor pressure maintenance). They connected organelles to specific cells in the cut finger phenomenon — e.g., lysosomes in neutrophils digesting bacteria, centrioles enabling epidermal cell division during wound closure. Version 3 of the cumulative cell model was completed: a side-by-side colour-coded Plant vs. Animal diagram with a Model Revision Note.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;p&gt;© 2026 SeaVuria and ARES Education. Aligned with KICD objectives. Developed by SeaVuria; technical implementation by ARES (with AI assistance from Claude). Licensed under &lt;a href=&quot;https://creativecommons.org/licenses/by-nc/4.0/&quot;&gt;CC BY-NC 4.0&lt;/a&gt; (&lt;a href=&quot;https://creativecommons.org/licenses/by-nc/4.0/&quot;&gt;https://creativecommons.org/licenses/by-nc/4.0/&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
&lt;/details&gt;

&lt;details class=&quot;lp-section&quot; id=&quot;lesson-6&quot; data-document-section&gt;
  &lt;summary&gt;Lesson 6 · Microscopy Practical 1 — Observing Onion Epidermal Cells&lt;/summary&gt;
  &lt;div class=&quot;lp-document doc-preview&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;LESSON 6 (80 minutes): Microscopy Practical 1 — Observing Onion Epidermal Cells&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;A. SPECIFIC LEARNING OUTCOMES&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Category&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Specific Learning Outcomes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Purpose&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;To enable learners to prepare and observe temporary slides of onion epidermal cells, identify key plant cell structures, and connect direct microscopic evidence to the anchoring phenomenon of wound healing.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Knowledge&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners will know: (a) the correct procedure for preparing a temporary wet mount slide using onion epidermal tissue and iodine stain; (b) the identifiable structures visible in onion epidermal cells under low and high power — cell wall, cell membrane, vacuole, nucleus, and cytoplasm; (c) that onion epidermal cells lack chloroplasts because onion bulbs are underground storage organs not exposed to light, distinguishing them from photosynthetic plant cells.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Skills&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners will be able to: (a) safely peel and mount a thin layer of onion epidermis on a glass slide using forceps and a mounted needle; (b) apply iodine stain using the correct drop-and-coverslip technique; (c) focus a compound light microscope at low power (×40) and high power (×100 or ×400); (d) produce accurate, labelled biological drawings of onion epidermal cells including scale and magnification; (e) record observations in a structured practical book.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Attitudes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners will: (a) appreciate the value of direct empirical evidence in building scientific understanding; (b) demonstrate patience and precision as they develop practical microscopy technique; (c) show respect for shared laboratory equipment and enforce safety protocols voluntarily.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Key Inquiry Question&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;What are the structural differences between plant and animal cells? How does cell specialisation enable organisms to carry out complex life functions?&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Purpose in Storyline&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;This is Lesson 6 of 12 in the evidence-gathering sequence. In Lessons 1–5, learners built conceptual models of cell structure and specialisation using diagrams, text, and discussion. Lesson 6 is the first direct empirical encounter with real cells under a microscope. By examining onion epidermal cells — the same onion that the Form 1 student in Nairobi was slicing when the anchoring phenomenon began — learners gather first-hand visual evidence of plant cell structures. The observation that there are NO chloroplasts in onion skin cells generates productive surprise, deepens understanding of cell specialisation, and plants a key question that will drive Lessons 7–8 (animal cells, specialised cells). This lesson transitions the unit from conceptual modelling to evidence-based model revision.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Safety Notes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;SAFETY PROTOCOLS — enforce throughout: (1) Iodine stain is an irritant — learners must avoid contact with skin and eyes; lab coats and safety goggles must be worn during staining. (2) Glass slides and coverslips are fragile — demonstrate correct handling; broken glass to be reported immediately and disposed of in the designated sharps bin, NOT the general waste bin. (3) Scalpels/razor blades are NOT to be used by learners in this practical — onion layers are separated by hand and forceps only. (4) Microscope electrical cables must not trail across walkways. (5) Learners with known iodine allergies must notify the teacher before the lesson begins and may use plain water as an alternative mountant.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;B. LESSON OVERVIEW&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;Learners prepare temporary wet mount slides of onion (Allium cepa) epidermal cells, stain with iodine solution, and observe under a compound light microscope at low and high power. The teacher demonstrates the full technique before groups of 3–4 carry out the practical independently. Learners produce labelled biological drawings and record structured observations. A guided class discussion connects the absence of chloroplasts in onion skin to the concept of cell specialisation, directly advancing the unit&#x27;s driving question. Safety protocols are enforced throughout. All observations are recorded in structured practical books as cumulative evidence for model revision at the end of the lesson.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;5&quot;&gt;&lt;p&gt;&lt;strong&gt;C. LESSON IMPLEMENTATION FRAMEWORK&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Phase&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Learner Experience&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Teacher Moves&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Sensemaking Strategy&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Formative Assessment Strategy&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Predict Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/8640601f847a586e97f0030c90135a9c&quot;&gt;Comparing animal and plant cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+plant+onion+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/26cbebba12c35a488ff3d37d5427b3eb&quot;&gt;Plant vs animal cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+plant+onion+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners examine a whole onion (the same vegetable from the anchoring phenomenon). Working in pairs, they sketch what they predict a single onion skin cell looks like under a microscope, labelling any structures they expect to see. They record two specific predictions in their practical books: (1) List every structure you expect to see in an onion skin cell. (2) Will there be chloroplasts? Explain your reasoning. Pairs then share predictions with a neighbouring pair and note agreements and disagreements before the class shares out.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Hold up a whole red or white onion and say: &#x27;This is the same onion our Form 1 student in Nairobi was slicing when the cut happened. Today we are going to look inside ONE layer of its skin — not with our eyes, but with a microscope. Before we do: in your practical books, sketch what you predict you will see. Label every structure you expect.&#x27; Allow 4 minutes of silent individual work. Then say: &#x27;Turn to your partner. Compare your predictions. What did you both include? What is different?&#x27; Allow 2 minutes of paired talk. Cold-call 4 pairs (choose one strong predictor, one who predicted chloroplasts, one who did not, one unsure): &#x27;Tell me ONE structure you predicted and WHY.&#x27; Record all predicted structures on the board under the heading BEFORE — Our Predictions. Do NOT correct errors yet. Say: &#x27;Hold your predictions. In about 20 minutes, your microscope will tell us who was right.&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Prediction Journaling with Pair-Share — learners activate prior knowledge from Lessons 1–5 (cell structure diagrams) and commit to specific, testable predictions before observing. This creates cognitive dissonance when observations differ from predictions, which is the engine of conceptual change. Recording predictions in the practical book establishes a before-and-after evidence trail.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicator: Every learner has a labelled sketch with at least 3 named structures in their practical book before the practical begins. Teacher scans books during cold-call phase. Flag any learner who cannot name any structures — seat them next to a peer who can, and revisit during the Observe phase. Note on the board how many groups predicted chloroplasts — this will be returned to explicitly in Phase 3.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Observe Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/c1adffcd23b5561ca8687b2d0a7fff8e&quot;&gt;Overview of animal and plant cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+plant+onion+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 HTML:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/64eedd0564b25ce08f407812919dbd53&quot;&gt;Plant Cell Structures (Flexbook)&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+plant+onion+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;PART A — Teacher Demonstration (10 min): The whole class watches the teacher prepare a slide at the front bench, narrating each step aloud. PART B — Group Practical (25 min): Groups of 3–4 prepare their own slides, focus the microscope, and record observations. Each learner individually draws and labels cells at BOTH low power (×40) and high power (×100 or ×400) in their practical books. Structured observation prompts are written on the board: (1) Draw 3–4 cells at low power. (2) Draw 1 cell at high power. (3) Label: cell wall, cell membrane, vacuole, nucleus, cytoplasm. (4) Write: &#x27;I can / cannot see chloroplasts.&#x27; (5) Write the magnification used for each drawing.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;DEMONSTRATION SCRIPT — say each step aloud as you perform it: &#x27;Step 1 — I am peeling back one layer of the onion fleshy leaf. I use my fingernail to lift the thin, almost transparent inner epidermis. Step 2 — Using forceps, I lay the epidermis flat on the slide. No folds — flat. Step 3 — I add ONE drop of iodine stain directly onto the tissue. Iodine stains starch and makes the nucleus visible. Step 4 — I lower the coverslip at an angle using a mounted needle — like closing a book slowly — to avoid air bubbles. Step 5 — I place the slide on the stage, clip it, and start at LOW power. I use the coarse focus wheel first, then fine focus.&#x27; After focusing, say: &#x27;What do you notice? I want 10 seconds of silence — just look.&#x27; WAIT 10 seconds. &#x27;Now — hands up — what can you see?&#x27; Take 3 responses. During group practical: circulate every 3 minutes. Use targeted prompts: &#x27;Is your coverslip flat?&#x27;, &#x27;Are you on low power first?&#x27;, &#x27;Can you see a cell wall? Trace it with your finger on the eyepiece.&#x27; If a group cannot focus: demonstrate re-focusing at their microscope. With 5 minutes remaining, say: &#x27;Everyone must now have at least ONE complete drawing with labels. Check your practical book now.&#x27; Cold-call 2 groups to describe one structure they can see.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Structured Scientific Drawing — learners do not photograph; they draw. The act of drawing forces sustained, analytical observation: learners must decide what is significant, where boundaries are, and how structures relate spatially. Labelling with a ruler-drawn label line requires learners to commit to naming what they see, connecting visual evidence to vocabulary from Lessons 1–5. The two-magnification requirement (low and high power) develops understanding of scale.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicators: (1) Each learner&#x27;s practical book contains two drawings (low and high power) with a minimum of 4 labelled structures. (2) Magnification is written below each drawing. (3) The observation &#x27;I cannot see chloroplasts&#x27; (or equivalent) is recorded. Teacher checks practical books of at least 6 learners during circulation. If drawings are inaccurate (e.g., nucleus drawn outside the cell wall), the teacher kneels to the learner&#x27;s level and says: &#x27;Look through the eyepiece again — can you trace the outer boundary of the cell with your eye? That boundary IS the cell wall. Now draw only what you can see.&#x27;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Explain Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/8c2e36a9f2a95dfa8dbadc27529da85d&quot;&gt;Plant cell walls&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+plant+onion+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/34d28635c2d45902bee3acf7a60fb2f7&quot;&gt;Plant Cell Structures Practice&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+plant+onion+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Class reconvenes. Learners compare their actual observations to their Phase 1 predictions, annotating their prediction sketch in a different colour pen: circling correct predictions and crossing out incorrect ones. The teacher leads a whole-class discussion anchored on one key anomaly: &#x27;Chloroplasts — did anyone find them?&#x27; Learners use their observations as evidence to construct an explanation for WHY onion epidermal cells have no chloroplasts, connecting to the concept of cell specialisation. Learners write a 3-sentence explanation in their own words: (1) What I observed. (2) Why this makes sense for the onion&#x27;s function. (3) How this connects to the Nairobi student&#x27;s healing finger.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Return to the BEFORE — Our Predictions list on the board. Say: &#x27;Open your practical book to your prediction sketch. Take a different colour pen or pencil. Circle every prediction that your microscope confirmed. Cross out every prediction that was wrong. You have 2 minutes — silent individual work.&#x27; WAIT. After 2 minutes: &#x27;How many people predicted chloroplasts would be present?&#x27; (Show of hands — count aloud.) &#x27;How many of you found them?&#x27; (Hands — expected: zero.) Say: &#x27;This is a significant scientific result. The question is WHY. I want 15 seconds of thinking time — no hands yet.&#x27; WAIT 15 seconds. Cold-call 3 learners: &#x27;Give me your best explanation for why there are no chloroplasts in onion skin cells.&#x27; After 3 responses, say: &#x27;Let&#x27;s build the full explanation together.&#x27; Guide with questions: &#x27;Where does the onion bulb grow? [Underground.] Does light reach it? [No.] What do chloroplasts do? [Photosynthesis — capture light.] So would it make sense for the cell to build chloroplasts if there is no light?&#x27; Connect explicitly: &#x27;This is CELL SPECIALISATION. The onion epidermal cell is specialised for PROTECTION and STORAGE — not photosynthesis. Just like the cells in our Nairobi student&#x27;s finger are each specialised for one job: platelets for clotting, fibroblasts for collagen, epidermal cells for closing the wound.&#x27; Instruct: &#x27;In your practical book, write 3 sentences: what you observed, why it makes sense, and how it connects to the healing finger.&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Claim–Evidence–Reasoning (CER) Writing — learners construct a written scientific explanation using the three-part structure: Claim (what I observed), Evidence (data from the microscope drawing), Reasoning (why this makes sense given what I know about cell specialisation). This strategy formalises the transition from &#x27;I saw X&#x27; to &#x27;X tells us Y about how cells work,&#x27; which is the core intellectual move of the unit.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicator: Each learner&#x27;s 3-sentence CER response explicitly mentions (a) absence of chloroplasts, (b) the underground / no-light context of the onion bulb, and (c) a connection to specialisation or to the anchoring phenomenon. Teacher reads 4–5 responses during the writing time (circulate, do not collect). If a learner writes only &#x27;onion cells have no chloroplasts because they don&#x27;t need them,&#x27; prompt: &#x27;Why don&#x27;t they need them? What does a chloroplast DO? Where does the onion grow?&#x27; to scaffold deeper reasoning.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Driving Question Board (DQB) Creation&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/8640601f847a586e97f0030c90135a9c&quot;&gt;Comparing animal and plant cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+plant+onion+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/26cbebba12c35a488ff3d37d5427b3eb&quot;&gt;Plant vs animal cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+plant+onion+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Each group receives two sticky notes (different colours — one for ANSWERS, one for NEW QUESTIONS). On the ANSWER note, groups write one thing today&#x27;s microscopy practical has confirmed or answered about the driving question. On the NEW QUESTION note, groups write one new question today&#x27;s observation has raised. Groups post their notes on the class DQB under the headings &#x27;Evidence We Now Have&#x27; and &#x27;Questions We Still Need to Answer.&#x27; The teacher reads 3–4 notes aloud and the class votes (thumbs up/sideways/down) on whether each answer is well-supported by today&#x27;s evidence.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Distribute sticky notes. Say: &#x27;The Driving Question asks: Why do cells look so different — and how does shape determine the job a cell can do? Today you looked at a real cell for the first time. On your ANSWER note, write one thing you can now say with evidence — not just from the textbook, but from YOUR microscope today. On your QUESTION note, write one new question your observation raised — something you still cannot explain.&#x27; Allow 3 minutes. Circulate and prompt groups that are stuck: &#x27;What surprised you most today?&#x27; or &#x27;What would you need to see next to understand the healing finger better?&#x27; Invite groups to post notes on the DQB. Read 3 aloud. For each, say: &#x27;Does today&#x27;s evidence support this answer? Thumbs up if yes, sideways if partly, down if we&#x27;re not sure yet.&#x27; Narrate: &#x27;Look at our board — it is growing. Each lesson we add more. By Lesson 12, we should be able to answer the driving question fully.&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Driving Question Board (DQB) Progressive Mapping — the DQB functions as a public, cumulative record of the class&#x27;s growing understanding. By distinguishing &#x27;evidence we now have&#x27; from &#x27;questions we still need to answer,&#x27; learners experience science as an iterative process. The thumbs vote introduces peer evaluation of evidence quality, a key component of scientific reasoning.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicator: Every group posts at least one answer note that references a specific observation from today&#x27;s practical (e.g., &#x27;We can see cell walls in plant cells — animal cells in the wound don&#x27;t have these&#x27;). Teacher flags any answer note that is purely textbook-recalled without reference to today&#x27;s observation and returns it to the group with the prompt: &#x27;Can you re-write this using something you actually saw today?&#x27;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Model Building Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/c1adffcd23b5561ca8687b2d0a7fff8e&quot;&gt;Overview of animal and plant cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+plant+onion+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 HTML:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/64eedd0564b25ce08f407812919dbd53&quot;&gt;Plant Cell Structures (Flexbook)&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+plant+onion+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners return to the cumulative cell model they began in Lesson 1 (a hand-drawn or annotated diagram of a &#x27;generic cell&#x27;). Using a different colour pen/pencil, they revise or add to their model based on today&#x27;s direct microscopic evidence. Specific revision prompts are on the board: (1) Redraw or confirm the cell wall — is it thicker or thinner than you originally drew? (2) Add the large central vacuole if it was not in your original model. (3) Annotate your model: &#x27;Chloroplasts — ONLY in cells exposed to light (e.g., leaf cells) — NOT in onion epidermis, NOT in human cells.&#x27; (4) Add a caption: &#x27;This model is based on evidence from: [list sources used so far in the unit].&#x27; Learners then write one sentence predicting what will be different when they observe an animal cell in the next lesson.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Say: &#x27;Open to your unit model — the diagram you have been building since Lesson 1. Today your microscope gave you real evidence. Use a NEW colour to update your model. You have 6 minutes.&#x27; Display the four revision prompts on the board. Circulate — specifically check that learners are annotating chloroplasts correctly. After 5 minutes, say: &#x27;Last 60 seconds — write one sentence: what do you predict will be DIFFERENT when we look at an animal cell next lesson? Think about: platelets, neutrophils, fibroblasts from our Nairobi student&#x27;s finger.&#x27; WAIT for writing. Cold-call 3 learners to read their prediction aloud. Say: &#x27;Ho
