 structural differences — nucleus membrane, organelles, DNA organisation; (3) Brief mention of Matthias Schleiden (botanist, studied plant cells), Theodor Schwann (studied animal cells), Rudolf Virchow (&#x27;Omnis cellula e cellula&#x27; — all cells from cells). Say: &#x27;Now, using your colour-coded diagram, write a CER paragraph. Your CLAIM answers: How did Amina&#x27;s body make new skin cells? Your EVIDENCE comes from Virchow&#x27;s contribution. Your REASONING explains the mechanism.&#x27; WAIT TIME: Allow 8 minutes of silent writing. Circulate — if a learner is stuck, prompt: &#x27;What did Virchow say about where new cells come from? Start there.&#x27; Cold-call 2 learners to read their CER aloud. After each, ask the class: &#x27;Thumbs up if their Reasoning clearly connects cell theory to the phenomenon.&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Colour-Coded Annotation: Transforms passive diagram study into an active categorisation task — colour coding makes structural patterns visible and supports retention of comparative features. CER Writing with Phenomenon Anchor: Forces learners to move from declarative knowledge (&#x27;Virchow said…&#x27;) to explanatory knowledge (&#x27;Therefore Amina&#x27;s body could…&#x27;), which is the core NGSS practice of Constructing Explanations.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicators: (1) Colour-coded diagrams — teacher checks that ribosomes are GREEN (not BLUE) and that cell wall is RED; any deviation is addressed individually. (2) CER paragraph must contain: a specific CLAIM sentence, at least one piece of EVIDENCE naming a scientist or tenet, and a REASONING sentence that uses the word &#x27;therefore&#x27; or &#x27;because&#x27; to connect to Amina&#x27;s healing. Collect 6 notebooks (two from each ability group) at end of phase for rapid review.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Driving Question Board (DQB) Creation&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/8640601f847a586e97f0030c90135a9c&quot;&gt;Comparing animal and plant cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+theory+prokaryotic+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/c8c45e8126b65881b96c536160e9f5b2&quot;&gt;Introduction to cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+theory+prokaryotic+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners return to the class Driving Question Board displayed at the front. The anchoring driving question is re-read aloud together: &#x27;Why do cells in our body look so different from each other — and how does the shape of a cell determine the job it can do?&#x27; Each learner writes one new sticky note to add to the board: either (a) a NEW question today&#x27;s lesson raised for them, or (b) a statement of something today&#x27;s lesson helped them understand that moves them closer to answering the driving question. Learners also place a star sticker next to any Lesson 1 question on the DQB that today&#x27;s learning has begun to answer.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Hand out sticky notes (two colours: yellow = new question, green = growing understanding). Say: &#x27;We&#x27;ve been learning about cell theory and cell structure today. Look at our Driving Question Board. Has today&#x27;s lesson answered any of the questions we put up in Lesson 1? If so, put a star on it. Then write your own note — either a new question or a sentence that shows your thinking has grown.&#x27; WAIT TIME: Allow 4 minutes of silent reflection. As learners post notes, read 3–4 aloud: &#x27;Listen to this question from the back table: If all cells come from pre-existing cells, where did the FIRST cell come from? That is a brilliant scientific question that researchers still debate.&#x27; Point to the driving question: &#x27;We still haven&#x27;t answered the big one. Hold it. We&#x27;ll get there.&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;DQB Iterative Update: Making thinking visible on a shared public board builds a classroom culture of scientific inquiry. Colour-coded note types (question vs. understanding) allow the teacher to track the ratio of confusion to consolidation across the class — a real-time class-level formative signal. Star-sticker annotation shows learners that science is a progressive process of question refinement, not one-shot answers.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicators: (1) Every learner posts at least one note — absence of a note flags disengagement or confusion requiring follow-up. (2) Green &#x27;growing understanding&#x27; notes are checked for accuracy — a note reading &#x27;I now understand that all cells are the same&#x27; is a misconception requiring correction before Lesson 3. (3) Teacher photographs the DQB at end of lesson for lesson-planning reference.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Model Building Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/8ef024cff77d53aa8a74817f01142299&quot;&gt;Endosymbiosis theory&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+theory+prokaryotic+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/210efd38886b5c02897bbb926bcaa0d1&quot;&gt;The Cell Theory Practice&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+theory+prokaryotic+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners produce Version 1 of their Cumulative Cell Model. Using a full blank page in their science notebook, they sketch and label a generalised eukaryotic cell (they may choose plant or animal). Required labels for Version 1: cell membrane, cell wall (if plant), nucleus, cytoplasm, mitochondria, ribosomes, vacuole (if plant), endoplasmic reticulum. Beneath the sketch, learners write a Model Key: one sentence per label explaining the structure&#x27;s role. At the bottom of the page, they write a &#x27;Version 1 Limitation Statement&#x27;: &#x27;This model does not yet show…&#x27; — listing at least two things they know they don&#x27;t yet understand about cell structure. The page is headed VERSION 1 — [Date] and will be physically revised (not replaced) across the 12-lesson sequence.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Say: &#x27;Every scientist who studies cells uses models. Models are never perfect — but they capture what we know right now. Today you will draw Version 1 of YOUR cell model. By Lesson 12, this same page will be full of revisions, additions, and corrections. That&#x27;s what science looks like.&#x27; Display the Version 1 checklist on the board: 8 required labels, 1 sentence per label in the Key, 1 Limitation Statement with at least 2 gaps. Say: &#x27;You have 12 minutes. Work silently and independently — this is YOUR scientific record.&#x27; Circulate and narrate observations: &#x27;I see Wanjiku has labelled the mitochondria and written that it produces energy — excellent. I see Otieno has drawn a cell wall on an animal cell — let&#x27;s check: do animal cells have cell walls?&#x27; WAIT TIME: After posing a correction, wait 10 seconds for the learner to self-correct before assisting. In the final 2 minutes, ask learners to share their Limitation Statement with a partner: &#x27;Read your partner&#x27;s limitation. Do you agree those are real gaps? Add one of their gaps to your own list if you hadn&#x27;t thought of it.&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Cumulative Model Building (Version 1): Establishing a physical, dated, revisable model in the learner&#x27;s notebook externalises current understanding and creates a longitudinal scientific record. The Limitation Statement is a metacognitive tool — requiring learners to articulate what they do NOT yet know is a high-order NGSS practice (Developing and Using Models) and prevents false closure. The version-numbering system builds anticipation for future lessons.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicators: (1) Model has all 8 required labels — teacher uses the checklist during circulation to identify missing labels and prompt without telling: &#x27;Count your labels — how many do you have?&#x27; (2) Model Key sentences must include both structure AND function — &#x27;Nucleus: oval shape, contains DNA, controls cell activities&#x27; is adequate; &#x27;Nucleus: it&#x27;s in the middle&#x27; is insufficient and requires a prompt. (3) Limitation Statement: at least 2 genuine gaps listed — accept any scientifically honest statement (e.g., &#x27;I don&#x27;t yet know how the cell membrane decides what to let in&#x27;, &#x27;I don&#x27;t know how the nucleus communicates with the rest of the cell&#x27;). Collect all Version 1 models at the end of class, photograph for records, return next lesson.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;D. TEACHER REFLECTION&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;After the lesson, reflect on the following questions in your planner: (1) During the card sort, which features were most consistently misclassified — and does your Lesson 3 plan address those specific misconceptions? (2) Review the 6 collected CER paragraphs: did learners connect Virchow&#x27;s tenet directly to new skin cell production, or did they write generically about cells? If the latter, plan a 5-minute CER revisit at the start of Lesson 3. (3) Count the ratio of yellow (question) to green (understanding) DQB notes: if yellow heavily outnumbers green, learners may need a consolidation activity before Lesson 3 advances to cell specialisation. (4) Scan the Version 1 models: are animal cells being drawn with cell walls? Is the nucleus consistently represented as membrane-bound? Patterns across the class should inform your Lesson 3 opening correction sequence. (5) Reflect on wait time: did you hold the full 10–12 seconds, or did you answer for learners? Longer wait time consistently produces more complete learner responses — practise holding silence even when it feels uncomfortable.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;E. SUMMARY TABLE PROMPT  (pre-filled example for this lesson)&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;What did I observe?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;In this lesson, learners observed labelled diagrams of generalised animal cells, plant cells, and prokaryotic cells. They sorted structural feature cards into Prokaryote and Eukaryote categories and studied the ugali-kitchen analogy mapped onto cell structure components.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;What did I learn?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners learned the three tenets of cell theory (all living things are made of cells; the cell is the basic unit of life; all cells arise from pre-existing cells) and the contributions of Schleiden, Schwann, and Virchow. They learned the key structural differences between prokaryotic and eukaryotic cells, including the presence or absence of a membrane-bound nucleus and membrane-bound organelles.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;How does this explain the phenomenon?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners explained, using a Claim–Evidence–Reasoning paragraph, how Virchow&#x27;s tenet (&#x27;all cells from pre-existing cells&#x27;) accounts for the production of new skin cells during the healing of Amina&#x27;s finger. They also explained their Version 1 cell model using a labelled diagram with a structural-function key and articulated the limitations of their current model.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;p&gt;© 2026 SeaVuria and ARES Education. Aligned with KICD objectives. Developed by SeaVuria; technical implementation by ARES (with AI assistance from Claude). Licensed under &lt;a href=&quot;https://creativecommons.org/licenses/by-nc/4.0/&quot;&gt;CC BY-NC 4.0&lt;/a&gt; (&lt;a href=&quot;https://creativecommons.org/licenses/by-nc/4.0/&quot;&gt;https://creativecommons.org/licenses/by-nc/4.0/&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
&lt;/details&gt;

&lt;details class=&quot;lp-section&quot; id=&quot;lesson-3&quot; data-document-section&gt;
  &lt;summary&gt;Lesson 3 · Prokaryotic vs. Eukaryotic Cells: Two Worlds Inside One Body&lt;/summary&gt;
  &lt;div class=&quot;lp-document doc-preview&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;LESSON 3 (40 minutes): Prokaryotic vs. Eukaryotic Cells: Two Worlds Inside One Body&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;A. SPECIFIC LEARNING OUTCOMES&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Category&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Specific Learning Outcomes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Purpose&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;By the end of this lesson, learners will be able to compare and contrast prokaryotic and eukaryotic cells using structural evidence, and connect this distinction to the healing-cut phenomenon.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Knowledge&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners will identify and explain the key structural differences between prokaryotic and eukaryotic cells, including presence or absence of a membrane-bound nucleus, membrane-bound organelles, relative cell size, and cell wall composition.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Skills&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners will construct and complete a structured comparison table, analyse labelled diagrams of E. coli and a human cheek cell, and articulate differences using precise biological vocabulary.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Attitudes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners will appreciate that even the smallest structural difference — such as the absence of a nucleus — has profound consequences for how an organism functions, fostering curiosity about the diversity of life.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Key Inquiry Question&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;What are the structural differences between plant and animal cells? (This lesson extends that inquiry by first establishing the broader distinction between prokaryotic and eukaryotic cells, which underpins all later comparisons.)&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Purpose in Storyline&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;In Lesson 2, learners built a generalised cell model and encountered the prokaryote-eukaryote distinction briefly. Lesson 3 deepens that distinction by using a Kenya-relevant context — E. coli contamination in poorly stored nyama choma — to make prokaryotes real and consequential. This prepares learners for Lessons 4 and 5, where they will examine plant and animal eukaryotic ultrastructure in detail. The lesson also advances the driving question by establishing that not all cells are built the same way, even before specialisation begins.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Safety Notes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;No hazardous materials are used in this lesson. Diagrams and tables only. Remind learners that E. coli is used as a conceptual example; no live bacterial cultures are present. General classroom conduct rules apply.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;B. LESSON OVERVIEW&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;Learners begin by revisiting the healing-cut phenomenon and predicting whether the bacteria that might infect the wound are built the same way as the body cells fighting the infection. Through structured diagram analysis comparing E. coli (prokaryote) and a human cheek cell (eukaryote), learners complete a comparison table identifying four key structural differences. Cold-call questioning consolidates understanding across a minimum of five students. The lesson closes with a targeted Driving Question Board update.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;5&quot;&gt;&lt;p&gt;&lt;strong&gt;C. LESSON IMPLEMENTATION FRAMEWORK&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Phase&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Learner Experience&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Teacher Moves&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Sensemaking Strategy&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Formative Assessment Strategy&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Predict Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/98ccf1c8b3d35cfea5093cdb61b64836&quot;&gt;Prokaryotic and eukaryotic cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+prokaryote+eukaryote+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/91d77b7ea45e500da8887e84934b4cb6&quot;&gt;Prokaryotes and eukaryotes&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+prokaryote+eukaryote+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Teacher re-anchors the lesson to the healing-cut phenomenon. Learners are told: when Amina cut her finger while slicing onions in Nairobi, bacteria from the onion skin or blade could enter the wound. The teacher asks learners to open their science notebooks and respond individually (2 minutes, silent writing) to the prompt: &#x27;Amina is worried about bacteria entering her cut. Do you think a bacterium like E. coli is built the same way as Amina&#x27;s skin cells — or differently? Write down two reasons for your prediction.&#x27; After silent writing, learners share predictions with a shoulder partner for 1 minute. Three volunteers share with the class. Teacher scribes key prediction words on the board (no corrections yet): learners typically predict that bacteria are &#x27;smaller,&#x27; &#x27;simpler,&#x27; or &#x27;have no nucleus.&#x27; Teacher validates thinking without confirming or denying: all ideas remain live for testing.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Teacher opens with a brief verbal callback to Lesson 2: &#x27;Last lesson we said a cell is the basic unit of life — but are all cells built the same way? Let us think about this carefully.&#x27; Teacher writes the lesson focus question on the board: &#x27;Are the bacteria that could infect Amina&#x27;s cut built the same way as her body cells?&#x27; Teacher gives the silent-writing prompt verbally and writes it on the board. After 2 minutes, teacher says: &#x27;Turn to your shoulder partner — share what you wrote. You have 1 minute.&#x27; After partner talk, teacher cold-calls three students using the class register (not volunteers only). Teacher scribes their key words in a &#x27;Our Predictions&#x27; box on the board. Teacher then says: &#x27;By the end of this lesson, we will have enough evidence to confirm or revise every single one of these predictions. Let us go and find out.&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Prediction with written justification activates prior knowledge from Lesson 2 and creates cognitive dissonance — learners hold a tentative idea they are motivated to test. Scribing predictions publicly creates accountability and makes thinking visible for later revision.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Teacher scans written predictions during the 2-minute silent phase, noting whether learners are drawing on Lesson 2 vocabulary (nucleus, membrane, organelles) or relying only on everyday language. This informs the depth of scaffolding needed during the Observe Phase.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Observe Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/98ccf1c8b3d35cfea5093cdb61b64836&quot;&gt;Prokaryotic and eukaryotic cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+prokaryote+eukaryote+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 HTML:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/a9225822ddc15923af4f4e8b0cfe74cf&quot;&gt;Prokaryotic and Eukaryotic Cells (Flexbook)&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+prokaryote+eukaryote+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Teacher distributes (or projects) two large, clearly labelled diagrams side by side: (1) E. coli — a prokaryote responsible for food poisoning in poorly stored nyama choma, labelled with: cell wall (peptidoglycan), plasma membrane, cytoplasm, ribosomes, circular DNA (nucleoid region — no nuclear membrane), flagellum, approximate size 1–5 micrometres; (2) Human cheek cell — a eukaryote, labelled with: cell membrane, cytoplasm, nucleus with nuclear membrane, mitochondria, ribosomes, rough endoplasmic reticulum, approximate size 10–100 micrometres. Learners are given a structured comparison table (pre-printed or drawn in notebooks) with the following rows: Feature | E. coli (Prokaryote) | Human Cheek Cell (Eukaryote). Features listed: Presence of membrane-bound nucleus; Membrane-bound organelles present; Approximate size; Cell wall (present or absent; composition); Genetic material location. Learners work individually for 4 minutes to complete the table using the diagrams only — no teacher input during this phase. They then compare answers with a partner for 1 minute before a whole-class review.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Teacher introduces the diagrams by contextualising E. coli: &#x27;E. coli is a bacterium. In Kenya, it has been linked to food poisoning cases from nyama choma that is left out too long at a roadside kiosk in Nairobi or Mombasa. It is very small — about 2 micrometres. Amina would not see it, but her white blood cells would find it. Now, let us look carefully at how it is built compared to her own cheek cell.&#x27; Teacher models how to read one row of the comparison table using the first feature only: &#x27;I look at the E. coli diagram — I can see DNA here, but is there a membrane around it? No. So I write: no membrane-bound nucleus. Now you complete the rest.&#x27; Teacher sets a 4-minute individual work timer and circulates silently, observing tables without correcting. After 4 minutes: &#x27;Compare your table with your partner. If you disagree on any row, put a small question mark — we will sort it out together.&#x27; After 1 minute of partner comparison, teacher leads whole-class review row by row using cold-call: &#x27;Wanjiku, what did you write for membrane-bound organelles in E. coli?&#x27; WAIT TIME: 5 seconds minimum before prompting. Teacher confirms correct answers and addresses misconceptions immediately, especially the common confusion between ribosomes (present in both, not membrane-bound) and membrane-bound organelles (absent in prokaryotes).&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Diagram analysis with a structured comparison table is a disciplinary core practice in biology. The table format reduces cognitive load and ensures all learners engage with the same four structural features simultaneously. The individual-then-partner-then-whole-class sequence (I Do briefly, You Do, We Check) builds confidence before public sharing.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Teacher scans comparison tables during circulation. Key diagnostic questions: Are learners correctly identifying the nucleoid region as distinct from a membrane-bound nucleus? Are they noting that ribosomes appear in both cells? These are the two highest-frequency errors. Teacher makes a mental note of two or three specific misconceptions to address during cold-call review.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Explain Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/9f2d3e6f004d59c7a0106ab068d0cf53&quot;&gt;Organelles in eukaryotic cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+prokaryote+eukaryote+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/010c56a26444568587b8d2019e991130&quot;&gt;Prokaryotic and Eukaryotic Cells Practice&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+prokaryote+eukaryote+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Teacher facilitates a cold-call consolidation round with a minimum of 5 students. Each student is asked a different question at a slightly higher level of explanation (not just recall). Questions escalate from identification to explanation to application. After each response, the class is asked to signal agreement or disagreement using thumbs (up, sideways, down). Learners then write a 3-sentence summary in their notebooks: Sentence 1 — one structural feature that makes E. coli a prokaryote; Sentence 2 — one structural feature that makes the cheek cell a eukaryote; Sentence 3 — why this difference matters for understanding the healing-cut story. Teacher concludes the explain phase by formally introducing the terms prokaryote (from Greek: pro = before, karyon = nucleus) and eukaryote (eu = true, karyon = nucleus), writing both etymologies on the board and asking learners to copy them as a memory anchor.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Cold-call sequence (minimum 5 students, called from the register, not self-selected): Student 1 — identification level: &#x27;Ochieng, look at the E. coli diagram. What is the name of the region where its DNA is found, and why is it different from the nucleus in the cheek cell?&#x27; WAIT TIME: 5 seconds. If no response after 5 seconds: &#x27;Look at the label on the diagram — what does it say near the DNA?&#x27; Student 2 — explanation level: &#x27;Fatuma, E. coli has ribosomes AND the cheek cell has ribosomes — does that make them the same type of cell? Explain your thinking.&#x27; WAIT TIME: 7 seconds. Student 3 — comparison level: &#x27;Kamau, give me one feature from your table that is DIFFERENT between the two cells and explain what that difference means.&#x27; WAIT TIME: 5 seconds. Student 4 — size reasoning: &#x27;Aisha, the cheek cell is about 50 times bigger than E. coli. Why might a larger cell need membrane-bound organelles when a smaller cell does not?&#x27; WAIT TIME: 8 seconds — this is a higher-order question; teacher accepts reasonable reasoning, not a single right answer. Student 5 — application to phenomenon: &#x27;Brian, Amina is worried about bacteria in her cut. Based on what we have just learned, are those bacteria prokaryotes or eukaryotes? How do you know?&#x27; WAIT TIME: 5 seconds. After each response, teacher asks the class: &#x27;Thumbs — do you agree, partly agree, or disagree with what Brian said? ... Good. Anyango, why did you put your thumb sideways?&#x27; After cold-call round, teacher says: &#x27;Now write three sentences in your notebook. I will give you 3 minutes. Sentence 1: one structural feature that makes E. coli a prokaryote. Sentence 2: one structural feature that makes the cheek cell a eukaryote. Sentence 3: why this difference matters for the healing-cut story.&#x27; Teacher then writes the etymologies on the board and says: &#x27;These words carry their meaning inside them. Prokaryote — before nucleus. Eukaryote — true nucleus. Every time you see these words, let the Greek roots remind you what they mean.&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Escalating cold-call questions move learners from recall to reasoning, a deliberate Bloom progression within a single phase. Thumbs signalling makes all learners accountable for evaluating peers answers, not just the student called upon. Three-sentence written summary forces synthesis at the individual level before moving to DQB and model work.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Teacher reads over shoulders during the 3-minute writing period, checking that Sentence 3 connects to the phenomenon and is not purely definitional. Learners who write only definitions for all three sentences are identified for targeted questioning during model-building. The thumb-signal pattern also reveals whether the class as a whole has resolved the ribosome misconception.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Driving Question Board (DQB) Creation&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/8640601f847a586e97f0030c90135a9c&quot;&gt;Comparing animal and plant cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+prokaryote+eukaryote+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/7420d24fcc8f5eb78e3f3947ada0a787&quot;&gt;Prokaryotic and eukaryotic cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+prokaryote+eukaryote+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Teacher directs learners attention to the class DQB poster (established in Lesson 1). Teacher reads aloud two or three of the original wonder-questions posted by the class that are now partially or fully addressable — for example: &#x27;Why are some cells bigger than others?&#x27; or &#x27;Are germs the same as cells?&#x27; Learners are asked to take a sticky note (or a small piece of paper) and write one sentence beginning with: &#x27;We now know that prokaryotes and eukaryotes differ in...&#x27; and a second sentence beginning with: &#x27;But we still wonder...&#x27; Learners post their notes on the DQB in two columns: WHAT WE NOW KNOW and WHAT WE STILL WONDER. Teacher facilitates a 2-minute gallery scan where three learners read aloud one note each from the WONDER column — these become flagged questions for Lessons 4 and 5.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Teacher stands at the DQB and says: &#x27;In Lesson 1, some of you wondered whether bacteria and human cells are the same thing. Let us look — (reads the relevant wonder sticky note aloud). Can we now answer that? Turn to your partner — 20 seconds.&#x27; Teacher then distributes sticky notes and gives the two-sentence scaffold verbally and in writing on the board: SENTENCE A: We now know that prokaryotes and eukaryotes differ in... SENTENCE B: But we still wonder... Teacher says: &#x27;You have 2 minutes to write both sentences and post them on the board.&#x27; Teacher circulates and encourages specificity: &#x27;Do not just write they are different — write HOW they are different, using vocabulary from your table.&#x27; After posting, teacher selects three WONDER notes and reads them aloud: &#x27;These are excellent questions — and they are exactly what we will be investigating in Lessons 4 and 5, when we go inside the organelles of plant and animal cells. Hold onto these questions.&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;The DQB update anchors new learning to the class narrative and makes epistemic progress visible. Separating KNOW from WONDER trains learners to distinguish evidence-based claims from open questions — a core scientific practice. The teacher reading WONDER notes aloud signals that not-yet-knowing is intellectually valued, not a failure.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Teacher quickly scans the KNOW column notes during posting. Are learners using structural vocabulary (nucleus, organelles, cell wall) or only general language (bigger, more complex)? The quality of vocabulary in KNOW notes reveals whether the comparison table exercise achieved its learning target.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Model Building Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/8c2e36a9f2a95dfa8dbadc27529da85d&quot;&gt;Plant cell walls&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+prokaryote+eukaryote+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/91d77b7ea45e500da8887e84934b4cb6&quot;&gt;Prokaryotes and eukaryotes&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+prokaryote+eukaryote+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners open their science notebooks to their Version 1 cumulative cell model (the generalised cell sketch from Lesson 2). Teacher instructs them to add a second panel beside or below their existing sketch, labelled Version 1 add-on: Prokaryote vs. Eukaryote. Learners draw two simple outline diagrams side by side — one for E. coli and one for a human cheek cell — and annotate each with at least four labelled features from their comparison table. They use a simple colour code: red annotation = feature present in prokaryote only; blue annotation = feature present in eukaryote only; black annotation = feature present in both. Learners add a one-sentence caption below the two diagrams: &#x27;A prokaryote has no membrane-bound nucleus, while a eukaryote does — and this difference matters because...&#x27; Teacher circulates and asks targeted questions of individual learners to probe depth of understanding.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Teacher explains the task: &#x27;Your cumulative cell model is growing. In Lesson 2 you drew a generalised cell. Today you add a new panel — showing both types of cells side by side, with the differences clearly annotated. This is not just copying — it is building a model that explains. Use the colour code on the board: red for prokaryote only, blue for eukaryote only, black for both.&#x27; Teacher writes the colour code on the board and the sentence stem for the caption. Teacher circulates during the 5-minute drawing period and poses probing questions to individual learners: &#x27;You have drawn a cell wall on both — but are they made of the same material? Check your table.&#x27; or &#x27;You have not labelled the nucleoid region on your E. coli — is that because E. coli has no DNA, or because the DNA is arranged differently?&#x27; Teacher selects two learners whose models show strong annotations to briefly share with the class in the final 1 minute: &#x27;Wanjiru, hold up your model and tell us one annotation you are proud of and why.&#x27; Teacher closes the lesson by connecting back to the phenomenon: &#x27;Next lesson, we go inside the eukaryotic cell — specifically the plant cell. And remember: the onion that Amina was cutting when she hurt her finger — that is a plant. Its cells will be our starting point.&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Cumulative model building is the primary learning artefact of this unit. Each lesson adds a new version, making intellectual growth tangible and visible. The colour-coding system requires learners to make comparative judgements, not just label in isolation. Sharing two models briefly at the close creates a low-stakes public standard and celebrates precision.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Teacher evaluates whether learners are correctly using the colour code — specifically, whether ribosomes appear in black (present in both) rather than red or blue. The sentence stem caption is a key formative probe: learners who can complete &#x27;this difference matters because...&#x27; with a biologically accurate consequence (e.g. compartmentalisation allows more complex functions) are demonstrating transfer beyond recall. Learners who leave the caption blank or write only &#x27;they are different types&#x27; are flagged for re-engagement in Lesson 4.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;D. TEACHER REFLECTION&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;After the lesson, consider the following: (1) Did the cold-call questions reveal any persistent confusion between ribosomes (present in both cell types, not membrane-bound) and membrane-bound organelles? If so, begin Lesson 4 with a brief 2-minute clarification using the ribosome row of the comparison table. (2) Were learners able to connect the E. coli example to the healing-cut phenomenon in their Sentence 3 summaries, or did they treat the science as abstract and disconnected? If the phenomenon link was weak, use the Lesson 4 opening to make that bridge explicit again. (3) Did the DQB WONDER notes reveal questions about organelle function that indicate readiness for Lesson 4, or do learners still have fundamental uncertainty about what a membrane-bound organelle is? Use this to calibrate the depth of diagram analysis in Lesson 4. (4) Were all five cold-called students drawn from different groups (gender, ability, seating zone) to ensure equitable participation? Review the register markings and adjust the call pattern in Lesson 4 accordingly.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;E. SUMMARY TABLE PROMPT  (pre-filled example for this lesson)&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;What did I observe?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners observed two labelled diagrams — E. coli (prokaryote, linked to nyama choma food poisoning) and a human cheek cell (eukaryote) — and identified structural differences including the presence or absence of a membrane-bound nucleus, membrane-bound organelles, relative size, and cell wall composition.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;What did I learn?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Prokaryotic cells (such as E. coli bacteria) lack a membrane-bound nucleus and membrane-bound organelles; their DNA floats freely in a nucleoid region. Eukaryotic cells (such as human cheek cells) have a membrane-bound nucleus and membrane-bound organelles. Prokaryotes are generally much smaller (1–5 micrometres) than eukaryotes (10–100 micrometres). Both cell types contain ribosomes, but ribosomes are not membrane-bound in either.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;How does this explain the phenomenon?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;The bacteria that could infect Amina&#x27;s cut (E. coli) are prokaryotes — structurally far simpler than her own body cells, which are eukaryotes. The presence of a membrane-bound nucleus in eukaryotic cells allows DNA to be protected and gene expression to be regulated in ways that support the complexity needed for wound healing. This structural difference explains why, even though bacteria and human cells are both alive, they behave so differently — and why Amina&#x27;s white blood cells (eukaryotes) can carry out the complex task of recognising and destroying E. coli (prokaryote) cells in the wound.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;p&gt;© 2026 SeaVuria and ARES Education. Aligned with KICD objectives. Developed by SeaVuria; technical implementation by ARES (with AI assistance from Claude). Licensed under &lt;a href=&quot;https://creativecommons.org/licenses/by-nc/4.0/&quot;&gt;CC BY-NC 4.0&lt;/a&gt; (&lt;a href=&quot;https://creativecommons.org/licenses/by-nc/4.0/&quot;&gt;https://creativecommons.org/licenses/by-nc/4.0/&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
&lt;/details&gt;

&lt;details class=&quot;lp-section&quot; id=&quot;lesson-4&quot; data-document-section&gt;
  &lt;summary&gt;Lesson 4 · Plant Cell Ultrastructure — Every Organelle Has a Farming Job&lt;/summary&gt;
  &lt;div class=&quot;lp-document doc-preview&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;LESSON 4 (80 minutes): Plant Cell Ultrastructure — Every Organelle Has a Farming Job&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;A. SPECIFIC LEARNING OUTCOMES&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Category&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Specific Learning Outcomes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Purpose&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;To identify and describe the structure and function of plant cell organelles using labelled diagrams and electron micrograph images, and to connect organelle specialisation to the healing phenomenon.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Knowledge&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners identify the following plant cell organelles and describe their functions: cell wall, cell membrane, nucleus, chloroplasts, large central vacuole, mitochondria, endoplasmic reticulum (rough and smooth), ribosomes, and Golgi apparatus. Learners distinguish plant cell ultrastructure from animal cell ultrastructure covered in Lesson 3.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Skills&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners practise diagram analysis (interpreting labelled electron micrographs), scientific annotation (adding labels with function notes), comparative reasoning (plant vs. animal cell), and cumulative model revision.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Attitudes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners appreciate that the extraordinary precision of organelle function in a single maize leaf cell mirrors the precision seen in the wound-healing phenomenon — complexity is built from structure.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Key Inquiry Question&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;What are the structural differences between plant and animal cells? How does cell specialisation enable organisms to carry out complex life functions?&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Purpose in Storyline&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;In Lessons 1–3 learners anchored the phenomenon (the healing cut), explored cell theory, and mapped animal cell organelles. Lesson 4 expands the structural vocabulary to plant cells, using a Rift Valley maize farm as a sustained metaphor. This prepares learners for Lesson 5, where they directly compare plant and animal cells and begin to explain how organelle differences drive functional differences — a key step toward answering why the fibroblast, the platelet, and the epidermal cell look so different from one another.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Safety Notes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;No wet practical in this lesson. If a projector is used, ensure the power cable is secured and away from learner pathways. Printed diagram sheets should have no sharp staples exposed. Remind learners to handle printed resources with care.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;B. LESSON OVERVIEW&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;This is a teacher-led diagram-analysis lesson in which learners examine large labelled diagrams and, where a projector is available, electron micrograph images of a plant cell. Using the extended metaphor of a maize farm in the Rift Valley, the teacher guides learners through nine key organelles, building function understanding organelle-by-organelle. Learners annotate a blank plant cell outline, participate in structured questioning rounds, and close the lesson by revising their cumulative cell model to produce Version 2 — the Plant Cell. The lesson deliberately contrasts plant and animal cell features to keep the driving question alive: if all cells share the same DNA, why do plant cells have chloroplasts and animal cells do not?&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;5&quot;&gt;&lt;p&gt;&lt;strong&gt;C. LESSON IMPLEMENTATION FRAMEWORK&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Phase&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Learner Experience&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Teacher Moves&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Sensemaking Strategy&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Formative Assessment Strategy&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Predict Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/8640601f847a586e97f0030c90135a9c&quot;&gt;Comparing animal and plant cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+plant+ultrastructure+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/26cbebba12c35a488ff3d37d5427b3eb&quot;&gt;Plant vs animal cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+plant+ultrastructure+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners receive a blank, unlabelled outline of a plant cell (prepared as a photocopied handout or drawn on the board for copying). Working individually for 4 minutes, they write the names of any organelles they think will be present and place a ★ next to those they believe are ALSO found in animal cells (from Lesson 3). They then share predictions with a shoulder partner for 2 minutes. Teacher collects a quick show-of-hands class poll: &#x27;Hands up if you predicted chloroplasts.&#x27; &#x27;Keep your hand up if you also marked chloroplasts as shared with animal cells.&#x27; The visual mismatch in raised hands surfaces the core conceptual tension immediately.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Distribute blank plant cell outlines. Say verbatim: &#x27;Before I show you anything, I want your brain&#x27;s first draft. Write every organelle you think a plant cell has. Put a star next to any you think it shares with the animal cell we studied last lesson.&#x27; Allow 4 minutes of silent individual work — do NOT circulate yet; let learners commit to predictions. After 4 minutes, say: &#x27;Turn to your partner. Compare your lists. Do you agree on which organelles are shared?&#x27; Allow 2 minutes of partner talk. Conduct the show-of-hands poll. Cold-call 3 learners who kept their hand up for chloroplasts being shared: &#x27;Akinyi, why did you think animal cells also have chloroplasts?&#x27; Apply 12-second wait time before accepting an answer. Record class predictions in two columns on the board — SHARED / PLANT ONLY — and leave it visible throughout the lesson for revision.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Predict-then-Poll (Elicitation). Learners externalise prior knowledge before instruction, creating cognitive dissonance that motivates information-seeking. The two-column board record gives learners a tangible target to confirm or revise, turning the lesson into an active self-correction exercise rather than passive reception.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicator: Every learner has at least 3 organelles written on their outline before partner share. Teacher scans written predictions during the 4-minute window. Flag any learner with a blank sheet for targeted support. The show-of-hands poll reveals class-level misconceptions about chloroplast distribution — if more than 40% of hands stay up (believing animal cells have chloroplasts), the teacher notes this for explicit address in Phase 3.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Observe Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/9f2d3e6f004d59c7a0106ab068d0cf53&quot;&gt;Organelles in eukaryotic cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+plant+ultrastructure+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 HTML:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/64eedd0564b25ce08f407812919dbd53&quot;&gt;Plant Cell Structures (Flexbook)&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+plant+ultrastructure+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;The teacher reveals a large, fully labelled plant cell diagram (projected or poster-sized printed copy posted at the front). Where a projector is available, the teacher also shows three electron micrograph images in sequence: (1) a chloroplast from a maize leaf, (2) a large central vacuole in an onion epidermal cell, (3) the cell wall boundary between two adjacent plant cells. Learners observe silently for 90 seconds per image, then annotate their blank outline with labels and a one-phrase function note beside each label (e.g., &#x27;chloroplast — captures sunlight to make food&#x27;). Learners work individually during annotation. After completing their own annotations, learners pair up and check each other&#x27;s function notes against the labelled diagram, adding corrections in a different colour pen.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Post or project the fully labelled diagram. Say: &#x27;You have 90 seconds to look — do not write yet. Just look. Notice what is familiar from our animal cell lesson and what is completely new.&#x27; Set a visible 90-second timer. After 90 seconds: &#x27;Now annotate your outline. For every organelle you label, write a short function phrase — one line, in your own words.&#x27; Circulate during the 8-minute annotation window; do NOT correct yet. If a projector is available, show each EM image for 60 seconds before the annotation phase, saying: &#x27;This is an actual electron micrograph — a photograph taken with a beam of electrons, not light. The chloroplast you are looking at is from a maize leaf, the same maize grown in farms around the Rift Valley.&#x27; After the annotation period, instruct peer-checking: &#x27;Swap sheets with your partner. Using your green/red pen, tick what matches the diagram and add a correction where needed.&#x27; Allow 4 minutes for peer-checking. Collect 5 random sheets to scan function accuracy before Phase 3.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observe-Annotate-Peer Check (Evidence Recording with Immediate Peer Verification). The silent observation window before annotation prevents learners from writing without seeing. Peer-checking in a contrasting colour makes revision visible and non-threatening, building scientific habit of checking evidence against a source.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicator: Learner annotations contain both a label AND a function phrase for at least 7 of the 9 target organelles. During circulation, teacher checks that function phrases are present (not just labels). Teacher notes the 5 collected sheets: if fewer than 5/9 organelles have function phrases, the teacher briefly pauses Phase 3 to model two or three function phrases on the board.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Explain Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/c1adffcd23b5561ca8687b2d0a7fff8e&quot;&gt;Overview of animal and plant cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+plant+ultrastructure+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/34d28635c2d45902bee3acf7a60fb2f7&quot;&gt;Plant Cell Structures Practice&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+plant+ultrastructure+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;The teacher delivers a structured, metaphor-anchored explanation of plant cell organelles using the Rift Valley Maize Farm metaphor. Each organelle is mapped to a farm role. Learners listen, watch the teacher build the metaphor table on the board, and add any missing information to their annotated outline. Midway through the explanation, learners complete a structured &#x27;Organelle Job Card&#x27; matching task individually. At the end of the explanation, the teacher returns to the anchoring phenomenon: learners discuss in triads why a plant cell — unlike the epidermal cell in the healing cut — contains chloroplasts, and what this tells us about how structure is linked to the cell&#x27;s environment and job.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Build the following table on the board line-by-line, revealing one organelle at a time. Read each line aloud, pause, and ask a cold-call question before writing the next line. Target: minimum 9 cold-calls across the table, one per organelle.&lt;/p&gt;&lt;p&gt;MAIZE FARM METAPHOR TABLE:&lt;/p&gt;&lt;p&gt;–  Cell Wall → The perimeter fence and brick walls of the farm — gives shape, support, protection.&lt;/p&gt;&lt;p&gt;–  Cell Membrane → The farm gate — controls what enters and leaves.&lt;/p&gt;&lt;p&gt;–  Nucleus → The farm owner&#x27;s office — holds all the plans (DNA) and gives instructions.&lt;/p&gt;&lt;p&gt;–  Chloroplast → The solar panels on the farm — capture sunlight to make food (glucose) via photosynthesis.&lt;/p&gt;&lt;p&gt;–  Large Central Vacuole → The farm&#x27;s water storage tank — stores water, maintains pressure (turgor), stores nutrients and waste.&lt;/p&gt;&lt;p&gt;–  Mitochondria → The farm&#x27;s generator — releases energy from glucose for all farm activities (respiration).&lt;/p&gt;&lt;p&gt;–  Rough Endoplasmic Reticulum → The farm&#x27;s delivery road network with loading bays — transports and modifies proteins made by ribosomes.&lt;/p&gt;&lt;p&gt;–  Ribosomes → The farm workers — build proteins from instructions sent by the nucleus.&lt;/p&gt;&lt;p&gt;–  Golgi Apparatus → The farm&#x27;s packaging and dispatch depot — sorts, modifies, and ships proteins and lipids to where they are needed.&lt;/p&gt;&lt;p&gt;For each organelle, use this 3-step routine:&lt;/p&gt;&lt;p&gt;1. Point to the organelle on the diagram.&lt;/p&gt;&lt;p&gt;2. Say: &#x27;In our maize farm, this organelle is like the [X] because...&#x27; — wait 12 seconds — cold-call one learner to complete the analogy before you confirm.&lt;/p&gt;&lt;p&gt;3. Write the confirmed metaphor and function on the board.&lt;/p&gt;&lt;p&gt;After the full table is built, distribute the Organelle Job Card (a half-page handout with two columns: ORGANELLE and FARM JOB — all farm jobs listed, organelles blank). Learners fill it individually in 4 minutes.&lt;/p&gt;&lt;p&gt;Return to the phenomenon: &#x27;Think back to Amina&#x27;s cut finger. The epidermal cells that grew back over the wound — those are animal cells. They have no chloroplasts. Why not? What does that tell you?&#x27; Wait 15 seconds. Cold-call 2 learners. Guide toward: epidermal cells do not need to photosynthesise — they get energy from food — so carrying a chloroplast would be wasteful. Structure matches function. Say verbatim: &#x27;This is the heart of our driving question. Every organelle exists because the cell&#x27;s job demands it. No more, no less.&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Metaphor Anchoring + Structured Cold-Call Explanation. The Rift Valley Maize Farm metaphor gives learners a concrete, culturally grounded schema onto which abstract organelle functions are mapped. The cold-call routine (predict the analogy before the teacher confirms) keeps learners cognitively active during direct instruction. The phenomenon reconnect at the close prevents the farm metaphor from becoming decorative — it is immediately used as a reasoning tool.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicator: Learners complete the Organelle Job Card with at least 8/9 correct matches. Teacher collects all Job Cards. Any learner with 5 or fewer correct is identified for a brief re-teach during the Model Building phase. The triad discussion on epidermal cells vs. plant cells is assessed by listening to 2 triads: teacher listens for the phrase &#x27;structure matches function&#x27; or an equivalent, student-generated idea.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Driving Question Board (DQB) Creation&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/8640601f847a586e97f0030c90135a9c&quot;&gt;Comparing animal and plant cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+plant+ultrastructure+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/26cbebba12c35a488ff3d37d5427b3eb&quot;&gt;Plant vs animal cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+plant+ultrastructure+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners individually write one sticky note (or a note on a folded card if sticky notes are unavailable) responding to ONE of the following two prompts, assigned by row: Row A — &#x27;What does today&#x27;s lesson about plant cell organelles help you understand about the driving question — why do cells look different?&#x27; Row B — &#x27;What new question does today&#x27;s lesson raise for you about cell structure or the healing cut?&#x27; Learners post their notes on the class Driving Question Board in the designated LESSON 4 section. The teacher reads 4 notes aloud (2 from each row), and the class briefly discusses whether each note represents a growing understanding or a new mystery. The teacher physically draws a line connecting two DQB notes that together suggest an emerging answer: &#x27;Plant cells have chloroplasts because they make their own food — animal cells, including Amina&#x27;s epidermal cells, do not need to.&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Distribute sticky notes or folded cards. Say: &#x27;You have 3 minutes — individual, silent. Write your best thinking on the prompt for your row.&#x27; After 3 minutes, direct learners to post notes on the DQB. Read 4 notes aloud. For each, ask th
