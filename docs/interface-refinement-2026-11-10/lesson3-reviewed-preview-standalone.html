 the visualiser in the next lesson as exemplars.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Say: &#x27;Take out your cumulative model. This is Lesson 8 of 12 — your model should now show organelles, the differences between plant and animal cells, and today we are adding a new layer: specialisation. Add at least two specialised cells with full annotations. Connect each one with an arrow back to the healing cut. You have 10 minutes.&#x27; Set a timer. Circulate and narrate: &#x27;I can see Baraka has drawn the nerve cell with a long axon — Baraka, add a label explaining WHY the axon is long and connect it to the phenomenon.&#x27; At the 8-minute mark, say: &#x27;Two minutes remaining — make sure you have written your one-sentence model claim at the bottom.&#x27; After 10 minutes, cold-call one learner to read their model claim aloud. Ask the class: &#x27;Does this claim hold for ALL five cells we studied today? Give me a thumbs up if yes, thumbs sideways if you are not sure.&#x27; Address any thumbs sideways before closing. Close the lesson by saying: &#x27;Your model is getting more powerful. Next lesson, we go deeper — we will ask: if individual cells are specialised, what happens when many of the same specialised cell work together? That is the question of tissues — and it brings us one step closer to fully explaining the healing cut.&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Cumulative Model Revision (Scientific Modelling — NGSS SEP 2). The cumulative model is the primary sensemaking artefact of the entire 12-lesson sequence. Requiring learners to add to — rather than replace — their model builds a visible record of conceptual change over time. The annotation requirement (structural feature → function → phenomenon connection) forces learners to integrate three levels of explanation in a single diagram, which is a hallmark of systems thinking. The one-sentence model claim is a high-leverage formative tool: it compresses the lesson&#x27;s core idea into a single falsifiable statement that the class can test against future evidence.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicator: Each learner&#x27;s model contains at least two newly added specialised cells with all three annotation components present (structural feature, function, phenomenon connection). During circulation, look for the phenomenon arrow — learners who draw the connection back to the healing cut are demonstrating the highest level of integration. Learners whose annotations only describe structure (e.g., &#x27;biconcave shape&#x27;) without functional explanation need targeted follow-up at the start of Lesson 9. Collect 5–6 models at the end of class (rotate which learners submit each lesson) for written feedback before Lesson 9.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;D. TEACHER REFLECTION&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;After delivering this lesson, reflect on the following questions before planning Lesson 9:&lt;/p&gt;&lt;p&gt;1. PREDICTION QUALITY: Were learners&#x27; initial predictions in Phase 1 purely visual (shape descriptions) or functional (shape-to-job links)? If most predictions were visual only, it suggests the organelle lessons (1–7) have not yet been connected to function sufficiently — plan a brief review at the start of Lesson 9.&lt;/p&gt;&lt;p&gt;2. SICKLE-CELL PIVOT: Did the sickle-cell supporting phenomenon land as intended? Could learners articulate the CER independently, or did they need heavy scaffolding? If fewer than 60% of cold-called learners gave a complete CER, consider using a second supporting phenomenon at the start of Lesson 9 (e.g., the effect of dehydration on red blood cell shape in long-distance runners like Eliud Kipchoge&#x27;s training regime) before advancing to tissues.&lt;/p&gt;&lt;p&gt;3. DQB NEW QUESTIONS: What new questions appeared on the DQB? Sort them and identify whether the class is ready to move to the tissue level (Lesson 9) or whether key structure-function links for individual cells need consolidation. If questions cluster around &#x27;how do cells know what to become?&#x27;, note that differentiation/gene expression is a Grade 11 concept — acknowledge it but park it explicitly on the DQB as a &#x27;future learning&#x27; question.&lt;/p&gt;&lt;p&gt;4. MODEL REVISION DEPTH: Review the 5–6 collected models. Are learners making the phenomenon connection arrow, or treating the model as a stand-alone biology diagram? If the phenomenon connection is absent, open Lesson 9 by projecting one strong model (anonymised or with permission) that shows the connection, and ask the class: &#x27;What makes this model more powerful than one that doesn&#x27;t have this arrow?&#x27;&lt;/p&gt;&lt;p&gt;5. PACING: This lesson is content-rich. If Phase 3 (Explain) ran over time, consider splitting the sickle-cell CER discussion into the opening 10 minutes of Lesson 9 as a &#x27;Do Now&#x27; consolidation activity rather than cutting the Model Building phase short.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;E. SUMMARY TABLE PROMPT  (pre-filled example for this lesson)&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;What did I observe?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners examined annotated diagrams and micrographs of five specialised animal cells — red blood cells (biconcave, no nucleus), white blood cells (irregular shape, many lysosomes), nerve cells (long axon, myelin sheath), sperm cells (flagellum, mitochondria-packed midpiece), and muscle cells (many mitochondria, myofilaments) — and compared normal red blood cells with sickle cells using printed micrograph evidence.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;What did I learn?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners learned that cell specialisation is the process by which cells develop distinct structures that equip them for specific functions; that structural features such as the absence of a nucleus (RBC), a long axon (neuron), or a flagellum (sperm) are not random but are direct adaptations to function; and that when cell shape is disrupted — as in sickle-cell anaemia — function is catastrophically compromised, providing powerful evidence that shape determines function.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;How does this explain the phenomenon?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners explained how each of the five specialised animal cells contributes to the healing-cut phenomenon sequence — red blood cells deliver oxygen to repair tissue, white blood cells engulf bacteria at the wound site, nerve cells transmit pain signals, muscle cells enable movement that keeps the wound protected, and sperm cells (while not directly involved in healing) demonstrate the principle that extreme specialisation trades generalist survival for singular functional excellence. Learners used the Claim-Evidence-Reasoning framework to argue from the sickle-cell micrograph that cell shape is the physical basis of cell function.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;p&gt;© 2026 SeaVuria and ARES Education. Aligned with KICD objectives. Developed by SeaVuria; technical implementation by ARES (with AI assistance from Claude). Licensed under &lt;a href=&quot;https://creativecommons.org/licenses/by-nc/4.0/&quot;&gt;CC BY-NC 4.0&lt;/a&gt; (&lt;a href=&quot;https://creativecommons.org/licenses/by-nc/4.0/&quot;&gt;https://creativecommons.org/licenses/by-nc/4.0/&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
&lt;/details&gt;

&lt;details class=&quot;lp-section&quot; id=&quot;lesson-9&quot; data-document-section&gt;
  &lt;summary&gt;Lesson 9 · Specialised Plant Cells: Form Meets Function in the Bean Seedling&lt;/summary&gt;
  &lt;div class=&quot;lp-document doc-preview&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;LESSON 9 (80 minutes): Specialised Plant Cells: Form Meets Function in the Bean Seedling&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;A. SPECIFIC LEARNING OUTCOMES&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Category&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Specific Learning Outcomes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Purpose&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;To examine the structure of specialised plant cells and explain how each cell&#x27;s shape and internal organisation directly determines its function in the plant body.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Knowledge&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners will be able to identify and describe the structural features of root hair cells, guard cells, xylem vessels, phloem sieve tubes, and palisade mesophyll cells, and explain how each structure suits the cell to its specific function.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Skills&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners will practise scientific drawing of specialised plant cells, classify cells by function using evidence from structural features, and construct explanatory links between cell shape and plant physiology.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Attitudes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners appreciate that the elegant &#x27;fit&#x27; between a cell&#x27;s shape and its function is not accidental but is the product of millions of years of biological refinement — and that this same principle applies to every cell involved in healing the cut finger.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Key Inquiry Question&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;How does cell specialisation enable organisms to carry out complex life functions?&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Purpose in Storyline&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;In Lessons 1–8 learners established what cells are, how plant and animal cells differ, and how animal cells specialise (platelets, red blood cells, neutrophils). Lesson 9 pivots to the plant side of the storyline: the bean seedling that has been growing since Lesson 1 is now visibly differentiated — roots, stems, and leaves are distinct. Learners ask: does the same &#x27;shape-determines-job&#x27; rule that applied to blood cells also govern the very different cells inside this seedling? By the end of this lesson the driving question expands: the principle of specialisation is not unique to animals healing wounds — it is universal across all living things.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Safety Notes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;No sharp instruments or chemicals are used in this lesson. If fresh bean seedlings are handled, learners should wash hands after. Ensure no learner has a legume allergy before handling bean material. Microscope glass slides from previous lessons should be stored away safely before the card-matching activity begins to prevent breakage.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;B. LESSON OVERVIEW&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;Learners begin by predicting whether plant cells also specialise, using the visible bean seedling as evidence. They then observe detailed diagrams and (where available) prepared microscope slides or a teacher-led projected image set of five key specialised plant cells: root hair cells, guard cells, xylem vessels, phloem sieve tubes, and palisade mesophyll cells. A structured &#x27;Match-the-Card&#x27; group activity drives sensemaking, requiring learners to link labelled cell diagrams to function cards and habitat-context cards (e.g., dry Turkana vs. humid Kericho for guard cells). Learners update their cumulative cell-specialisation model and add new question cards to the Driving Question Board, bridging toward the upcoming lessons on plant nutrition and transport.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;5&quot;&gt;&lt;p&gt;&lt;strong&gt;C. LESSON IMPLEMENTATION FRAMEWORK&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Phase&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Learner Experience&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Teacher Moves&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Sensemaking Strategy&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Formative Assessment Strategy&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Predict Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/8640601f847a586e97f0030c90135a9c&quot;&gt;Comparing animal and plant cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialised+plant+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/9204964046b25ce78b9b95b4dfd1eb0a&quot;&gt;Cell Biology Practice&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialised+plant+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners observe the class bean seedling (growing since Lesson 1) displayed at the front. The teacher draws attention to the three visibly different regions: the fine white root hairs on the roots, the stiff upright stem, and the flat green leaves. Learners are given 3 minutes of individual silent thinking time to write answers to the prompt: &#x27;We have seen that blood cells specialise — platelets are flat and sticky, red blood cells are disc-shaped. Look at the bean seedling. Do you think plant cells also specialise? If yes, predict: what might a cell near the root tip look like compared to a cell in the green leaf? Sketch one of each and label what you think it does.&#x27; Learners share predictions with a shoulder partner for 2 minutes. Teacher cold-calls 4 learners — aiming for at least one who says &#x27;yes, they specialise&#x27; and one who is uncertain — to voice predictions aloud before any instruction begins. All predictions are recorded visibly on the board in two columns: &#x27;Root cell ideas&#x27; and &#x27;Leaf cell ideas&#x27; for later revisitation.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Display the bean seedling prominently. Say: &#x27;Before I show you anything, I want your brain&#x27;s best guess. Look carefully at this seedling — the root hairs, the stem, the leaf. You have 3 minutes of silence to sketch and write.&#x27; Set a visible timer. After 3 minutes say: &#x27;Turn to your partner — share your sketches. 1 minute.&#x27; After partner talk, cold-call exactly 4 learners using name cards. Ask each: &#x27;What did you predict the root cell looks like, and why?&#x27; Wait 12 seconds after each question before accepting an answer. Record all predictions on the board verbatim — do NOT correct errors yet. Close by saying: &#x27;Hold onto these predictions — we will come back and see who was closest to what biologists actually found.&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Prediction Anchoring — by committing predictions to paper and the board before instruction, learners activate prior knowledge about animal cell specialisation (Lessons 7–8) and create a cognitive &#x27;hook&#x27;. Revisiting predictions later produces the productive surprise that deepens encoding.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicator: Every learner has a written sketch and at least one written label in their notebook within the 3-minute window. Teacher circulates and notes (without correcting) whether learners are drawing elongated vs. round shapes, whether they reference chloroplasts or surface area — these reveal the depth of transfer from animal cell lessons.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Observe Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/c1adffcd23b5561ca8687b2d0a7fff8e&quot;&gt;Overview of animal and plant cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialised+plant+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 HTML:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/64eedd0564b25ce08f407812919dbd53&quot;&gt;Plant Cell Structures (Flexbook)&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialised+plant+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;The teacher projects or draws (in sequence) five specialised plant cells, spending approximately 6 minutes per cell. For each cell, learners first observe silently, then record a labelled scientific drawing in their notebooks. The five cells and their key observable features are: (1) Root hair cell — long tubular extension (root hair), large vacuole, thin cell wall, no chloroplasts; (2) Guard cells — kidney-shaped pair, thick inner wall, chloroplasts present, central pore (stoma); (3) Xylem vessel — hollow lumen, thick lignified wall, no end walls, no living cytoplasm; (4) Phloem sieve tube — thin walls, perforated sieve plates at ends, companion cell alongside; (5) Palisade mesophyll cell — tall cylindrical shape, densely packed chloroplasts, large central vacuole. For guard cells specifically, the teacher presents a side-by-side context image: a stomatal image from a maize leaf collected in dry Turkana (stomata mostly closed) vs. a tea leaf from humid Kericho (stomata mostly open) — asking: &#x27;What do you notice about how open the stomata are in each location? What might the guard cells be doing differently?&#x27; Learners record observations in a structured table: Cell Name | Key Structural Features I Can See | What I Think This Helps the Cell Do.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;For each cell, say: &#x27;Study this diagram in silence for 30 seconds before you draw anything — notice the shape, the thickness of the walls, what is inside.&#x27; Set 30-second silent observation before each drawing begins. Circulate and prompt with: &#x27;What is the most unusual feature of this cell compared to a basic plant cell?&#x27; After the Turkana/Kericho guard cell comparison, ask the whole class: &#x27;Show me on your fingers — 1 for Turkana, 2 for Kericho — in which location are the guard cells more open?&#x27; Wait 10 seconds. After the whole observation sequence, cold-call 3 learners and ask: &#x27;Which of these five cells surprised you the most, and what specifically surprised you?&#x27; Wait 12 seconds per response. Explicitly connect xylem back to the phenomenon: &#x27;Remember the fibroblast — it had lots of rough ER to make collagen. The xylem vessel gave up its entire living contents to become a hollow pipe. Both cells sacrificed something to do a job. What does that tell us about specialisation?&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Structured Observation Table — the three-column table (features seen → function hypothesised) forces learners to move from pure observation to inference on every single cell, preventing passive copying of diagrams. The Turkana/Kericho comparison embeds climate context and makes the guard cell&#x27;s function tangible and locally meaningful.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicator: Learners&#x27; observation tables show at least two structural features per cell and at least one function hypothesis per cell that uses structural evidence (e.g., &#x27;the hollow xylem lumen means water can flow through easily&#x27;). Teacher specifically checks that xylem is not described as &#x27;alive&#x27; — a common misconception to address in Phase 3.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Explain Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/8c2e36a9f2a95dfa8dbadc27529da85d&quot;&gt;Plant cell walls&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialised+plant+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/34d28635c2d45902bee3acf7a60fb2f7&quot;&gt;Plant Cell Structures Practice&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialised+plant+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners participate in a structured &#x27;Match-the-Card&#x27; group activity in groups of four. Each group receives a set of 15 cards pre-printed or hand-cut by the teacher, comprising: 5 Cell Diagram Cards (unlabelled diagrams of the five cells), 5 Function Cards (e.g., &#x27;Absorbs water and mineral salts from the soil around the bean seedling&#x27;s roots&#x27;), and 5 Context/Location Cards (e.g., &#x27;Found in the outer layer of roots, just behind the root tip&#x27; or &#x27;Found in leaves — more open in humid Kericho, more closed in dry Turkana&#x27;). Groups match all 15 cards into 5 complete sets of 3. Once matched, each group selects one cell and prepares a 90-second verbal explanation — using the Claim-Evidence-Reasoning (CER) frame — of why that cell&#x27;s shape suits its function. One spokesperson presents; the rest of the class uses a peer-feedback protocol to agree or challenge. The teacher then delivers a 10-minute consolidation mini-lecture clarifying: (a) why xylem cells die to become functional, (b) the role of lignin in xylem walls, (c) how the perforated sieve plates of phloem allow sugar to flow between cells, and (d) the link between palisade cell chloroplast density and photosynthesis rate. Throughout, teacher explicitly links each plant cell back to the driving question and the wound-healing phenomenon.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Distribute card sets and say: &#x27;You have 8 minutes to match all 15 cards into 5 sets of 3. No card is used twice. Every group member must be able to explain every match — not just the one you personally made.&#x27; After 8 minutes, say: &#x27;Freeze. Each group, hold up your set for the root hair cell.&#x27; Scan groups for errors. Cold-call one group that has an error: &#x27;Walk me through your reasoning for that match.&#x27; Wait 12 seconds. During CER presentations, require the class to use a simple hand signal: thumbs up = agree with the reasoning, flat hand = need more evidence. After all presentations, begin consolidation and ask rhetorically: &#x27;The xylem vessel is dead — no nucleus, no cytoplasm. Is it still a cell? Does it still count as specialised?&#x27; Wait 15 seconds. Take 3 responses. Close Phase 3 by returning to the board predictions from Phase 1 and asking: &#x27;Who was closest? What did we get right, and what surprised us?&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Claim-Evidence-Reasoning (CER) Frame — by requiring learners to state a claim (&#x27;This is a guard cell&#x27;), cite structural evidence (&#x27;because it is kidney-shaped and has a thick inner wall&#x27;), and give reasoning (&#x27;which means it can change shape to open or close the stoma&#x27;), the CER frame makes the form-function logic explicit and transferable. The card game provides concrete manipulation before the abstract verbal explanation.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicator: Each group&#x27;s card matches are checked against the answer key. Teacher specifically listens for whether CER presentations include explicit structural evidence (not just function labels). Misconception probe: after consolidation, teacher asks every learner to write one sentence in their notebook answering: &#x27;Is the xylem vessel alive? Use evidence from today.&#x27; This written response is collected as an exit-check for the xylem-is-dead misconception.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Driving Question Board (DQB) Creation&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/8640601f847a586e97f0030c90135a9c&quot;&gt;Comparing animal and plant cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialised+plant+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/e0858da4f54c5dad90208f98b5be7edc&quot;&gt;Cell structures and their functions&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialised+plant+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Each learner is given two sticky notes (or small paper slips). On the first, they write one new question that today&#x27;s lesson raised for them — something they now want to understand that they did not wonder about before (e.g., &#x27;If guard cells control water loss, what happens to a maize plant in Turkana during drought — do the guard cells ever fully close forever?&#x27;). On the second, they write one connection: how does today&#x27;s lesson change or add to their understanding of the wound-healing phenomenon (e.g., &#x27;Just like fibroblasts rebuilt skin, the phloem transports sugars that give fibroblasts the energy to do their job — so plant cells and animal cells are connected in keeping us alive&#x27;). Learners place both slips on the class Driving Question Board in designated zones: &#x27;New Questions&#x27; and &#x27;Growing Answers&#x27;. The teacher reads 3–4 slips aloud and facilitates a 4-minute whole-class discussion on which questions the class most wants to answer in the remaining lessons.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Say: &#x27;Two slips. Two minutes. First slip: a question this lesson made you want to ask. Second slip: one way today&#x27;s plant cells connect back to the cut finger.&#x27; After 2 minutes, collect slips and place them on the DQB. Read three questions aloud and ask: &#x27;By a show of hands — which of these three questions do you most want us to answer before the end of this unit?&#x27; Tally hands visibly. Point to the DQB&#x27;s &#x27;Growing Answers&#x27; zone and say: &#x27;Look at the questions we posted in Lesson 1. How many can we now answer? Let&#x27;s count.&#x27; Guide learners to identify 2–3 questions from earlier lessons that today&#x27;s content resolves. Close by saying: &#x27;Our driving question asks why cells look different and how shape determines job. Today we added five more examples. The pattern is becoming clear — let&#x27;s see if it holds all the way to Lesson 12.&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Driving Question Board Metacognitive Review — periodically counting how many earlier questions the class can now answer makes learning progress visible and builds scientific confidence. Requiring a cross-domain connection (plant cell → wound healing) strengthens the coherence of the unit storyline and prevents plant biology from feeling like a disconnected topic.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicator: The &#x27;connection&#x27; slip demonstrates whether learners are making genuine cross-domain links or are writing superficial responses. Teacher sorts connection slips into &#x27;strong link&#x27; (uses specific cell names and mechanisms) and &#x27;developing link&#x27; (general statements) to inform differentiation in Lesson 10.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Model Building Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/c1adffcd23b5561ca8687b2d0a7fff8e&quot;&gt;Overview of animal and plant cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialised+plant+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 HTML:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/bbda32d5f73e53ccb586cee112a3f156&quot;&gt;Plant Cells (Flexbook)&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialised+plant+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners retrieve their cumulative &#x27;Cell Specialisation Model&#x27; — a poster or notebook page extended in Lesson 8 — which currently shows specialised animal cells arranged around the wound-healing phenomenon. Today they add a &#x27;Plant Side&#x27; to the model. Using the diagrams from Phase 2, learners draw and label all five specialised plant cells on the plant side, then draw arrows indicating: (a) which cells work together in the root (root hair cells absorb → xylem transports), (b) which cells work together in the leaf (palisade cells photosynthesise → phloem exports sugars → guard cells regulate water loss). Learners then add one &#x27;bridge arrow&#x27; connecting their plant model to the animal wound-healing model — labelling what the plant provides that the animal needs (e.g., &#x27;Palisade cells make glucose via photosynthesis → glucose powers fibroblasts to make collagen&#x27;). Lesson closes with learners sharing their bridge arrow with a partner and the teacher cold-calling 2 learners to explain their bridge to the class.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Distribute or ask learners to open their cumulative models. Say: &#x27;You have 12 minutes to add the plant side. Every cell must have: a labelled diagram, its key structural feature, and its function. Then draw one bridge arrow to the animal side — what does the plant give the animal?&#x27; Circulate and prompt struggling learners: &#x27;Think about what fibroblasts need to do their job — where does that energy come from, all the way back?&#x27; After 12 minutes, cold-call 2 learners: &#x27;Show us your bridge arrow and explain it in two sentences.&#x27; Wait 12 seconds after each explanation. Close the lesson by saying: &#x27;In Lesson 1 we asked: why does the cut finger heal? Today we discovered that the answer involves not just animal cells but plant cells too — every meal of githeri or sukuma wiki that feeds our body&#x27;s repair workers is made possible by specialised plant cells doing their jobs perfectly. That is the power of cell specialisation.&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Cumulative Model Revision — adding a &#x27;Plant Side&#x27; and a &#x27;bridge arrow&#x27; to the existing animal-cell model makes the unit&#x27;s central argument visible and spatial: specialisation is a universal biological strategy. The bridge arrow forces systems thinking, connecting plant physiology to animal physiology through the flow of energy and matter.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicator: The model shows all five plant cells with labelled structural features (not just names), directional arrows showing functional relationships between cells, and at least one bridge arrow that names a specific substance (glucose, water, mineral salts) flowing from plant to animal context. Teacher photographs 4–5 models at the end of class to assess depth of systems thinking before Lesson 10.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;D. TEACHER REFLECTION&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;After the lesson, reflect on the following questions in your professional journal: (1) During the Match-the-Card activity, which cell caused the most incorrect matches — and what does this tell you about which structural features learners find hardest to interpret visually? Plan a 5-minute re-teach opener for Lesson 10 if more than one-third of groups mismatched the xylem or phloem cards. (2) Were learners able to draw genuine &#x27;bridge arrows&#x27; connecting plant cells to the wound-healing phenomenon, or did most bridges remain abstract? If bridges were weak, consider beginning Lesson 10 with a think-aloud model where you narrate your own bridge arrow construction. (3) Review the DQB &#x27;Growing Answers&#x27; slips: are learners making mechanistic connections (naming substances and processes) or surface connections (e.g., &#x27;plants and animals are both living things&#x27;)? Use this data to set the depth expectation for Lesson 10&#x27;s writing task. (4) The Turkana/Kericho guard cell comparison is a key Kenya-context moment — note whether learners engaged with this geographical contrast or treated it as decoration. If engagement was low, plan to bring a physical leaf sample from the school compound and hold it under the projector in the next lesson.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;E. SUMMARY TABLE PROMPT  (pre-filled example for this lesson)&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;What did I observe?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners observed detailed diagrams (and where available, microscope slides or projected images) of five specialised plant cells — root hair cell, guard cell, xylem vessel, phloem sieve tube, and palisade mesophyll cell — recording labelled scientific drawings and completing a three-column observation table of structural features, alongside a contextual comparison of stomatal aperture in dry Turkana vs. humid Kericho.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;What did I learn?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners learned that plant cells specialise just as animal cells do; that each of the five cells has a specific structural adaptation (e.g., the long extension of root hair cells for absorption, the hollow lignified lumen of xylem for water transport, the dense chloroplasts of palisade cells for photosynthesis) that directly enables its function; and that specialised plant cells work in coordinated systems — absorption → transport → photosynthesis → regulation — mirroring the coordinated cell systems seen in wound healing.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;How does this explain the phenomenon?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners explained, using the Claim-Evidence-Reasoning frame, why each plant cell&#x27;s shape suits its function; constructed a &#x27;Plant Side&#x27; addition to their cumulative specialisation model with directional arrows showing how root hair cells, xylem, phloem, palisade, and guard cells work together; and drew a &#x27;bridge arrow&#x27; articulating how plant cell specialisation (particularly photosynthesis in palisade cells) provides the glucose energy that ultimately powers animal cell processes such as fibroblast collagen synthesis during wound healing.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;p&gt;© 2026 SeaVuria and ARES Education. Aligned with KICD objectives. Developed by SeaVuria; technical implementation by ARES (with AI assistance from Claude). Licensed under &lt;a href=&quot;https://creativecommons.org/licenses/by-nc/4.0/&quot;&gt;CC BY-NC 4.0&lt;/a&gt; (&lt;a href=&quot;https://creativecommons.org/licenses/by-nc/4.0/&quot;&gt;https://creativecommons.org/licenses/by-nc/4.0/&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
&lt;/details&gt;

&lt;details class=&quot;lp-section&quot; id=&quot;lesson-10&quot; data-document-section&gt;
  &lt;summary&gt;Lesson 10 · Cell Organisation: Cells → Tissues → Organs → Organ Systems → Organism&lt;/summary&gt;
  &lt;div class=&quot;lp-document doc-preview&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;LESSON 10 (80 minutes): Cell Organisation: Cells → Tissues → Organs → Organ Systems → Organism&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;A. SPECIFIC LEARNING OUTCOMES&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Category&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Specific Learning Outcomes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Purpose&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;To enable learners to trace the hierarchical organisation of cells into tissues, organs, organ systems, and the whole organism using the wound-healing phenomenon as a unifying context.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Knowledge&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners will know that: (1) cells of the same type group together to form tissues; (2) different tissues combine to form organs; (3) organs working together form organ systems; (4) organ systems together constitute the organism — and that this hierarchy is illustrated by the skin&#x27;s response to a cut finger.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Skills&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners will be able to: (1) construct a labelled hierarchy diagram (cell → tissue → organ → organ system → organism) using wound-healing examples; (2) draw an analogy between biological organisation and a Kenyan school structure; (3) update their cumulative cell model (Version 4) to incorporate the organisational hierarchy.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Attitudes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners appreciate that no single cell type heals a wound alone — interdependence across every level of organisation is what makes complex life functions possible, reflecting the value of collaboration and community.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Key Inquiry Question&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;How does cell specialisation enable organisms to carry out complex life functions?&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Purpose in Storyline&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;In Lessons 1–9 learners identified cell structures, distinguished plant from animal cells, explored specialised cells (platelets, neutrophils, fibroblasts, epidermal cells), and mapped how each cell&#x27;s shape suits its wound-healing role. Lesson 10 zooms out: learners now ask HOW these individual specialised cells are organised into larger functional units. This is the conceptual bridge that will carry them into Anatomy and Physiology of Plants (Strand 2) and Animals (Strand 3) — where tissues and organs are the primary units of study. Version 4 of the cumulative model situates every previously drawn cell inside the organisational hierarchy.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Safety Notes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;No hazardous materials are used in this lesson. If learners use scissors to cut diagram cards, remind them to cut away from the body and to place scissors flat on the desk when not in use. Supervision required during any cutting activity.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;B. LESSON OVERVIEW&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;Learners begin by predicting how many different cell types are needed to heal the cut finger and whether those cells work in isolation or as part of a larger structure. They then observe a structured reading-and-image evidence set showing the four wound-healing cell types nested inside epithelial tissue → skin → integumentary system → human body. The Kenyan school analogy (student → class → school → county education → Kenyan society) is introduced as a sensemaking scaffold. Learners construct a dual-track hierarchy diagram, update their cumulative model to Version 4, and close by revisiting the Driving Question Board to formally post what the hierarchy explains — and what new questions it raises about how organs and systems work.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;5&quot;&gt;&lt;p&gt;&lt;strong&gt;C. LESSON IMPLEMENTATION FRAMEWORK&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Phase&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Learner Experience&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Teacher Moves&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Sensemaking Strategy&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Formative Assessment Strategy&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Predict Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/bef127e6f18d50caa23fb4c7d2638fa6&quot;&gt;Organization in the human body&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+organisation+tissue+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/49c935ea4d5e53d7bae4719006f68d98&quot;&gt;Understand: cells and organisms&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+organisation+tissue+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners individually examine a projected image showing four labelled cells from the wound-healing phenomenon (platelet, neutrophil, fibroblast, epidermal cell — drawings from their own Version 3 models). The teacher poses a written prompt displayed on the board: &#x27;If all four of these cells are working at the same time inside the cut finger, are they acting alone — or are they part of something bigger? Draw or write your prediction: what structure above the single cell do you think exists?&#x27; Learners write/sketch silently in their ARES notebooks for 4 minutes. They then share their prediction with their elbow partner (Think-Pair) for 90 seconds.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Display the four wound-healing cell images alongside the prompt. Say: &#x27;Look carefully at these four cells. We have studied each one. Today I want you to think BIGGER. Before I teach you anything new — draw or write what you predict exists ABOVE the level of a single cell. You have 4 minutes of silent thinking time. Go.&#x27; [WAIT — enforce 4 minutes of silence; circulate and observe notebooks without commenting.] After 4 minutes: &#x27;Turn to your elbow partner. Share your prediction. You have 90 seconds.&#x27; [WAIT 90 seconds.] Cold-call 3 pairs — choose one pair who drew a tissue-like cluster, one who drew the whole body, and one who was unsure. Ask each: &#x27;What was your reasoning?&#x27; Record key prediction words on the board in a &#x27;PREDICT&#x27; column (do not confirm or deny): &#x27;tissue&#x27;, &#x27;group&#x27;, &#x27;system&#x27;, &#x27;organ&#x27;, &#x27;body&#x27;. Say: &#x27;Hold these predictions. We are going to test them against evidence right now.&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Think-Pair-Predict: learners activate prior knowledge of cells and generate a testable prediction before instruction. Recording predictions on the board creates a public commitment that will be revisited during the Explain phase, increasing cognitive engagement and accountability.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicator: learners&#x27; notebooks contain a written or sketched prediction that references at least one structural level above the cell (e.g., &#x27;group of cells&#x27;, &#x27;layer of skin&#x27;, &#x27;body system&#x27;). Teacher scans 6–8 notebooks during the silent writing period. Flag any learner whose prediction contains no structural reference — pair that learner with a stronger peer during Phase 2 reading.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Observe Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/bef127e6f18d50caa23fb4c7d2638fa6&quot;&gt;Organization in the human body&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+organisation+tissue+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 HTML:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/02a8967443de58d1ac80a375aac1a019&quot;&gt;Respiratory System Organs (Flexbook)&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+organisation+tissue+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners receive the ARES Evidence Card Set 10 — a two-sided printed or on-screen resource. Side A contains four annotated microscope images: (1) a single epidermal cell, (2) a cross-section of stratified squamous epithelial tissue (many epidermal cells), (3) a cross-section of skin as an organ (epidermis + dermis + hypodermis layers labelled), (4) a diagram of the integumentary system (skin + hair + nails + sweat glands) within the human body outline. Side B contains a parallel Kenyan school analogy diagram: (1) one Form 2 student at Mwangaza Secondary School, Nairobi, (2) Form 2 Class of 42 students, (3) Mwangaza Secondary School (all classes, all teachers, all departments), (4) Nairobi County Education System (all schools), (5) Kenyan Society (all counties). Learners work in groups of 4 to complete an ARES Observation Table with four columns: Level of Organisation | Biological Example (from wound healing) | School Analogy | Function at This Level. Groups have 15 minutes.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Distribute Evidence Card Set 10. Say: &#x27;On Side A you have real microscope images from biology. On Side B you have a school analogy I want you to think about. Your job in your group is to fill in the Observation Table — four columns. Biological example, school analogy, and the FUNCTION at each level. You have 15 minutes. Use evidence from the cards — not guesses.&#x27; [WAIT — circulate actively. At 5 minutes, check whether groups are correctly linking epidermal cell → epithelial tissue → skin → integumentary system. If a group is stuck, ask: &#x27;Look at image 2 on Side A — what has changed compared to image 1? What is made up of many of the same cell?&#x27; Do NOT give the answer.] At 10 minutes, say: &#x27;Two groups — please be ready to share your Function column. What does the TISSUE do that the single cell cannot do alone?&#x27; [WAIT 30 seconds for groups to confirm their answer.] After 15 minutes, cold-call 2 groups to read their completed rows aloud. Correct any factual errors immediately using the board.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Parallel Analogy Mapping: the Kenyan school analogy provides a concrete, culturally familiar scaffold that mirrors the abstract biological hierarchy. By completing both columns simultaneously, learners construct the structural logic of organisation (many similar units → one functional whole) before applying it to biology, reducing cognitive load.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicator: the completed Observation Table correctly identifies all four biological levels with matching school analogy and a stated function for each level. Mastery threshold: at least 3 of 4 levels correctly completed with a function. Teacher collects one table per group at the end of Phase 2 for rapid review before Phase 3.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Explain Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/6320a7fe68a254f08a74fb454d9a8a27&quot;&gt;Cells and organisms&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+organisation+tissue+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 HTML:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/b529605ad1d85da38a40b0e266c08413&quot;&gt;Digestive System Organs (Flexbook)&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+organisation+tissue+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;The teacher leads a whole-class sensemaking discussion anchored to the wound-healing phenomenon. Using the board (or ARES projected slide), the teacher builds a formal five-level hierarchy diagram: Cell → Tissue → Organ → Organ System → Organism, placing the four wound-healing cells (platelet, neutrophil, fibroblast, epidermal cell) at the Cell level, and showing the pathway upward. Learners then complete an individual written explanation in their notebooks responding to the prompt: &#x27;Using the healing cut as your example, explain in 5 sentences why a single epidermal cell cannot heal a wound on its own — and what levels of organisation must work together to restore the finger.&#x27; Learners have 8 minutes to write.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Begin by returning to the board&#x27;s PREDICT column. Say: &#x27;Let&#x27;s check your predictions. Who predicted the word tissue or a group of the same cells — raise your hand.&#x27; [Pause, acknowledge.] &#x27;Who predicted organ or system?&#x27; [Acknowledge.] &#x27;Your predictions were strong. Here is what the evidence confirms.&#x27; Draw the five-level hierarchy on the board step by step, pausing after each level. Say: &#x27;Epithelial tissue — what do the school analogy and the microscope image have in common? WAIT 10 seconds.&#x27; [Cold-call 1 learner.] Add each biological example next to the level as learners contribute. Once the diagram is complete, say: &#x27;Now I want this in YOUR words, in YOUR notebook. Write 5 sentences. Use the healing cut. Explain why one cell is not enough — and what each level adds. 8 minutes, silent, individual writing. Go.&#x27; [WAIT — enforce silence. Circulate and read over shoulders. If a learner writes fewer than 3 sentences after 4 minutes, prompt quietly: &#x27;What does the tissue do that one cell cannot? Write that.&#x27;]. After 8 minutes cold-call 2 learners with strong responses to read aloud. Ask the class: &#x27;Does this explanation match our evidence? Thumbs up / thumbs down / thumbs sideways.&#x27; Address any thumbs-down.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Claim-Evidence-Reasoning (CER) Writing: by requiring learners to make a claim (cell cannot heal alone), cite evidence (levels of organisation), and provide reasoning (function at each level), the teacher embeds NGSS Science and Engineering Practice 6 (Constructing Explanations). The public hierarchy diagram on the board acts as a shared anchor, preventing learners from constructing explanations in isolation.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicator: the 5-sentence written explanation names at least 3 levels of organisation, references the wound-healing phenomenon explicitly, and includes a stated function for at least one level. Teacher reads 4–6 notebooks during circulation. Any learner who conflates organ with organ system receives a targeted prompt card (&#x27;An ORGAN is one structure like the skin. An ORGAN SYSTEM is a group of organs working together — like the integumentary system. Can you revise sentence 3?&#x27;).&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Driving Question Board (DQB) Creation&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/faad4b9ffb555ae3ba8869827608a08b&quot;&gt;Zygote differentiating into somatic and germ cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+organisation+tissue+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/49c935ea4d5e53d7bae4719006f68d98&quot;&gt;Understand: cells and organisms&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+organisation+tissue+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Each learner receives two sticky notes (or ARES DQB digital cards). On the YELLOW note they write: one thing today&#x27;s evidence ANSWERS about the driving question (&#x27;Why do cells look different and how does shape determine job?&#x27;). On the BLUE note they write: one NEW question today&#x27;s lesson has raised — something they now wonder about that they did not wonder about before. Learners post both notes on the class DQB under the columns &#x27;NOW WE KNOW&#x27; and &#x27;NEW QUESTIONS&#x27;. The teacher reads 5–6 notes aloud and briefly clusters them by theme: structural organisation, function, and questions about how organ systems communicate.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Hand out sticky notes. Say: &#x27;The Driving Question asks why cells look different and how shape determines job. Today we zoomed out. On your YELLOW note — write one thing we can now ANSWER about that driving question because of what we learned today. On your BLUE note — write one NEW question this lesson has opened up for you. You have 3 minutes.&#x27; [WAIT 3 minutes — enforce quiet writing.] Direct learners to post notes on the DQB. Read 5–6 notes aloud, grouping similar ones. Say: &#x27;I notice several of you are now asking HOW organ systems communicate with each other — does the integumentary system send signals to the immune system? That is a brilliant question. We will return to that question in Strand 3 when we study animal physiology.&#x27; Point to the DQB and say: &#x27;This board is growing. Look at how far our understanding has come from Lesson 1. We started with one cut finger. Now we understand the organisational machinery behind it.&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Driving Question Board Curation: posting both &#x27;answers&#x27; and &#x27;new questions&#x27; makes learners&#x27; conceptual growth visible and models how scientific understanding always generates further inquiry. Clustering questions by theme helps learners see patterns in their collective thinking and primes them for future learning in Strands 2 and 3.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicator: YELLOW notes contain a specific reference to a level of organisation (e.g., &#x27;Now I know that tissues form because similar cells group together to do one job&#x27;) rather than a vague statement (&#x27;I learned about cells&#x27;). BLUE notes contain a question that is generative and forward-looking. Teacher flags any learner whose yellow note is vague for a 1-minute check-in before the next phase.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Model Building Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/a9df960356615f269dd9b04cc1538fdf&quot;&gt;Introduction to Middle school biology&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+organisation+tissue+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 HTML:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/02a8967443de58d1ac80a375aac1a019&quot;&gt;Respiratory System Organs (Flexbook)&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+organisation+tissue+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners retrieve their cumulative cell model from previous lessons (Versions 1–3, which showed individual specialised cells and their structures). Working individually, they create Model Version 4 by constructing a hierarchy diagram that NESTS their previously drawn cells inside the organisational levels. The diagram must show: (a) at least 2 of the 4 wound-healing cell types at the Cell level; (b) the relevant tissue each belongs to; (c) the organ those tissues form; (d) the organ system; (e) the whole organism (the Form 1 student in Nairobi). Learners annotate each level with its function in wound healing. They also write a &#x27;Model Revision Note&#x27; at the bottom: &#x27;What does Version 4 show that Version 3 did not?&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Say: &#x27;Take out your cumulative model — Versions 1 through 3. Look at the cells you drew. Today we are going to zoom ALL the way out. Version 4 is a HIERARCHY diagram. It does not replace your earlier work — it organises it. I want to see your cells from Version 3 sitting inside their tissue, inside their organ, inside their system, inside the whole organism.&#x27; Display a blank template on the board (five labelled tiers, blank boxes at each level). Say: &#x27;You have 12 minutes. Every level must be labelled AND must include the function in wound healing — not just the name. At the bottom, write your Model Revision Note: what does Version 4 show that Version 3 could not show?&#x27; [WAIT — circulate and provide targeted feedback.] At 6 minutes, say: &#x27;Check — can I see two cell types at the Cell level? Can I see a tissue label? If not, prioritise those now.&#x27; At 12 minutes: cold-call 2 learners to hold up and narrate their Version 4 model. Prompt the class: &#x27;What did they include that you might want to add or revise?&#x27; Allow 2 minutes of silent revision. Collect models or photograph them for ARES digital portfolio.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Cumulative Model Revision: requiring learners to nest previous drawings inside the new hierarchy makes learning incremental and visible. The &#x27;Model Revision Note&#x27; prompts metacognitive reflection — learners articulate what the new model explains that the old one could not, directly practising NGSS SEP 2 (Developing and Using Models) and SEP 6 (Constructing Explanations).&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicator: Version 4 diagram contains all five organisational levels correctly ordered, at least 2 named wound-healing cell types at the Cell level, a stated function at each level, and a Model Revision Note that references organisational hierarchy explicitly. Mastery threshold: 4 of 5 levels correctly labelled with function. Learners who only complete 3 levels are assigned a structured scaffold card for homework (&#x27;Complete the missing two levels: what tissue do neutrophils belong to? What organ system do they help protect?&#x27;).&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;D. TEACHER REFLECTION&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;After the lesson, reflect on the following questions:&lt;/p&gt;&lt;p&gt;1. HIERARCHY UNDERSTANDING — Could learners correctly distinguish between an organ and an organ system without prompting? Were there persistent confusions between &#x27;tissue&#x27; and &#x27;organ&#x27; in the written explanations or models? If yes, plan a 5-minute warm-up retrieval activity at the start of Lesson 11 using labelled diagram sort cards.&lt;/p&gt;&lt;p&gt;2. ANALOGY EFFECTIVENESS — Did the Kenyan school analogy (student → class → school → county → society) help learners grasp the biological hierarchy, or did it create confusion (e.g., learners thinking a &#x27;school&#x27; is the same as an &#x27;organ&#x27; rather than being analogous to one)? Note which groups used the analogy productively and which abandoned it.&lt;/p&gt;&lt;p&gt;3. MODEL QUALITY — Review collected Version 4 models. Were learners able to successfully nest their Version 3 cells inside the new hierarchy, or did they redraw cells from scratch? The nesting task assesses whether cumulative model-building is working as a pedagogical strategy. If more than 30% of learners started from scratch, consider introducing a pre-structured Version 4 template in the next lesson.&lt;/p&gt;&lt;p&gt;4. DQB RICHNESS — Were the Blue (new question) sticky notes generative and forward-looking (pointing toward organ systems, physiology, communication between systems), or were they superficial restatements of today&#x27;s content? Rich questions indicate readiness to move into Strand 2 (Plant Anatomy and Physiology). Thin questions suggest learners need one more consolidation lesson.&lt;/p&gt;&lt;p&gt;5. PHENOMENON CONNECTION — Did learners spontaneously reference the healing cut phenomenon during explanations, or did they explain organisation in the abstract? The phenomenon must remain the anchor. If references were absent, open Lesson 11 by projecting the original phenomenon image and asking: &#x27;Where in the hierar
