chy does today&#x27;s new knowledge sit?&#x27;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;E. SUMMARY TABLE PROMPT  (pre-filled example for this lesson)&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;What did I observe?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Annotated microscope images and diagrams showing one epidermal cell → stratified squamous epithelial tissue → skin organ cross-section → integumentary system → human body; parallel Kenyan school analogy diagram (student → class → Mwangaza Secondary School → Nairobi County Education → Kenyan society).&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;What did I learn?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Cells of the same type group together to form tissues; different tissues combine to form organs; organs working together form organ systems; organ systems together constitute the whole organism. In the wound-healing phenomenon, epidermal cells form epithelial tissue, which is part of the skin organ, which belongs to the integumentary system, which protects the entire organism.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;How does this explain the phenomenon?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;No single specialised cell — not the platelet, the neutrophil, the fibroblast, nor the epidermal cell — can heal the cut finger alone. Healing requires all four cell types to be organised into tissues, organs, and systems that coordinate their functions. The organisational hierarchy is what transforms individual specialised cells into a living, self-repairing organism — answering the driving question by showing that shape determines job at the cell level, but ORGANISATION determines survival at the organism level.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;p&gt;© 2026 SeaVuria and ARES Education. Aligned with KICD objectives. Developed by SeaVuria; technical implementation by ARES (with AI assistance from Claude). Licensed under &lt;a href=&quot;https://creativecommons.org/licenses/by-nc/4.0/&quot;&gt;CC BY-NC 4.0&lt;/a&gt; (&lt;a href=&quot;https://creativecommons.org/licenses/by-nc/4.0/&quot;&gt;https://creativecommons.org/licenses/by-nc/4.0/&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
&lt;/details&gt;

&lt;details class=&quot;lp-section&quot; id=&quot;lesson-11&quot; data-document-section&gt;
  &lt;summary&gt;Lesson 11 · Synthesis and Model Revision: Putting the Cell Story Together&lt;/summary&gt;
  &lt;div class=&quot;lp-document doc-preview&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;LESSON 11 (40 minutes): Synthesis and Model Revision: Putting the Cell Story Together&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;A. SPECIFIC LEARNING OUTCOMES&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Category&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Specific Learning Outcomes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Purpose&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners synthesise all prior learning about cell structure, specialisation, and organisation into a single coherent poster-model that explains the wound-healing phenomenon from cell to organism level.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Knowledge&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners can accurately describe and annotate plant and animal cell organelles; explain structure-function relationships in at least three specialised cells involved in wound healing; and sequence the organisational hierarchy from cell to organism.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Skills&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners construct and revise scientific models; communicate scientific understanding through annotated diagrams; apply structured peer feedback using a glow-and-grow protocol; and compare their current understanding with their Lesson 1 prior knowledge.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Attitudes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners demonstrate intellectual honesty by acknowledging what they did not know in Lesson 1; show collaborative responsibility in group model construction; and appreciate the elegance of how cell structure enables complex life functions.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Key Inquiry Question&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;How does cell specialisation enable organisms to carry out complex life functions? What are the structural differences between plant and animal cells?&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Purpose in Storyline&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;This is the penultimate lesson in the evidence-gathering sequence. Learners have accumulated knowledge across ten lessons and must now integrate that knowledge into a single coherent model. This lesson serves as the synthesis node before final consolidation and assessment in Lesson 12. The driving question is advanced to near-complete resolution: learners can now explain why different cells look different and why shape determines function, using the wound-healing phenomenon as the unifying context.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Safety Notes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;No hazardous materials are used in this lesson. Learners handle poster paper, markers, and scissors where used for card-sorting. Ensure adequate space between groups to allow movement without collision. No specific PPE required.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;B. LESSON OVERVIEW&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;Learners open by revisiting their Lesson 1 sticky-note predictions, held on the Driving Question Board, and compare those naive ideas with their current evidence-based understanding. In groups of four, learners construct a final annotated poster-model integrating: a labelled plant cell, a labelled animal cell, three specialised cells from the wound-healing phenomenon with structure-function annotations, and the full cell-organisation hierarchy. Groups present their posters in a gallery-walk format. Peers provide structured feedback using a one-glow one-grow protocol. The DQB is reviewed as a class and all original wonder questions are addressed, re-answered, or re-categorised as questions for future learning. The lesson closes with a brief individual written comparison showing how each learner&#x27;s thinking has shifted since Lesson 1.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;5&quot;&gt;&lt;p&gt;&lt;strong&gt;C. LESSON IMPLEMENTATION FRAMEWORK&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Phase&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Learner Experience&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Teacher Moves&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Sensemaking Strategy&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Formative Assessment Strategy&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Predict Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/8640601f847a586e97f0030c90135a9c&quot;&gt;Comparing animal and plant cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+organisation+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/26cbebba12c35a488ff3d37d5427b3eb&quot;&gt;Plant vs animal cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+organisation+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners individually retrieve their science notebooks and locate their Lesson 1 entry — their original prediction about what was happening inside the skin when the Nairobi student cut their finger while slicing onions. Each learner silently re-reads their own words for approximately ninety seconds. Teacher then poses a reflection prompt: Before we share, write one sentence finishing this stem — In Lesson 1 I thought... but now I know... — Learners write without talking for two minutes. Selected learners share aloud. This activates metacognitive awareness and positions the synthesis work that follows as meaningful revision rather than repetition.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Teacher retrieves the original DQB poster displayed since Lesson 1 and places it at the front of the room. Teacher reads aloud two or three of the original student sticky-note wonder questions verbatim, using a warm and deliberate tone: Here is what Akinyi wrote in Lesson 1 — she asked, Why does the body know which cell to send? Here is what Otieno wrote — he asked, Do all our cells have the same parts? These were great scientific questions ten lessons ago. Today, let us find out how far our answers have come. Teacher pauses for WAIT TIME of five full seconds after each question is read aloud, allowing emotional and cognitive connection to the original curiosity. Teacher then instructs learners to open notebooks to Lesson 1 and write the sentence stem. After writing, teacher cold-calls three learners — selecting students who had a wide range of prior knowledge in Lesson 1 — and records key contrasting phrases on the chalkboard under two columns: THEN and NOW.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Metacognitive retrieval and comparison. Learners make their own knowledge change visible by juxtaposing Lesson 1 language with Lesson 10 language. The DQB serves as a physical artefact of the class inquiry journey, grounding the synthesis in shared history.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Teacher listens to the THEN versus NOW sentence pairs to diagnose whether learners have accurately internalised key concepts — particularly cell specialisation and organelle function. Misconceptions surfaced here (for example, a learner who still conflates cell wall and cell membrane) are noted for targeted clarification during the Model Building Phase.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Observe Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/bef127e6f18d50caa23fb4c7d2638fa6&quot;&gt;Organization in the human body&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+organisation+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/26cbebba12c35a488ff3d37d5427b3eb&quot;&gt;Plant vs animal cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+organisation+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Teacher projects or draws on the board a large blank outline of the final poster template — showing four clearly labelled zones: Zone A — Plant Cell, Zone B — Animal Cell, Zone C — Three Specialised Wound-Healing Cells, Zone D — Cell Organisation Hierarchy. Learners observe the template and, in their groups of four, spend three minutes doing a silent planning scan: each member silently reads the zone headings and identifies which zones they feel most and least confident about. Each learner records in their notebook: I feel most confident about Zone... because... and I feel least confident about Zone... and I will need to use my notes for... This observable self-assessment primes learners for equitable division of labour in the group. Teacher circulates, reading notebook entries briefly, and uses this information to assign stretch roles — for example, a learner who is weakest on Zone C (specialised cells) is encouraged, rather than avoided, to take primary responsibility for that zone with peer support.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Teacher explains the poster task using precise language: Your group will produce one scientific model — not a decoration, not a copy from the textbook — a model that uses evidence from our own practical work, our diagrams, and our discussions to explain the wound-healing phenomenon. Every label on this poster must connect a structure to a function. Teacher holds up a marker and says: If you can draw a cell without explaining what it does, your poster is incomplete. After explaining the template zones, teacher distributes materials — A2 poster paper, coloured markers, rulers — and sets a visible timer for twenty minutes of construction time. Teacher reminds learners to consult their cumulative cell model versions from previous lessons and their practical drawings from Lessons 6 and 7. Teacher circulates during the observe phase using a questioning stance rather than correcting stance — asking What does that organelle do? rather than That label is wrong.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Structured observation of a model template combined with self-assessment of confidence zones. By naming their own uncertainty before beginning, learners engage more deliberately with the evidence they have collected across the unit. The template scaffolds organisation without limiting scientific thinking.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Teacher reads notebook confidence ratings during circulation and uses them to identify groups where all four members have claimed the same strong zone — signalling possible avoidance of difficult content. These groups are given a direct prompt: I notice no one has claimed Zone C — who in this group is going to take ownership of explaining the platelet and the neutrophil?&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Explain Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/c1adffcd23b5561ca8687b2d0a7fff8e&quot;&gt;Overview of animal and plant cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+organisation+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 HTML:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/64eedd0564b25ce08f407812919dbd53&quot;&gt;Plant Cell Structures (Flexbook)&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+organisation+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Groups spend approximately twenty minutes constructing their posters. Zone A requires a fully labelled plant cell with at least eight organelles and a one-phrase function note beside each label. Zone B requires a fully labelled animal cell with at least six organelles, noting two structures absent from the plant cell and explaining why their absence matters. Zone C requires annotated diagrams of three specialised cells from the wound-healing sequence — learners most commonly select: platelets (small, no nucleus, packed with clotting proteins — able to aggregate rapidly), neutrophils or macrophages (irregular shape, many lysosomes — engulf and digest bacteria), and fibroblasts or epidermal cells (rich in rough endoplasmic reticulum and Golgi apparatus — secrete collagen or divide rapidly to close the wound surface). Each specialised cell must show a direct arrow linking one structural feature to one function. Zone D requires a hierarchy diagram from cell to organism using the skin as the example — epidermal cell, epithelial tissue, skin organ, integumentary system, whole organism — with a one-sentence explanation of what is gained at each level of organisation. After construction, groups conduct a four-minute gallery walk: each group leaves their poster on their desk and the group rotates clockwise to view the next group&#x27;s poster. Viewers use a structured feedback card — one glow (something scientifically accurate and clearly explained) and one grow (one scientific gap or unclear label). Feedback is written on small sticky notes and attached directly to the poster.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;During construction, teacher circulates with a clipboard noting: Are Zone C specialised cells connected to the wound-healing phenomenon or treated as abstract examples? Are structure-function links explicit or implied? Is the hierarchy in Zone D presented as a linear chain or as an explanatory sequence? Teacher intervenes with targeted questions rather than corrections. For example, at one group: You have drawn the red blood cell correctly — it is biconcave and has no nucleus. Now tell me — what does having no nucleus allow the red blood cell to do that a nucleated cell cannot do as efficiently? Teacher allows WAIT TIME of seven seconds before accepting a response, signalling that the question requires genuine thought. At the gallery walk, teacher circulates and validates glow-and-grow feedback that is scientifically grounded: I can see that this feedback note says the axon on the nerve cell should be longer — that is a strong scientific observation, well done. Teacher challenges any purely aesthetic feedback (for example, the drawing is very neat) by redirecting: Can you find one piece of scientific evidence on this poster that either supports or challenges what we learned in Lesson 8?&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Collaborative model construction followed by structured peer review. The gallery walk with written feedback transforms peer assessment from a social exercise into a scientific communication act. The glow-and-grow protocol ensures feedback is balanced and specific. By requiring structure-function arrows in Zone C, the task prevents learners from simply drawing cells without connecting morphology to physiology.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Teacher photographs each poster (or sketches key features on the clipboard) during circulation. The structured feedback sticky notes on each poster become a real-time diagnostic of class-wide gaps. Common gaps — for example, most groups showing Zone D as a simple list rather than an explanatory hierarchy — are flagged for whole-class address in the DQB phase. Teacher also listens for oral explanations during gallery walk and probes with cold-call questions to at least five different learners across groups.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Driving Question Board (DQB) Creation&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/8640601f847a586e97f0030c90135a9c&quot;&gt;Comparing animal and plant cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+organisation+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/34d28635c2d45902bee3acf7a60fb2f7&quot;&gt;Plant Cell Structures Practice&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+organisation+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Groups return to their own posters after the gallery walk and spend two minutes reading the feedback sticky notes left by peers. Each group briefly discusses: Do we agree with this grow note? Can we revise this label before the DQB closure? Groups make any final one-minute revisions. Teacher then leads the whole class back to the original DQB poster. Each original wonder question — written in Lesson 1 — is read aloud by the student who originally wrote it (where possible) or by the teacher. The class votes by show of hands whether each question is now: ANSWERED — we have strong evidence; PARTIALLY ANSWERED — we have some evidence but gaps remain; or BEYOND THIS UNIT — this requires further study in later grades or sub-strands. Each question is physically relabelled on the DQB with a green (ANSWERED), yellow (PARTIALLY ANSWERED), or blue (BEYOND THIS UNIT) sticky note. Typical outcomes: questions about organelle function are marked ANSWERED; questions about how DNA controls which genes are expressed in different cells are marked BEYOND THIS UNIT; questions about why some people heal faster than others may be marked PARTIALLY ANSWERED.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Teacher facilitates the DQB closure with a deliberate ceremonial quality — signalling that this is a significant academic moment. Teacher reads each question slowly and clearly. After each reading, teacher asks: Who wrote this? Can you tell us — do you feel this question has been answered by the work we have done across this unit? Teacher then opens to the class: Does anyone want to add to that? WAIT TIME of five seconds after each student response before allowing another voice. Teacher uses precise language when relabelling: We are not saying BEYOND THIS UNIT because the question is unimportant — we are saying it because great science always generates new questions, and that is a sign of a deep thinker. Teacher ensures that the driving question itself — Why do cells look so different from each other and how does shape determine the job a cell can do? — is explicitly addressed as a class. Teacher cold-calls at least four learners to contribute to a cumulative verbal answer to the driving question, building the response sentence by sentence on the chalkboard: Learner 1 addresses cell shape; Learner 2 adds organelle function; Learner 3 connects to specialisation; Learner 4 links to the wound-healing phenomenon.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;DQB closure as collective knowledge consolidation. By returning to the original wonder questions and categorising them using evidence, learners experience the full arc of a scientific inquiry cycle — from curiosity through investigation to provisional explanation. The tricolour relabelling makes the epistemic status of knowledge visible and honest. The cumulative verbal answer to the driving question models collaborative scientific reasoning.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Teacher listens for the quality of justification learners use when voting on question categories. A learner who votes ANSWERED without being able to state the evidence is prompted: What evidence from our lessons, our practical work, or our posters supports that answer? This distinguishes genuine understanding from social conformity. Teacher records any questions that generate significant disagreement for revisiting in Lesson 12.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Model Building Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/bef127e6f18d50caa23fb4c7d2638fa6&quot;&gt;Organization in the human body&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+organisation+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 HTML:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/02a8967443de58d1ac80a375aac1a019&quot;&gt;Respiratory System Organs (Flexbook)&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+organisation+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;In the final five minutes, learners individually open their science notebooks to a fresh page and write a brief personal synthesis entry using the following prompt, written on the board: My cell model started in Lesson 1 as a simple sketch. Today, Version 4 of my model shows... The most important connection I now understand is between... and... because... This connects back to the wound-healing phenomenon because... Learners write for three minutes without discussion. Two learners are cold-called to share their entries aloud. The lesson closes with teacher affirming the intellectual journey: In Lesson 1 you wondered why cells look different. Today your posters and your words show that you can now explain it — using evidence, using the language of science, and using the story of a cut finger healing in Nairobi. That is what it means to think like a biologist.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Teacher circulates during the three-minute individual writing to read entries over shoulders and identify the two most articulate and the two most incomplete responses. The two articulate responses are selected for cold-call sharing — not to embarrass weaker writers but to model the level of specificity expected in Lesson 12 written reflections and in the upcoming sub-strand assessment. After the two shares, teacher explicitly connects to Lesson 12: Tomorrow we return one final time to the cut finger — but this time you will explain it completely, cell by cell, using everything in your notebook and on your poster. Come ready. Teacher does not collect notebooks today — learners need them to prepare overnight. Teacher reminds groups that posters will remain displayed for Lesson 12 reference. Final teacher move: teacher points to the DQB and says — Every green question up there represents something your class figured out together. That is your collective evidence. Be proud of it.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Individual written synthesis as a personal model-revision act. By requiring learners to articulate a structure-function-phenomenon chain in their own words, the prompt prevents surface-level copying from posters and requires genuine integration. The forward-link to Lesson 12 maintains narrative momentum and prevents the synthesis lesson from feeling like a terminal endpoint rather than a penultimate step.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;The individual notebook entries serve as the primary formative assessment for this lesson. Teacher reads selected entries during cold-call sharing and identifies: Can the learner name a specific structural feature? Can they link it to a specific function? Can they connect it to the wound-healing phenomenon? Entries that remain abstract (for example, cells are important because they do things in the body) are flagged and the learner is given a quiet verbal prompt to add one specific example before Lesson 12.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;D. TEACHER REFLECTION&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;After the lesson, consider: Did all four zones of the poster model receive roughly equal depth of treatment, or did groups spend disproportionate time on plant and animal cell diagrams while producing superficial Zone C entries? Were the glow-and-grow feedback notes scientifically substantive or primarily social? Could learners articulate the structure-function-phenomenon chain verbally as well as in writing? Were any DQB wonder questions still genuinely unresolved — and if so, is that because the unit has a gap or because the question is legitimately beyond Grade 10 scope? Note which learners gave articulate cold-call responses and which gave vague responses — use this to plan Lesson 12 cold-call targeting so that learners with gaps are supported to contribute the wound-healing explanation with scaffolded prompts rather than silence.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;E. SUMMARY TABLE PROMPT  (pre-filled example for this lesson)&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;What did I observe?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;In this lesson I observed that learners could integrate their cumulative cell knowledge into a four-zone poster model, that peer feedback during the gallery walk was most precise when learners referenced specific organelles and functions rather than general impressions, and that the DQB closure generated genuine discussion about which questions were fully answered versus partially answered.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;What did I learn?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners consolidated that plant cells and animal cells share core organelles but differ in the presence of a cell wall, large central vacuole, and chloroplasts; that specialised cells in the wound-healing response have structural features directly suited to their functions; and that the organisational hierarchy from cell to organism explains how individual cell functions combine to produce complex responses such as healing.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;How does this explain the phenomenon?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners explained the driving question — why cells look so different and how shape determines function — by constructing an integrated model that connected organelle structure to cell function to tissue and organ roles to whole-organism response, using the Nairobi wound-healing phenomenon as the unifying explanatory context.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;p&gt;© 2026 SeaVuria and ARES Education. Aligned with KICD objectives. Developed by SeaVuria; technical implementation by ARES (with AI assistance from Claude). Licensed under &lt;a href=&quot;https://creativecommons.org/licenses/by-nc/4.0/&quot;&gt;CC BY-NC 4.0&lt;/a&gt; (&lt;a href=&quot;https://creativecommons.org/licenses/by-nc/4.0/&quot;&gt;https://creativecommons.org/licenses/by-nc/4.0/&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
&lt;/details&gt;

&lt;details class=&quot;lp-section&quot; id=&quot;lesson-12&quot; data-document-section&gt;
  &lt;summary&gt;Lesson 12 · Consolidation, DQB Closure, and Final Explanation — The Healing Cut Fully Explained&lt;/summary&gt;
  &lt;div class=&quot;lp-document doc-preview&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;LESSON 12 (80 minutes): Consolidation, DQB Closure, and Final Explanation — The Healing Cut Fully Explained&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;A. SPECIFIC LEARNING OUTCOMES&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Category&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Specific Learning Outcomes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Purpose&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;To consolidate all learning across the sub-strand by constructing a complete, evidence-based explanation of the anchoring phenomenon — wound healing — using knowledge of cell structure and specialisation, and to close the Driving Question Board.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Knowledge&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;The learner demonstrates understanding of: (a) structural differences between plant and animal cells; (b) how cell specialisation — including platelets, neutrophils, macrophages, fibroblasts, and epidermal cells — enables coordinated wound healing; (c) the relationship between cell shape, organelle composition, and cell function across all specialised cell types studied in this unit.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Skills&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;The learner is able to: (a) construct a full, sequenced explanation of a complex biological phenomenon using accurate cell biology vocabulary; (b) compare their Lesson 1 mental model with their final revised model, identifying specific conceptual changes; (c) classify Driving Question Board questions as ANSWERED, PARTIALLY ANSWERED, or BEYOND THIS UNIT; (d) write a reflective exit statement articulating personal conceptual growth.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Attitudes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;The learner: (a) appreciates that scientific understanding is built incrementally through evidence, revision, and peer collaboration; (b) demonstrates intellectual honesty in acknowledging what remains unknown or beyond the current unit; (c) values the contributions of every member of the class in building a shared explanation.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Key Inquiry Question&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Using everything we have learned about cell structure and specialisation — how can we now fully explain, cell by cell, what happens when a student in Nairobi cuts their finger while slicing onions?&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Purpose in Storyline&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;This is the culminating lesson of the sub-strand storyline. Students return to the anchoring phenomenon — The Healing Cut — for the last time, but now armed with 11 lessons of evidence about cell structure, organelle function, and specialisation. The goal is a complete, co-constructed class explanation of wound healing, a side-by-side comparison of Lesson 1 and Lesson 12 models, formal closure of the Driving Question Board, and a sub-strand assessment. The driving question — &#x27;Why do cells look so different, and how does shape determine job?&#x27; — is answered fully and publicly.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Safety Notes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;No hazardous materials are used in this lesson. If printed sub-strand assessment papers are distributed, ensure scissors or sharp objects are not present on desks. Remind learners that personal reflections are private and will not be read aloud without consent.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;B. LESSON OVERVIEW&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;Lesson 12 is the final lesson of Sub-Strand 1.1: Cell Structure. The teacher opens by returning the class to the anchoring phenomenon — the Form 1 student in Nairobi who cut their finger slicing onions. Through a structured cold-call round (minimum 8 students), the class co-constructs a complete, sequenced, cell-by-cell explanation of wound healing, drawing on all evidence gathered across Lessons 1–11. Learners then place their Lesson 1 cell diagrams alongside their Lesson 11 revised models and articulate, in writing, the specific conceptual changes they made and why. The Driving Question Board is formally closed: each question card is classified aloud by the class as ANSWERED, PARTIALLY ANSWERED, or BEYOND THIS UNIT. Learners complete an individual written exit reflection (&quot;One thing I now understand that I did not understand in Lesson 1 is… because…&quot;) before sitting the sub-strand summative assessment. The lesson is designed to produce a sense of intellectual closure and genuine pride in the distance learners have travelled since Lesson 1.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;5&quot;&gt;&lt;p&gt;&lt;strong&gt;C. LESSON IMPLEMENTATION FRAMEWORK&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Phase&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Learner Experience&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Teacher Moves&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Sensemaking Strategy&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Formative Assessment Strategy&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Predict Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/8640601f847a586e97f0030c90135a9c&quot;&gt;Comparing animal and plant cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+wound+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 HTML:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/1f399b27e4075583b6be3105aab35aa0&quot;&gt;Wound Healing Process (PLIX)&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+wound+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners retrieve their original Lesson 1 cell diagrams and written predictions about wound healing from their notebooks or portfolios. Working individually for 4 minutes, they re-read what they wrote in Lesson 1 without changing anything. They place a sticky note or write in a different colour: &#x27;What I would change today, and why.&#x27; They do NOT yet share — this is private preparation for the whole-class explanation that follows.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;BEFORE THE LESSON: Ensure every learner has access to their Lesson 1 diagram (returned from teacher files or retrieved from portfolios). Write the anchoring phenomenon on the board in full: &#x27;A Form 1 student in Nairobi cuts their finger slicing onions for supper. Bleeding slows. A clot forms. The wound heals. How — cell by cell?&#x27; &lt;/p&gt;&lt;p&gt;SAY (slowly, deliberately): &#x27;In Lesson 1, I asked you to explain what happens when you cut your finger. You made your best guess. Today, that same question is back — but this time, you have eleven lessons of evidence behind you. Before we talk, take 4 minutes in silence to re-read what you wrote in Lesson 1.&#x27; &lt;/p&gt;&lt;p&gt;WAIT: Allow full 4 minutes of silent retrieval. Do not prompt or hint. &lt;/p&gt;&lt;p&gt;After 4 minutes, SAY: &#x27;Without changing what you wrote, put a sticky note or write in a new colour — what would you change, and what new word or idea would you now use? You have 3 more minutes.&#x27; &lt;/p&gt;&lt;p&gt;Circulate quietly, reading over shoulders. Note 2–3 learners who show the most dramatic conceptual shift — you will cold-call them first in Phase 2. Note 1–2 learners who still show partial understanding — plan targeted questions for them.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;RETRIEVAL AND CONTRAST: Learners physically return to their Lesson 1 thinking before receiving any new input. This activates prior knowledge, surfaces residual misconceptions, and creates the cognitive &#x27;distance&#x27; that will make the Phase 2 co-construction feel meaningful. The contrast between then and now is the central sensemaking engine of this lesson.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicator: Learners are writing substantively on their sticky notes — naming specific cells (platelets, neutrophils, fibroblasts, epidermal cells) or organelles (nucleus, cell membrane, lysosomes) that were absent from their Lesson 1 writing. Red flag: A learner&#x27;s sticky note says only &#x27;cells heal the wound&#x27; with no specificity — this learner needs targeted cold-calling and scaffolding in Phase 2.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Observe Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/9f2d3e6f004d59c7a0106ab068d0cf53&quot;&gt;Organelles in eukaryotic cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+wound+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 HTML:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/1f399b27e4075583b6be3105aab35aa0&quot;&gt;Wound Healing Process (PLIX)&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+wound+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;The class participates in a structured cold-call round. The teacher leads the class through the wound healing sequence — from the moment of the cut to the appearance of new skin — asking each called student to contribute one specific, evidence-based cell claim. Students who are not called listen actively and are expected to agree, build on, or respectfully challenge each contribution. The complete explanation is recorded on the board in a shared &#x27;class story&#x27; format. By the end of the round, the board shows a fully sequenced, cell-by-cell explanation of the anchoring phenomenon.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;DRAW a simple timeline on the board with 6 stages: (1) Cut occurs → (2) Bleeding begins → (3) Bleeding slows/clot forms → (4) Immune response → (5) Tissue rebuilding → (6) Skin closes.&lt;/p&gt;&lt;p&gt;SAY: &#x27;We are going to build the complete explanation together — out loud, in order, using everything we know. I will call on students. When I call your name, give me ONE cell claim: which cell acts at that stage, what its shape is, what its key organelle or feature is, and what job it does. One claim. Precise. Evidence-based. Everyone else — listen. If you agree, nod. If you would add or challenge, raise your hand.&#x27;&lt;/p&gt;&lt;p&gt;COLD-CALL SEQUENCE (minimum 8 students — use names, not volunteers):&lt;/p&gt;&lt;p&gt;— Stage 1–2: Call Student A: &#x27;What is the FIRST cell to respond when the cut happens? Describe its shape and why that shape matters.&#x27; WAIT 12 seconds.&lt;/p&gt;&lt;p&gt;— Stage 3 (clot): Call Student B: &#x27;Platelets. What is unusual about platelet structure, and how does that unusual feature help them do their job?&#x27; WAIT 12 seconds.&lt;/p&gt;&lt;p&gt;— Stage 3 (clot continued): Call Student C: &#x27;What protein do platelets help deploy? What organelle in other cells produces proteins like that?&#x27; WAIT 10 seconds.&lt;/p&gt;&lt;p&gt;— Stage 4 (immune): Call Student D: &#x27;Neutrophils arrive. What do they do, and what organelle makes that job possible?&#x27; WAIT 12 seconds.&lt;/p&gt;&lt;p&gt;— Stage 4 continued: Call Student E: &#x27;Macrophages. How is their shape different from neutrophils? What does that shape allow them to do?&#x27; WAIT 12 seconds.&lt;/p&gt;&lt;p&gt;— Stage 5 (rebuilding): Call Student F: &#x27;Fibroblasts secrete collagen. What organelle is highly developed in fibroblasts, and why is that logical?&#x27; WAIT 12 seconds.&lt;/p&gt;&lt;p&gt;— Stage 6 (skin closes): Call Student G: &#x27;Epidermal cells divide and migrate. What cell feature must be active for division to happen?&#x27; WAIT 10 seconds.&lt;/p&gt;&lt;p&gt;— SYNTHESIS: Call Student H: &#x27;All these cells come from the same organism and carry the same DNA. So why do they look so different? Answer using what you know about specialisation.&#x27; WAIT 15 seconds — this is the hardest question.&lt;/p&gt;&lt;p&gt;AFTER EACH RESPONSE: Rephrase and write the key claim on the board at the correct stage. If a response is incomplete, SAY: &#x27;[Name], you said [X]. Can anyone add the organelle or structure detail that makes that work?&#x27; — open to hands.&lt;/p&gt;&lt;p&gt;AFTER ALL 8 ROUNDS: SAY: &#x27;Look at the board. That is the complete answer to the question we started with in Lesson 1. Read it. That explanation belongs to this class — you built it together.&#x27;  Allow 30 seconds of silent reading.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;STRUCTURED ACADEMIC CONTROVERSY AND CO-CONSTRUCTION: The cold-call round is not a quiz — it is a public knowledge-building exercise. Each contribution is a piece of evidence that advances the shared explanation. By naming specific cells, shapes, and organelles in sequence, learners experience the explanatory power of cell biology as it solves a real, familiar puzzle. The sequential timeline on the board makes the causal chain visible and permanent.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicators: (a) Called students correctly name at least the cell type and one structural feature without prompting — target: 6 out of 8 students achieve this unaided. (b) Uncalled students are nodding, tracking the board, or raising hands to add — not disengaged. (c) Student H&#x27;s synthesis response explicitly links DNA → gene expression → specialisation, or at minimum states that different genes are &#x27;switched on&#x27; in different cells. Red flag: If fewer than 4 students can name the correct organelle for a given function, pause and run a 2-minute whole-class review of that organelle before continuing.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Explain Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/c1adffcd23b5561ca8687b2d0a7fff8e&quot;&gt;Overview of animal and plant cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+wound+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/26cbebba12c35a488ff3d37d5427b3eb&quot;&gt;Plant vs animal cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+wound+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners place their Lesson 1 cell diagram and their most recent (Lesson 11) revised model side by side on their desks. They complete a structured &#x27;Then vs. Now&#x27; written comparison (in their notebooks or on a provided template) with three sentence stems: (1) &#x27;In Lesson 1, I thought… but now I know…because…&#x27;; (2) &#x27;The biggest change in my model is… because the evidence from [specific lesson/activity] showed me…&#x27;; (3) &#x27;One question I still have that this unit did not fully answer is…&#x27; After 8 minutes of individual writing, two volunteers share their responses with the class.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Distribute or direct learners to their Lesson 11 revised models. SAY: &#x27;Put your Lesson 1 diagram on the left and your final model on the right. Look at them side by side. In 8 minutes, I want you to write three sentences — the stems are on the board. Use the words from our wall: organelle, specialisation, cell membrane, nucleus, mitochondria, ribosome, chloroplast, cell wall, vacuole, lysosome. Be specific — do not say &#x27;I learned more.&#x27; Say what exactly you learned and why the evidence changed your thinking.&#x27;&lt;/p&gt;&lt;p&gt;WRITE the three sentence stems on the board:&lt;/p&gt;&lt;p&gt;1. &#x27;In Lesson 1, I thought… but now I know… because…&#x27;&lt;/p&gt;&lt;p&gt;2. &#x27;The biggest change in my model is… because the evidence from [lesson/activity] showed me…&#x27;&lt;/p&gt;&lt;p&gt;3. &#x27;One question I still have is…&#x27;&lt;/p&gt;&lt;p&gt;WAIT: 8 minutes of silent individual writing. Circulate and read over shoulders. Identify 2 learners with strong, specific responses — ask them in advance if they are willing to share.&lt;/p&gt;&lt;p&gt;AFTER 8 MINUTES: Call on the 2 pre-identified volunteers. After each shares, SAY: &#x27;Who else had a similar change in their thinking — hands?&#x27; Scan room. SAY: &#x27;Who had a DIFFERENT change — hands?&#x27; Call on one.&lt;/p&gt;&lt;p&gt;SAY: &#x27;Your third sentence — the question you still have — is not a failure. That is the beginning of the next unit. Scientists in Kenya and around the world are still asking questions exactly like yours. Hold onto it.&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;REFLECTIVE MODEL COMPARISON (THEN vs. NOW): Placing the two models physically side by side externalises conceptual growth. The structured sentence stems force learners to name the specific evidence that drove each conceptual change — moving reflection from vague (&#x27;I learned a lot&#x27;) to precise (&#x27;I now know fibroblasts have an extensive endoplasmic reticulum because we observed that protein-secreting cells need more ER, and fibroblasts secrete collagen&#x27;). This is the NGSS Science and Engineering Practice of Obtaining, Evaluating, and Communicating Information.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicators: (a) Learners&#x27; sentence stems contain specific cell and organelle names rather than general statements. (b) At least one learner references a specific lesson activity (e.g., &#x27;the onion cell microscopy in Lesson 3&#x27; or &#x27;the specialised cell card sort in Lesson 8&#x27;) as their evidence source. (c) The &#x27;question I still have&#x27; sentences reveal genuine intellectual curiosity — e.g., questions about how genes are switched on/off, how the body knows which cells to send, or how cancer relates to cell specialisation. Red flag: If most learners&#x27; &#x27;then vs. now&#x27; sentences are identical or vague, the teacher pauses and models one example aloud before continuing.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Driving Question Board (DQB) Creation&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/8640601f847a586e97f0030c90135a9c&quot;&gt;Comparing animal and plant cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+wound+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 HTML:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/64eedd0564b25ce08f407812919dbd53&quot;&gt;Plant Cell Structures (Flexbook)&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+wound+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;The teacher displays the full Driving Question Board — all question cards posted since Lesson 1. As a whole class, learners call out their classification for each question: ANSWERED (green), PARTIALLY ANSWERED (yellow), or BEYOND THIS UNIT (blue). Students justify their classification with a one-sentence reason. Questions classified as BEYOND THIS UNIT are physically moved to a &#x27;Future Questions Wall&#x27; — a permanent display that will seed curiosity for upcoming sub-strands.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Bring the physical DQB to the front of the room (or display it on screen if digital). Point to the first question card. SAY: &#x27;For each question on our board, we decide together: ANSWERED — we have strong evidence. PARTIALLY ANSWERED — we have some evidence but gaps remain. BEYOND THIS UNIT — this question needs more biology than we have learned so far. Raise your hand to vote.&#x27;&lt;/p&gt;&lt;p&gt;WORK THROUGH THE BOARD systematically — spend no more than 45 seconds per card:&lt;/p&gt;&lt;p&gt;— For ANSWERED cards: SAY &#x27;Who can give the one-sentence answer? Cold-call one student. WAIT 10 seconds.&#x27;&lt;/p&gt;&lt;p&gt;— For PARTIALLY ANSWERED cards: SAY &#x27;What do we know, and what is the gap? Cold-call one student.&#x27;&lt;/p&gt;&lt;p&gt;— For BEYOND THIS UNIT cards: SAY &#x27;Which future topic might answer this? Any guesses?&#x27; Accept 2–3 hands.&lt;/p&gt;&lt;p&gt;PHYSICALLY mark each card with a coloured sticker or marker: green = ANSWERED, yellow = PARTIALLY ANSWERED, blue = BEYOND THIS UNIT.&lt;/p&gt;&lt;p&gt;Move BEYOND THIS UNIT cards to the &#x27;Future Questions Wall.&#x27;&lt;/p&gt;&lt;p&gt;SAY: &#x27;The questions on our future wall are not failures — they are invitations. Some of them will be answered in Sub-Strand 1.3, some in Strand 2, some you may not encounter until university or research. That is what biology looks like: a discipline that is still being written.&#x27;&lt;/p&gt;&lt;p&gt;POINT to the driving question posted since Lesson 1: &#x27;Why do cells in our body look so different from each other — and how does the shape of a cell determine the job it can do?&#x27; SAY: &#x27;Can we answer this now?&#x27; Cold-call one student for a final, full-sentence answer. WAIT 15 seconds.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;DQB CLOSURE AS METACOGNITIVE AUDIT: Formally classifying questions as ANSWERED, PARTIALLY ANSWERED, or BEYOND THIS UNIT is a public act of intellectual honesty. It models how scientists work — acknowledging the boundaries of current evidence. Moving BEYOND THIS UNIT questions to a Future Questions Wall transforms unanswered questions from sources of frustration into sources of forward momentum. This directly embodies the NGSS practice of Asking Questions and Defining Problems.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicators: (a) The class can classify at least 70% of DQB questions as ANSWERED with a correct one-sentence justification. (b) The driving question itself receives a full, accurate, multi-clause answer from the cold-called student — referencing both cell structure AND specialisation AND at least two named cell types. (c) BEYOND THIS UNIT questions generate genuine curiosity responses (students spontaneously name upcoming topics or ask follow-up questions). Red flag: If the driving question receives only a one-word or one-clause answer, the teacher does not correct — instead, opens to the class: &#x27;Who can build on that? Three more words. What is the connection to shape?&#x27;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Model Building Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/9f2d3e6f004d59c7a0106ab068d0cf53&quot;&gt;Organelles in eukaryotic cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+wound+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/34d28635c2d45902bee3acf7a60fb2f7&quot;&gt;Plant Cell Structures Practice&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+wound+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners complete a structured individual exit reflection in writing (5 minutes): &#x27;One thing I now understand that I did not understand in Lesson 1 is… because… The evidence that changed my thinking was…&#x27; This reflection is collected by the teacher. Learners then sit the sub-strand summative assessment independently. The assessment tasks learners to: (a) label and describe a diagram of a specialised cell; (b) explain how cell structure supports function using a named Kenyan biological context; (c) compare plant and animal cells; (d) answer structured questions about wound healing and cell specialisation.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;SAY: &#x27;Before we close, I want one last individual piece of writing from you. This is for you — it is about your own thinking, not a grade. Complete this sentence in your notebook: One thing I now understand that I did not understand in Lesson 1 is… because… The evidence that changed my thinking was… You have 5 minutes. Be specific. Use the language of cell biology.&#x27;&lt;/p&gt;&lt;p&gt;WAIT: 5 minutes silent writing. Collect exit reflections (these inform teacher reflection and future planning — see Teacher Reflection section).&lt;/p&gt;&lt;p&gt;TRANSITION TO ASSESSMENT: SAY: &#x27;Well done. You have worked hard across twelve lessons. The assessment you are about to do is an opportunity to show what you know — it is not a test of whether you are clever, it is a record of how far you have come. Clear your desks. Work independently and in silence. You have [insert time as per school policy] minutes.&#x27;&lt;/p&gt;&lt;p&gt;DISTRIBUTE assessment papers. Circulate silently. Do not answer content questions during the assessment. If a learner appears stuck, point to the word wall or their notebook cover vocabulary sheet (if policy permits).&lt;/p&gt;&lt;p&gt;AFTER ASSESSMENT: Collect papers. SAY — and mean it: &#x27;In Lesson 1, you saw a cut finger and guessed. Today, you can explain it cell by cell. That is what learning biology looks like. Take that with you into the next sub-strand.&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;EXIT REFLECTION AS FINAL MODEL REVISION: The written exit reflection is the learner&#x27;s final, personal model statement. Unlike the group co-construction in Phase 2, this is individual and permanent — it captures where each learner&#x27;s understanding has genuinely arrived. Collecting these reflections gives the teacher diagnostic data for the next sub-strand. The summative assessment then provides formal evidence of whether the core SLOs have been met. Together, these two artefacts — the reflection and the assessment — constitute the full &#x27;final model&#x27; of each learner&#x27;s understanding.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicators: (a) Exit reflections name at least one specific cell type, one specific organelle, or one specific evidence activity — not generic statements. (b) During the assessment, learners write continuously without seeking peer help — indicating sufficient independent understanding. (c) In the assessment&#x27;s wound healing question, learners sequence at least 3 correct cell types in the correct order with accurate structural details. Summative assessment data: Teacher analyses results by SLO — which specific outcomes (cell structure labelling, specialisation explanation, plant vs. animal comparison) show the strongest and weakest performance. This data directly informs the opening of Sub-Strand 1.3.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;D. TEACHER REFLECTION&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;After collecting exit reflections and marking sub-strand assessments, the teacher should analyse results against three questions: (1) Which SLO showed the greatest growth from Lesson 1 to Lesson 12 — and what instructional moves drove that growth? (2) Which SLO showed the weakest final performance — and should be revisited at the opening of Sub-Strand 1.3? (3) How many learners could fully explain wound healing using 3 or more named cell types with accurate structural details? This number is your &#x27;deep understanding&#x27; benchmark. Beyond assessment data, review the exit reflections for the quality of &#x27;evidence that changed my thinking&#x27; sentences — if learners cite specific activities (microscopy, card sorts, diagrams) rather than vague statements, your lesson design successfully built cumulative, evidence-anchored understanding. If reflections are generic, revisit how evidence was recorded and revisited across the unit. Finally, note which DQB questions were classified as BEYOND THIS UNIT — these are your strongest bridge into Sub-Strand 1.3 (Chemicals of Life) and Strand 3.2 (Transport in Animals). Post these prominently as the unit transitions.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;E. SUMMARY TABLE PROMPT  (pre-filled example for this lesson)&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;What did I observe?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;The class co-constructed a complete, sequential, cell-by-cell explanation of wound healing on the board — from the moment of the cut to the closure of the skin — naming platelets, neutrophils, macrophages, fibroblasts, and epidermal cells with their shapes and key organelles. A minimum of 8 students contributed publicly via cold-call.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;What did I learn?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;All specialised cells in the body originate from the same organism and carry the same DNA, but different genes are expressed in different cells, producing different structures — and those structures directly determine function. The shape of a cell is not accidental: it is the physical expression of the job that cell is specialised to do. This is the complete answer to the driving question.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;How does this explain the phenomenon?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;The anchoring phenomenon — The Healing Cut — is fully explained: platelets (small, anucleate, sticky) aggregate and initiate clotting; neutrophils (multi-lobed nucleus, abundant lysosomes) engulf bacteria; macrophages (irregular, flexible membrane) engulf debris and dead cells; fibroblasts (elongated, extensive rough ER and Golgi) secrete collagen scaffolding; epidermal cells (tightly packed, active nucleus) divide and migrate to close the surface. Every cell&#x27;s shape is a solution to a specific biological problem — and that is why cells in the same organism look so completely different from each other.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;p&gt;© 2026 SeaVuria and ARES Education. Aligned with KICD objectives. Developed by SeaVuria; te
