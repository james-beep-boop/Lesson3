sson-7&quot; data-jump=&quot;lesson-7&quot; data-lesson-number=&quot;7&quot; aria-label=&quot;Lesson 7: Microscopy Practical 2&quot; data-tooltip=&quot;Microscopy Practical 2 — Human Cheek Cells&quot;&gt;7&lt;/a&gt;&lt;a class=&quot;lp-lesson-number&quot; href=&quot;#lesson-8&quot; data-jump=&quot;lesson-8&quot; data-lesson-number=&quot;8&quot; aria-label=&quot;Lesson 8: Cell Specialisation — Animal Cells&quot; data-tooltip=&quot;Cell Specialisation — Animal Cells&quot;&gt;8&lt;/a&gt;&lt;a class=&quot;lp-lesson-number&quot; href=&quot;#lesson-9&quot; data-jump=&quot;lesson-9&quot; data-lesson-number=&quot;9&quot; aria-label=&quot;Lesson 9: Specialised Plant Cells&quot; data-tooltip=&quot;Specialised Plant Cells&quot;&gt;9&lt;/a&gt;&lt;a class=&quot;lp-lesson-number&quot; href=&quot;#lesson-10&quot; data-jump=&quot;lesson-10&quot; data-lesson-number=&quot;10&quot; aria-label=&quot;Lesson 10: Cell Organisation&quot; data-tooltip=&quot;Cell Organisation&quot;&gt;10&lt;/a&gt;&lt;a class=&quot;lp-lesson-number&quot; href=&quot;#lesson-11&quot; data-jump=&quot;lesson-11&quot; data-lesson-number=&quot;11&quot; aria-label=&quot;Lesson 11: Synthesis and Model Revision&quot; data-tooltip=&quot;Synthesis and Model Revision&quot;&gt;11&lt;/a&gt;&lt;a class=&quot;lp-lesson-number&quot; href=&quot;#lesson-12&quot; data-jump=&quot;lesson-12&quot; data-lesson-number=&quot;12&quot; aria-label=&quot;Lesson 12: Consolidation and Final Explanation&quot; data-tooltip=&quot;Consolidation and Final Explanation&quot;&gt;12&lt;/a&gt;&lt;/div&gt;&lt;a href=&quot;#doc-final-explanation&quot; data-jump=&quot;doc-final-explanation&quot;&gt;Final explanation&lt;/a&gt;&lt;a href=&quot;#doc-summary-table&quot; data-jump=&quot;doc-summary-table&quot;&gt;Summary table&lt;/a&gt;&lt;/nav&gt;&lt;/div&gt;
&lt;details class=&quot;lp-section&quot; id=&quot;doc-lesson-sequence&quot; data-document-section&gt;
  &lt;summary&gt;Unit overview&lt;/summary&gt;
  &lt;div class=&quot;lp-document doc-preview&quot;&gt;&lt;p&gt;&lt;strong&gt;BIOLOGY GRADE 10: CELL STRUCTURE&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;em&gt;CBE Phenomenon-Driven Lesson Sequence — Sub-Strand 1.1 (12 Lessons)&lt;/em&gt;&lt;/p&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;SUB-STRAND OVERVIEW&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Grade Level&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;10&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Subject&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Biology&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Strand&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Strand 1.0: Cell Biology and Biodiversity&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Sub-Strand&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Sub-Strand 1.3: Cell Structure and Specialisation&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Total Duration&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;12 lessons × 40 minutes = 480 minutes total&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Sub-Strand Content&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;–  Cell as the basic unit of life&lt;/p&gt;&lt;p&gt;–  Types of cells: prokaryotic and eukaryotic cells&lt;/p&gt;&lt;p&gt;–  Structure and ultrastructure of the plant cell (cell wall, cell membrane, nucleus, chloroplast, vacuole, mitochondria, endoplasmic reticulum, ribosomes, Golgi apparatus)&lt;/p&gt;&lt;p&gt;–  Structure and ultrastructure of the animal cell (cell membrane, nucleus, mitochondria, endoplasmic reticulum, ribosomes, Golgi apparatus, lysosomes, centrioles)&lt;/p&gt;&lt;p&gt;–  Comparison of plant and animal cells (similarities and differences)&lt;/p&gt;&lt;p&gt;–  Comparison of prokaryotic and eukaryotic cells&lt;/p&gt;&lt;p&gt;–  Cell specialisation: meaning and significance&lt;/p&gt;&lt;p&gt;–  Specialised animal cells (red blood cells, white blood cells, sperm cells, egg cells, nerve cells, muscle cells, ciliated epithelial cells)&lt;/p&gt;&lt;p&gt;–  Specialised plant cells (root hair cells, guard cells, xylem vessels, phloem sieve tubes, palisade mesophyll cells)&lt;/p&gt;&lt;p&gt;–  Relationship between cell structure and function&lt;/p&gt;&lt;p&gt;–  Cell organisation: cells → tissues → organs → organ systems → organism&lt;/p&gt;&lt;p&gt;–  Preparation and use of temporary slides to observe cell structure under a light microscope&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Learning Outcomes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;By the end of the sub-strand, the learner should be able to:&lt;/p&gt;&lt;p&gt;a) describe the structure of prokaryotic and eukaryotic cells,&lt;/p&gt;&lt;p&gt;b) distinguish between plant and animal cells based on their structures,&lt;/p&gt;&lt;p&gt;c) explain the relationship between the structure and function of specialised cells,&lt;/p&gt;&lt;p&gt;d) prepare temporary slides and observe cell structures using a light microscope,&lt;/p&gt;&lt;p&gt;e) appreciate the importance of cell specialisation in the functioning of living organisms.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Core Competencies&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;–  Communication and Collaboration: The learner works in groups to prepare temporary slides, share microscope observations, and present comparisons of cell types to peers using labelled diagrams and discussion.&lt;/p&gt;&lt;p&gt;–  Critical Thinking and Problem Solving: The learner analyses the structural features of specialised cells and constructs logical arguments linking organelle structure to cell function, e.g. why a red blood cell lacks a nucleus.&lt;/p&gt;&lt;p&gt;–  Imagination and Creativity: The learner creates annotated models or diagrams of plant and animal cells using locally available materials (e.g. clay, fruit, bottle caps) to represent organelles and their functions.&lt;/p&gt;&lt;p&gt;–  Self-efficacy: The learner develops confidence in laboratory skills by independently preparing and observing temporary slides of onion epidermal cells and cheek cells, and recording accurate observations.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Core Values&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;–  Responsibility: The learner handles microscopes and laboratory materials with care, and clears and cleans the workspace after practical activities.&lt;/p&gt;&lt;p&gt;–  Respect: The learner appreciates diverse contributions from group members during collaborative model-building and peer presentations on cell structure.&lt;/p&gt;&lt;p&gt;–  Unity: The learner works harmoniously with peers from different backgrounds during group practicals, recognising that diverse perspectives strengthen sensemaking about cell organisation.&lt;/p&gt;&lt;p&gt;–  Social Justice: The learner acknowledges that all body cells, though structurally different, contribute equally to the survival of the organism — drawing a parallel to the equal value of all individuals in society.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Science &amp;amp; Engineering Practices&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;–  Developing and Using Models (SEP 2): The learner constructs and progressively revises a 2D or 3D model of a generalised cell, adding organelles as new learning accumulates across lessons, and uses the model to explain the anchoring phenomenon of wound healing.&lt;/p&gt;&lt;p&gt;–  Planning and Carrying Out Investigations (SEP 3): The learner plans and conducts a microscopy practical to prepare temporary slides of onion epidermal cells and human cheek cells, recording observations systematically with labelled drawings.&lt;/p&gt;&lt;p&gt;–  Analysing and Interpreting Data (SEP 4): The learner analyses microscope images and diagrams to compare structural features of prokaryotic vs. eukaryotic cells and plant vs. animal cells, identifying patterns and anomalies.&lt;/p&gt;&lt;p&gt;–  Constructing Explanations (SEP 6): The learner constructs written and oral explanations linking the specialised structure of cells (e.g. biconcave disc shape of red blood cells, long axon of nerve cells) to their specific functions in the context of wound healing.&lt;/p&gt;&lt;p&gt;–  Obtaining, Evaluating, and Communicating Information (SEP 8): The learner researches and critically evaluates information from textbooks, print media, and (where available) internet sources about cell structure, then communicates findings through labelled diagrams, presentations, and Driving Question Board updates.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Pertinent &amp;amp; Contemporary Issues (PCIs)&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;–  Health Education: The learner connects cell specialisation to human health by exploring how specific cells (white blood cells, platelets, skin cells) coordinate during wound healing and immune response — relating this to hygiene practices and first-aid awareness relevant to Kenyan households and schools.&lt;/p&gt;&lt;p&gt;–  Environmental Conservation: The learner uses locally and sustainably sourced materials (onion skins from Wakulima Market, cheek swabs, leaf sections from school gardens) for microscopy practicals, minimising waste and appreciating the value of local biological resources.&lt;/p&gt;&lt;p&gt;–  Safety and Security: The learner observes proper laboratory safety protocols when handling glass slides, coverslips, iodine stain, and methylene blue during cell preparation practicals.&lt;/p&gt;&lt;p&gt;–  Life Skills Education: The learner reflects on the concept of specialisation and interdependence of cells as a metaphor for teamwork and individual roles within families, schools, and communities in Kenya.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Career Connections&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;–  Medicine and Surgery: Understanding cell structure and specialisation is foundational for learners pursuing medicine, nursing, or surgery at institutions such as the University of Nairobi School of Medicine or Kenyatta National Hospital.&lt;/p&gt;&lt;p&gt;–  Biomedical Laboratory Science: Learners who study cell morphology and microscopy skills are prepared for careers as medical laboratory technologists who examine blood cells and tissue samples.&lt;/p&gt;&lt;p&gt;–  Biotechnology and Genetic Engineering: Knowledge of eukaryotic cell ultrastructure underpins careers in Kenya&#x27;s growing biotechnology sector, including work at KEMRI (Kenya Medical Research Institute) and KARI (Kenya Agricultural Research Institute).&lt;/p&gt;&lt;p&gt;–  Teaching and Education: Learners may pursue careers as Biology teachers or university lecturers, transmitting cell biology knowledge in Kenyan secondary schools and tertiary institutions.&lt;/p&gt;&lt;p&gt;–  Agriculture and Agronomy: Understanding plant cell structure (guard cells, xylem, phloem) supports careers in crop science, horticulture, and plant breeding — critical for food security in Kenya&#x27;s agricultural economy.&lt;/p&gt;&lt;p&gt;–  Environmental Science: Knowledge of cell biology supports careers in ecology, conservation biology, and wildlife research relevant to Kenya&#x27;s national parks and biodiversity hotspots.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Focus for Lessons&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;This unit anchors the study of cell structure and specialisation in the concrete, puzzling phenomenon of wound healing — a familiar experience for every Kenyan learner — to drive genuine curiosity about why the body deploys different cell types with radically different shapes and functions. Over 12 lessons, learners progress from macroscopic observation of a healing cut to microscopic investigation of cell organelles, building an increasingly detailed and accurate model of both plant and animal cells. The unit foregrounds laboratory skills (microscopy, slide preparation), collaborative model-building, and the disciplinary practice of constructing explanations that link form to function, culminating in a comprehensive understanding of how cell specialisation enables multicellular life.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Driving Question / Key Inquiry Questions&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;DRIVING QUESTION: &quot;Why do cells in our body look so different from each other — and how does the shape of a cell determine the job it can do?&quot;&lt;/p&gt;&lt;p&gt;KICD KEY INQUIRY QUESTIONS:&lt;/p&gt;&lt;p&gt;1. What are the structural differences between plant and animal cells?&lt;/p&gt;&lt;p&gt;2. How does cell specialisation enable organisms to carry out complex life functions?&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Anchoring Phenomenon&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;ANCHORING PHENOMENON — The Healing Cut:&lt;/p&gt;&lt;p&gt;A Form 1 student in Nairobi cuts their finger while slicing onions for supper. Within seconds, bleeding slows and a dark clot begins to form. Over the next few days, the wound seals, the scab falls away, and new pink skin appears — the finger looks almost exactly as it did before. This sequence of events is deeply familiar yet profoundly puzzling: How does the body &quot;know&quot; what to do? How does it send exactly the right response — stopping bleeding, fighting infection, and rebuilding skin — all at once? Closer examination reveals that this is not one process but many, each carried out by a different type of cell: platelets aggregate and release clotting proteins, neutrophils and macrophages engulf bacteria, fibroblasts secrete collagen to rebuild tissue, and epidermal cells divide and migrate to close the surface. Each of these cells looks completely different under a microscope — some are round, some elongated, some have no nucleus at all — yet all of them originate from the same fundamental unit of life. The puzzle that launches this unit: If all cells come from the same organism and carry the same DNA, why do they look so different, and how does their shape make them so perfectly suited to their specific job?&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Storyline Thread&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Lesson 1 — Phenomenon Launch &amp;amp; Prior Knowledge Elicitation: Students observe a short narrated photo sequence of a healing cut (or teacher&#x27;s live description of the Nairobi onion-cutting scenario). In a Think-Pair-Share, learners predict: &quot;What do you think is happening inside the skin right now?&quot; Students record initial ideas in their science notebooks. Teacher introduces the Driving Question Board (DQB) — a large class poster — and students post their first &quot;What do we notice?&quot; and &quot;What do we wonder?&quot; sticky notes. Teacher introduces the driving question. No answers given yet.&lt;/p&gt;&lt;p&gt;Lesson 2 — What Is a Cell? Introduction to Cell Theory: Learners search for and discuss information on the cell as the basic unit of life. Teacher uses the analogy of a ugali-making kitchen in Nairobi: every kitchen (cell) has the same basic tools but is set up differently for different tasks. Students are introduced to cell theory (Schleiden, Schwann, Virchow) and the concept of prokaryotic vs. eukaryotic cells using labelled diagrams. Learners sketch and label a generalised cell — this becomes Version 1 of their cumulative cell model.&lt;/p&gt;&lt;p&gt;Lesson 3 — Prokaryotic vs. Eukaryotic Cells: Learners analyse and compare diagrams of a bacterium (prokaryote, e.g. E. coli causing food poisoning in poorly stored nyama choma) and a human cheek cell (eukaryote). Using a structured comparison table, learners identify: presence/absence of nucleus, membrane-bound organelles, size, and cell wall composition. Cold-call questioning (minimum 5 students) consolidates understanding. DQB updated: &quot;We now know prokaryotes and eukaryotes differ in… but we still wonder…&quot;&lt;/p&gt;&lt;p&gt;Lesson 4 — Plant Cell Ultrastructure (Teacher-Led with Diagram Analysis): Using large labelled diagrams and (where available) projected electron micrograph images, learners identify and describe the function of plant cell organelles: cell wall, cell membrane, nucleus, chloroplasts, large central vacuole, mitochondria, endoplasmic reticulum, ribosomes, Golgi apparatus. Teacher uses the metaphor of a maize plant from the Rift Valley farm: every organelle has a specific farming job. Learners add plant cell organelles to their cumulative model (Version 2 — Plant Cell).&lt;/p&gt;&lt;p&gt;Lesson 5 — Animal Cell Ultrastructure (Teacher-Led with Diagram Analysis): Learners compare the animal cell structure with the plant cell from Lesson 4. They identify organelles present in animal cells but not plant cells (lysosomes, centrioles) and those present in plant cells but not animal cells (chloroplasts, cell wall, large vacuole). Learners update their cumulative model to show both cell types side by side (Version 3 — Plant vs. Animal). Group presentations of annotated diagrams with peer feedback.&lt;/p&gt;&lt;p&gt;Lesson 6 — Microscopy Practical 1 (Plant Cells — Onion Epidermal Cells): Learners prepare temporary slides of onion epidermal cells using iodine stain. Teacher demonstrates technique first, then groups of 3–4 carry out the practical. Learners draw and label observed cells at low and high power, noting cell wall, vacuole, and nucleus. Observation: &quot;Why are there no chloroplasts in onion skin cells?&quot; — linked back to the supporting phenomenon. Safety protocols enforced throughout. Results recorded in structured practical books.&lt;/p&gt;&lt;p&gt;Lesson 7 — Microscopy Practical 2 (Animal Cells — Human Cheek Cells): Learners prepare temporary slides of cheek (buccal) cells using methylene blue stain. Learners draw and label observed cells, noting cell membrane, cytoplasm, and nucleus. Direct comparison with onion cell drawings from Lesson 6. Learners articulate at least two structural differences they can directly observe. DQB updated with new evidence: &quot;We observed that animal cells have no cell wall — this tells us…&quot;&lt;/p&gt;&lt;p&gt;Lesson 8 — Cell Specialisation: Meaning, Significance, and Specialised Animal Cells: Teacher re-anchors to the healing-cut phenomenon: &quot;We now know cells have organelles — but why do blood cells look so different from skin cells?&quot; Learners explore specialised animal cells: red blood cells (biconcave, no nucleus — why?), white blood cells (irregular shape, many lysosomes — why?), nerve cells (long axon), sperm cells (flagellum, many mitochondria), muscle cells (many mitochondria, myofilaments). Each cell is connected back to its role in wound healing. Learners use the sickle-cell supporting phenomenon to consolidate structure-function links.&lt;/p&gt;&lt;p&gt;Lesson 9 — Specialised Plant Cells: Learners examine specialised plant cells: root hair cells (large surface area for absorption), guard cells (control stomatal opening — relevant to water loss in dry Turkana vs. humid Kisumu), xylem vessels (hollow, lignified — for water transport), phloem sieve tubes (perforated end plates — for sugar transport), palisade mesophyll cells (packed with chloroplasts — for photosynthesis). Learners connect each cell to the bean seedling supporting phenomenon. Structured group activity: match-the-card game linking cell diagrams to functions.&lt;/p&gt;&lt;p&gt;Lesson 10 — Cell Organisation: Cells → Tissues → Organs → Organ Systems → Organism: Learners trace the organisational hierarchy using the wound-healing context: skin cells form epithelial tissue → tissue forms the skin organ → skin is part of the integumentary system → the system protects the whole organism. A parallel is drawn to a Kenyan secondary school: individual students (cells) → class (tissue) → school (organ) → county education system (organ system) → Kenyan society (organism). Learners construct a hierarchy diagram and update their cumulative model to show cell organisation (Version 4).&lt;/p&gt;&lt;p&gt;Lesson 11 — Synthesis and Model Revision: Learners return to their original predictions from Lesson 1 and compare them with current understanding. In groups, learners produce a final annotated poster-model showing: (a) a labelled plant cell, (b) a labelled animal cell, (c) three specialised cells from the wound-healing phenomenon with structure-function annotations, and (d) the cell organisation hierarchy. Groups present posters; peers use a structured feedback protocol (1 glow, 1 grow). DQB is reviewed — all original &quot;wonder&quot; questions are addressed or re-categorised as &quot;questions for future learning.&quot;&lt;/p&gt;&lt;p&gt;Lesson 12 — Consolidation, DQB Closure, and Reflection: Teacher facilitates a whole-class return to the anchoring phenomenon: &quot;We started with a puzzling cut on a finger. Using everything we now know about cell structure and specialisation, let&#x27;s fully explain what happens during wound healing — cell by cell.&quot; Students contribute orally in a structured round (cold-call, minimum 8 students). Learners write individual exit reflections: &quot;One thing I now understand that I did not understand in Lesson 1 is… because…&quot; Final DQB update: questions are marked ANSWERED, PARTIALLY ANSWERED, or BEYOND THIS UNIT. Sub-strand assessment administered.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Supporting Phenomena&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;–  The Sickle-Cell Mosquito Net: In western Kenya near Lake Victoria, some children inherit sickle-cell anaemia — their red blood cells are curved like a sickle rather than the normal biconcave disc. These children suffer painful crises because the abnormal shape prevents efficient oxygen transport. This phenomenon supports the concept that a tiny change in cell shape has dramatic consequences for function.&lt;/p&gt;&lt;p&gt;–  The Onion Skin Under the Microscope: When a thin layer of onion epidermal cells from a Nakuru market onion is placed under a light microscope, learners see a neat brick-like grid of cells, each with a visible cell wall, cell membrane, and large central vacuole — but no chloroplasts. This supports the comparison of plant vs. animal cells and raises the question: why do onion cells lack chloroplasts if they are plant cells?&lt;/p&gt;&lt;p&gt;–  The Bean Seedling in the Dark: A bean seed (njugu mawe) germinated in a dark box in Kisumu produces a tall, pale yellow seedling with no green colour. When moved into sunlight, it turns green within days. This supports the concept of chloroplast development and the relationship between organelle function and environmental conditions.&lt;/p&gt;&lt;p&gt;–  The Amoeba and the Nerve Cell: A projected image or diagram comparing a single-celled amoeba (a prokaryote-like free-living cell) with a human motor nerve cell — one is a blob that does everything alone, the other is a metre-long, highly specialised cell that only transmits signals — illustrates the extreme range of cell specialisation and introduces the prokaryote vs. eukaryote distinction.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;p&gt;&lt;strong&gt;ATTRIBUTION AND LICENSING&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Curriculum Alignment: &lt;/strong&gt;Structured in pedagogical alignment with the competence-based curriculum format and learning outcomes established by the Kenya Institute of Curriculum Development (KICD). This material is independently developed and is not officially endorsed or published by KICD.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Content &amp;amp; Pedagogy: &lt;/strong&gt;Developed and adapted by the educator team at SeaVuria (registered 501(c)(3) in the United States and registered NGO in Kenya, No. 872-850A-BF11), who designed the pedagogical framework, lesson templates and exemplar lessons on which this material is based.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Production &amp;amp; Layout: &lt;/strong&gt;Educational design and curriculum sequencing by SeaVuria. Technical layout, structural formatting, and digital optimization/implementation executed in partnership with ARES Education (registered 501(c)(3) in the United States and Canada (as Afretech Aid) and registered NGO in Kenya), with lesson drafting and compilation assisted by AI (Claude, Anthropic).&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Licensing &amp;amp; Copyright: &lt;/strong&gt;© 2026 SeaVuria and ARES Education. This work is licensed under a &lt;a href=&quot;https://creativecommons.org/licenses/by-nc/4.0/&quot;&gt;Creative Commons Attribution-NonCommercial 4.0 International License&lt;/a&gt; (&lt;a href=&quot;https://creativecommons.org/licenses/by-nc/4.0/&quot;&gt;CC BY-NC 4.0&lt;/a&gt;). To view a copy of this license, visit &lt;a href=&quot;https://creativecommons.org/licenses/by-nc/4.0/&quot;&gt;https://creativecommons.org/licenses/by-nc/4.0/&lt;/a&gt;. You are free to copy, redistribute, and adapt this material in any medium or format, provided appropriate credit is given and the material is not used for commercial purposes. KICD learning outcomes and curriculum designations reproduced here for alignment purposes remain the property of KICD and are not covered by this license. Linked external resources (e.g. CK-12, Khan Academy, PhET) are subject to their own licenses.&lt;/p&gt;&lt;/div&gt;

&lt;details class=&quot;lp-section&quot; id=&quot;lesson-1&quot; data-document-section&gt;
  &lt;summary&gt;Lesson 1 · The Healing Cut: Launching Our Investigation Into Why Cells Look Different&lt;/summary&gt;
  &lt;div class=&quot;lp-document doc-preview&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;LESSON 1 (40 minutes): The Healing Cut: Launching Our Investigation Into Why Cells Look Different&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;A. SPECIFIC LEARNING OUTCOMES&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Category&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Specific Learning Outcomes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Purpose&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;To launch the anchoring phenomenon and surface learners prior ideas about cells, setting up the driving question that will guide the entire sub-strand&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Knowledge&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners will recall that the human body responds to injury in multiple ways simultaneously, and will begin to articulate that different responses may involve different types of cells&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Skills&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners will practise scientific observation, prediction, and recording of initial ideas in their science notebooks using Think-Pair-Share and sticky-note protocols&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Attitudes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners will demonstrate curiosity and openness by sharing tentative ideas without fear of being wrong, and will value the contributions of peers during collaborative discussion&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Key Inquiry Question&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;How does cell specialisation enable organisms to carry out complex life functions?&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Purpose in Storyline&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;This is the opening lesson that introduces the anchoring phenomenon — a healing cut on a finger — and elicits prior knowledge. No content is delivered yet. The lesson exists to create intellectual need: learners feel puzzled, post genuine questions, and are motivated to investigate. The Driving Question Board is established and will grow across all 12 lessons.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Safety Notes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;No hazardous materials are used in this lesson. If a teacher uses a real photograph of a wound, ensure images are not graphic or distressing. Remind learners that anyone who feels uncomfortable viewing injury images may look away and the teacher will describe the image verbally instead.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;B. LESSON OVERVIEW&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;The teacher narrates the Nairobi onion-cutting scenario vividly, then guides learners through a structured Think-Pair-Share to surface prior ideas about what happens inside the body during wound healing. Learners record predictions in science notebooks, then post sticky notes on the class Driving Question Board under two columns: What do we notice? and What do we wonder? The teacher closes by formally introducing the driving question. No answers are provided — the lesson ends in productive uncertainty.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;5&quot;&gt;&lt;p&gt;&lt;strong&gt;C. LESSON IMPLEMENTATION FRAMEWORK&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Phase&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Learner Experience&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Teacher Moves&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Sensemaking Strategy&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Formative Assessment Strategy&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Predict Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/bef127e6f18d50caa23fb4c7d2638fa6&quot;&gt;Organization in the human body&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+function+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 HTML:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/1f399b27e4075583b6be3105aab35aa0&quot;&gt;Wound Healing Process (PLIX)&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+function+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners listen with eyes closed as the teacher narrates the scenario of a Form 1 student in Nairobi — Amina — who is helping her mother prepare supper and cuts her finger while slicing onions. The teacher describes the immediate events: the sting, the appearance of blood, and then the slowing of bleeding. Learners are then asked to open their science notebooks and write for 2 minutes in response to the prompt: What do you think is happening inside Amina finger right now? Write anything that comes to mind — there are no wrong answers today. Learners write independently without consulting neighbours.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Teacher narrates slowly and with deliberate detail: Amina is in the kitchen in Eastleigh. She is slicing onions — the smell is sharp, her eyes are beginning to water. Then the knife slips. She looks down and sees a thin line of red appear on her fingertip. She presses it with her thumb. After about a minute, the bleeding is already slowing down. A dark, sticky material begins to form. What is happening inside that finger right now? After narrating, teacher says: I want everyone to write in your notebook. Do not talk yet. Do not look at your neighbour. Just write what you think. You have 2 full minutes. WAIT TIME: Teacher sets a visible timer for 2 minutes and remains silent, walking slowly between rows to signal that thinking time is genuine and protected. Teacher does not prompt or hint during this period.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Independent written prediction activates prior knowledge from primary science and everyday lived experience. Writing before talking prevents dominant voices from shaping peer responses and ensures every learner has a personal record of their starting point, which will be compared with final understanding in Lesson 12.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Teacher circulates during writing time and reads over shoulders without commenting, mentally noting the range of ideas present — for example, whether learners mention blood clotting, skin repair, bacteria, specific cells, or only describe the wound in surface terms. This informs how the teacher frames the Think-Pair-Share debrief.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Observe Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/bef127e6f18d50caa23fb4c7d2638fa6&quot;&gt;Organization in the human body&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+function+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 HTML:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/1f399b27e4075583b6be3105aab35aa0&quot;&gt;Wound Healing Process (PLIX)&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+function+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners participate in a Think-Pair-Share. First, pairs share their notebook predictions with each other for 90 seconds. Then the teacher displays or describes a four-image narrated photo sequence on the board — or narrates it verbally if projection is unavailable — showing: (1) a freshly cut finger with blood, (2) a dark clot forming, (3) a scab on healing skin after two days, and (4) new pink skin with the scab gone. For each image the teacher pauses and asks learners to observe carefully and add anything new to their notebook predictions. After the sequence, three to four volunteers share their pair discussion with the class. Teacher records key phrases on the board verbatim without correcting or affirming them yet — for example: the blood goes hard, white cells come, skin grows back, something inside stops the bleeding.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;During pair sharing, teacher circulates and listens for interesting or surprising ideas to highlight later. When displaying or describing each image, teacher uses language such as: Look carefully. What do you notice? What changed between image one and image two? After pairs share with the class, teacher scribes on the board and says: I am writing your ideas exactly as you said them. I am not telling you yet whether they are right or not. Every idea here is valuable data — it tells us what we already know and what we still need to find out. Teacher deliberately calls on learners who are not usually first to raise their hand. WAIT TIME: After asking What do you notice? teacher waits a full 5 seconds before taking responses, signalling that observation requires thought.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;The four-image sequence (or vivid verbal narration) grounds the lesson in a concrete, observable event rather than abstract content. Scribing learner language without correction models scientific practice — all observations are recorded before interpretation begins. This also builds psychological safety for sharing incomplete ideas.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;The board list of learner ideas serves as a public prior-knowledge map. Teacher checks whether any learner has spontaneously mentioned cell types (platelets, white blood cells, skin cells) — if so, this is noted as a bridge for Lesson 8. The absence of cell-level thinking confirms the need for the full unit sequence.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Explain Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/ff87b8b186215342a266f0430c770dbf&quot;&gt;Cell parts and their functions&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+function+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/e0858da4f54c5dad90208f98b5be7edc&quot;&gt;Cell structures and their functions&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+function+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Teacher leads a brief whole-class discussion using three targeted questions to help learners begin to articulate the complexity of what they have observed. The questions are asked one at a time with think time between each. Learners respond orally and may also add to their notebook. Question 1: You said the bleeding slows — what do you think causes that? Question 2: You mentioned the skin grows back — do you think one thing does that job, or many things? Question 3: If many different things are doing different jobs inside the wound, what might those things look like — are they all the same or different? After responses, the teacher introduces a bridging statement — not an answer, but a reframe: Scientists who looked at healing wounds under a microscope found something remarkable. They found that dozens of different types of tiny structures were all working at the same time — each doing a completely different job, and each looking completely different from the others. That raises a very big question, which we are going to investigate for the next several weeks.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Teacher uses Socratic questioning — responding to learner answers with follow-up probes rather than evaluation. For example, if a learner says the blood goes hard, teacher responds: Interesting — what do you think makes it go hard? Is that a chemical reaction? A physical change? Something else? Teacher does not confirm or deny. For Question 3, teacher says: Think about this for 10 seconds before you answer. WAIT TIME: A full 10 seconds of silence is enforced after Question 3 because it is the most cognitively demanding. Teacher counts silently and resists the urge to rephrase or prompt. After the bridging statement, teacher pauses and asks: Does that surprise you? Why? allowing 2 or 3 spontaneous responses.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;The three-question sequence is designed to move learners from surface description (bleeding slows) to causal reasoning (what causes it) to systems thinking (multiple components doing different jobs). The bridging statement creates cognitive dissonance — if many different cell types are involved, the question of why they look different becomes genuinely interesting rather than merely academic.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Teacher listens for whether learners can distinguish between a single-cause explanation and a multi-component explanation. Learners who describe multiple simultaneous processes without being prompted are showing readiness for the cell specialisation concept. Learners who provide only single-cause answers will need more scaffolding in Lessons 8 and 9.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Driving Question Board (DQB) Creation&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/8640601f847a586e97f0030c90135a9c&quot;&gt;Comparing animal and plant cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+function+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/26cbebba12c35a488ff3d37d5427b3eb&quot;&gt;Plant vs animal cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+function+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Each learner receives two sticky notes of different colours — for example, yellow for What do we notice? and blue for What do we wonder? Learners write one observation on the yellow note and one genuine question on the blue note. They are given 3 minutes to write both. Learners then come forward in groups of six to eight and place their sticky notes on the large class poster (the DQB) under the two column headings. The teacher reads aloud a selection of the wonder questions and groups similar ones together on the board, narrating: I can see several of you are wondering why the skin grows back so perfectly. Others are wondering what is actually inside blood. These are exactly the kinds of questions scientists ask. Then the teacher formally introduces the driving question by reading it aloud from the top of the DQB poster: Why do cells in our body look so different from each other — and how does the shape of a cell determine the job it can do? Teacher explains that this question will be answered piece by piece across the unit and that the DQB will be updated at the end of every lesson.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Before distributing sticky notes, teacher models the task using a think-aloud: I notice in the images that the wound looks completely healed after just a few days — that is my notice note. I wonder how the body knows exactly what shape to rebuild the skin in — that is my wonder note. Teacher writes these on the board as examples. Teacher emphasises: Your wonder note should be a real question you actually have — not a question you think I want to hear. After learners post notes, teacher does not evaluate or rank the questions. Instead, teacher says: Every single question on this board is legitimate. Some we will answer in this unit. Some might take years of science to answer. All of them matter. WAIT TIME: After reading the driving question aloud, teacher waits 8 seconds in silence before asking: What is your very first reaction to this question? allowing 2 to 3 brief spontaneous responses before closing the phase.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;The two-colour sticky-note protocol separates observation (what we notice) from inquiry (what we wonder), teaching a fundamental scientific distinction. Public posting of questions democratises knowledge construction — every learner contributes to the shared class investigation. The driving question is introduced after learner questions are posted, so learners can see that their own questions connect to it.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Teacher photographs the DQB at the end of the lesson for reference. The wonder notes are analysed to identify: (a) questions that will be answered within this unit, (b) questions that reveal misconceptions to address, and (c) questions that show sophisticated thinking. This analysis shapes the emphasis in Lessons 2 through 5.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Model Building Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/c1adffcd23b5561ca8687b2d0a7fff8e&quot;&gt;Overview of animal and plant cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+function+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/b7891a49a77d50c6974c55f3473fb92c&quot;&gt;Apply: cell parts and functions&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+specialisation+function+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners are told that throughout this unit they will build a cumulative cell model — a diagram that grows and improves as they learn more. In this first lesson, Version 0 of the model is a simple drawn response to a single prompt: Draw what you think a cell looks like. Learners spend 3 minutes drawing in their science notebooks, labelling anything they think might be inside a cell. There is no right answer at this stage. Learners are reminded that this drawing will be compared with their Version 4 model in Lesson 11, and that seeing how their model changes is part of the learning. Teacher closes the lesson by returning to Amina: In Lesson 2, we will begin to look at what a cell actually is and why cell theory is one of the most important ideas in all of biology. But today, you have already done something scientists do every single time they start an investigation — you have observed carefully, asked good questions, and made your first predictions. Hold onto those predictions. We will need them again.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Teacher distributes no diagrams or reference materials during the drawing task — learners must draw from memory and imagination only. Teacher says: This is not an art competition and it is not a test. It is a snapshot of what you already know. Draw whatever comes to mind — a box, a circle, dots inside, labels — anything at all. While learners draw, teacher circulates and asks individual learners: What made you draw it that way? or What is this part doing? These brief conversations surface reasoning without altering the drawing. Teacher does not correct any drawing at this stage. WAIT TIME: Teacher gives a genuine 3 minutes for drawing — not less — and uses a visible timer. At closure, teacher says the sentence about Amina slowly and deliberately, pausing after the word predictions to allow the connection to sink in.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;The Version 0 model serves as a baseline artefact that makes learner thinking visible and traceable across the unit. Drawing from imagination is less threatening than a written test and more revealing of intuitive mental models. The explicit framing that the model will grow removes the pressure to be correct and positions revision as the goal of learning rather than an admission of failure.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Teacher collects science notebooks briefly at the end of class — or photographs selected drawings — to document baseline mental models. Common patterns to look for include: cells drawn as simple circles with no internal structure, cells drawn with a nucleus only, cells drawn with several named organelles (showing prior exposure), and cells drawn to look like bricks or boxes (influenced by the word cell). These patterns guide differentiation in Lesson 2.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;D. TEACHER REFLECTION&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;After the lesson, consider: Did learners write genuine wonder questions or did they write what they thought was expected? Were learners willing to share incomplete ideas publicly — if not, what might have inhibited them? Did the narration of Amina scenario create genuine curiosity or did it feel contrived — if the latter, how could the delivery be made more vivid next time? Were there any learners who already mentioned specific cell types such as platelets or white blood cells — how will their prior knowledge be channelled productively in later lessons without making peers feel behind? Was the 8-second wait time after the driving question genuinely observed — silence is often harder for the teacher than for the learners. Finally, are the wonder questions on the DQB rich enough to sustain 12 lessons of inquiry, or do they need to be supplemented with teacher-generated questions in Lesson 2?&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;E. SUMMARY TABLE PROMPT  (pre-filled example for this lesson)&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;What did I observe?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;We observed a sequence of changes that happen when a finger is cut — bleeding slows, a clot forms, a scab develops, and new skin appears over several days&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;What did I learn?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;We learned that this familiar process is actually made up of many simultaneous events, and that scientists have found many different types of tiny structures working together during wound healing&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;How does this explain the phenomenon?&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;We cannot yet explain why different structures look different or how each one knows what job to do — these are exactly the questions our Driving Question Board will help us answer over the next eleven lessons&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;p&gt;© 2026 SeaVuria and ARES Education. Aligned with KICD objectives. Developed by SeaVuria; technical implementation by ARES (with AI assistance from Claude). Licensed under &lt;a href=&quot;https://creativecommons.org/licenses/by-nc/4.0/&quot;&gt;CC BY-NC 4.0&lt;/a&gt; (&lt;a href=&quot;https://creativecommons.org/licenses/by-nc/4.0/&quot;&gt;https://creativecommons.org/licenses/by-nc/4.0/&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
&lt;/details&gt;

&lt;details class=&quot;lp-section&quot; id=&quot;lesson-2&quot; data-document-section&gt;
  &lt;summary&gt;Lesson 2 · What Is a Cell? Introduction to Cell Theory&lt;/summary&gt;
  &lt;div class=&quot;lp-document doc-preview&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;LESSON 2 (80 minutes): What Is a Cell? Introduction to Cell Theory&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;A. SPECIFIC LEARNING OUTCOMES&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Category&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Specific Learning Outcomes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Purpose&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;To introduce learners to the cell as the basic unit of life, establish the three tenets of cell theory, and distinguish between prokaryotic and eukaryotic cells through labelled diagrams and model sketching.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Knowledge&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners will know: (a) the definition of a cell and its role as the basic unit of structure and function in all living organisms; (b) the three tenets of cell theory as developed by Schleiden, Schwann, and Virchow; (c) the distinguishing features of prokaryotic and eukaryotic cells.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Skills&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners will be able to: (a) search for and discuss information on the cell as the basic unit of life; (b) sketch and label a generalised plant and animal cell diagram; (c) compare prokaryotic and eukaryotic cells using observable structural features.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Attitudes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners will: (a) appreciate that foundational scientific knowledge is built incrementally by many contributors across cultures and time; (b) develop curiosity about how microscopic structures underpin the complex healing events observed in the anchoring phenomenon.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Key Inquiry Question&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;What are the structural differences between plant and animal cells?&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Purpose in Storyline&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;In Lesson 1, learners were introduced to the anchoring phenomenon — the healing cut — and began asking questions about why different cells look and behave differently. Lesson 2 establishes the conceptual foundation: every cell, no matter how specialised, is governed by the same cell theory. By building Version 1 of their cumulative cell model today, learners create a baseline they will revise in every subsequent lesson as they discover how structure drives function.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Safety Notes&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;No hazardous materials are used in this lesson. If learners use scissors or sharp tools for any cut-and-paste diagram activity, remind them to handle these carefully — connecting back to the anchoring phenomenon (the finger cut) is appropriate and reinforces safety awareness. Ensure the classroom internet (if used for research) is filtered and safe.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;B. LESSON OVERVIEW&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;Learners investigate the cell as the basic unit of life by searching for information, engaging with the ugali-kitchen analogy, and studying labelled diagrams of prokaryotic and eukaryotic cells. They are formally introduced to cell theory (Schleiden, Schwann, Virchow) and produce Version 1 of their cumulative cell model — a sketched and labelled generalised cell. The lesson keeps the anchoring phenomenon (the healing cut) alive by asking: &quot;All these different cells that healed Amina&#x27;s finger — what do they all have in common at the most basic level?&quot; Every activity drives toward that question.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;table&gt;&lt;tr&gt;&lt;td colspan=&quot;5&quot;&gt;&lt;p&gt;&lt;strong&gt;C. LESSON IMPLEMENTATION FRAMEWORK&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Phase&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Learner Experience&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Teacher Moves&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Sensemaking Strategy&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Formative Assessment Strategy&lt;/strong&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Predict Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/98ccf1c8b3d35cfea5093cdb61b64836&quot;&gt;Prokaryotic and eukaryotic cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+theory+prokaryotic+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 HTML:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/a9225822ddc15923af4f4e8b0cfe74cf&quot;&gt;Prokaryotic and Eukaryotic Cells (Flexbook)&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+theory+prokaryotic+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Learners are presented with the Phenomenon Recap prompt on the board: &#x27;Yesterday we met Amina&#x27;s healing finger. Platelets, neutrophils, fibroblasts, and skin cells all rushed to help — and they all look completely different. Today&#x27;s question: What do ALL of those cells — no matter how different — have in common?&#x27; Learners individually write a 3-sentence prediction in their science notebooks in response to the prompt: &#x27;I think all cells share… because…&#x27;. They then pair-share with a shoulder partner for 90 seconds.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Display the phenomenon image (Amina&#x27;s healing finger, cross-section diagram from Lesson 1) on the board before learners enter. As learners settle, say: &#x27;Before we learn anything new today, I want you to predict. Look at Amina&#x27;s finger. All those different cells working together — platelets, skin cells, macrophages — what do you think every single one of them has in common? Write three sentences starting with: I think all cells share… because…&#x27; Allow 3 minutes of individual silent writing. WAIT TIME: Do not speak for the full 3 minutes. After pair-share, cold-call 3 pairs: &#x27;Pair at the window table — what did you agree on?&#x27; Record key prediction words on the board in a column labelled OUR PREDICTIONS. Do not correct errors — affirm thinking: &#x27;Interesting — let&#x27;s hold that idea and test it today.&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Think-Pair-Share Prediction Harvest: By surfacing prior conceptions before instruction, the teacher identifies misconceptions (e.g., &#x27;all cells have a nucleus&#x27;) that the lesson will either confirm or productively challenge. Recording predictions publicly creates cognitive accountability — learners are motivated to revisit their words.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicator: Each learner has written at least 3 sentences in their notebook before pair-share begins. Teacher scans notebooks during circulation. Listen for: Do learners mention a membrane? Genetic material? A &#x27;control centre&#x27;? Flag any learner who writes &#x27;I don&#x27;t know&#x27; for targeted support during the Observe phase.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Observe Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/98ccf1c8b3d35cfea5093cdb61b64836&quot;&gt;Prokaryotic and eukaryotic cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+theory+prokaryotic+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/010c56a26444568587b8d2019e991130&quot;&gt;Prokaryotic and Eukaryotic Cells Practice&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: CK-12&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+theory+prokaryotic+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;PART A — The Ugali Kitchen Analogy (15 min): Teacher introduces the analogy verbally and with a simple whiteboard sketch. Learners discuss in groups of four how the analogy maps onto cell structure concepts. They complete a two-column Analogy Mapping Table in their notebooks: Kitchen Feature → Cell Feature (e.g., &#x27;The kitchen itself / the jiko boundary&#x27; → &#x27;Cell membrane&#x27;, &#x27;The recipe book&#x27; → &#x27;DNA/Nucleus&#x27;, &#x27;Cooking pots and utensils&#x27; → &#x27;Organelles&#x27;). PART B — Guided Research &amp;amp; Diagram Study (20 min): Learners are directed to their ARES platform resource cards (or printed A3 diagram sheets) showing: (i) a labelled generalised animal cell, (ii) a labelled generalised plant cell, (iii) a labelled prokaryotic cell (e.g., E. coli). They read the embedded text on cell theory and complete a Cell Theory Evidence Table: Scientist | Country/Period | Contribution | How it connects to Amina&#x27;s healing. PART C — Prokaryote vs. Eukaryote Sort (10 min): Groups receive a set of 12 feature cards (e.g., &#x27;Has a nucleus&#x27;, &#x27;DNA floats freely&#x27;, &#x27;Has mitochondria&#x27;, &#x27;Found in bacteria&#x27;). They physically sort cards into two columns on their desk: PROKARYOTE / EUKARYOTE. Groups photograph or sketch their sorted table.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;PART A: Draw a simple kitchen outline on the board — label: &#x27;door = cell membrane&#x27;, &#x27;recipe book on shelf = nucleus/DNA&#x27;, &#x27;jiko (stove) = mitochondria&#x27;, &#x27;sufuria, mwiko, chopping board = organelles&#x27;. Say: &#x27;Every kitchen in Nairobi — whether in a Kibera home or a Westlands restaurant — has these basics. But the kitchen in a hospital canteen is set up differently from a home kitchen in Kericho. Same tools, different arrangement, different job. That is exactly what we will discover about cells.&#x27; Pause for 10 seconds. Ask: &#x27;What part of the kitchen would you say is like the cell membrane — the thing that controls what comes in and out?&#x27; WAIT TIME: 12 seconds. Cold-call 2 learners. PART B: Say: &#x27;You will now read about three scientists — Schleiden, Schwann, and Virchow — who each added one piece to the cell theory puzzle. As you read, fill in your Evidence Table. Most importantly: for each scientist, write one sentence connecting their idea to Amina&#x27;s healing finger.&#x27; Circulate and prompt: &#x27;Virchow said all cells come from pre-existing cells — how does that explain where the new skin cells on Amina&#x27;s finger came from?&#x27; WAIT TIME: 10 seconds after each prompt before assisting. PART C: Distribute feature cards. Say: &#x27;Sort these into Prokaryote or Eukaryote. You have 8 minutes. Be ready to justify every card.&#x27; After 8 minutes, cold-call one group per disputed card: &#x27;Group by the door — where did you put Has no membrane-bound nucleus and why?&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Analogy Mapping (Ugali Kitchen): Anchors abstract cell vocabulary to a concrete, culturally familiar Kenyan context, reducing cognitive load for new terminology. Card Sort (Prokaryote/Eukaryote): A structured academic controversy strategy — physical manipulation of feature cards externalises thinking, exposes disagreements within groups, and generates productive talk. Evidence Table with Phenomenon Link: Forces learners to connect historical scientific knowledge directly to the anchoring phenomenon, preventing isolated memorisation.&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Observable indicators: (1) Analogy Mapping Table has at least 5 correct mappings — teacher checks two tables per group during circulation. (2) Cell Theory Evidence Table: each scientist row has a completed &#x27;Phenomenon Connection&#x27; sentence — a blank row signals the learner cannot yet connect theory to observation. (3) Card Sort: Teacher notes any card consistently misplaced across groups (e.g., &#x27;Has ribosomes&#x27; placed only under Eukaryote) — this informs the Explain phase mini-lecture focus.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;p&gt;&lt;strong&gt;Explain Phase&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📹 VIDEO:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/9f2d3e6f004d59c7a0106ab068d0cf53&quot;&gt;Organelles in eukaryotic cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+theory+prokaryotic+video&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar videos&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;📖 EXERCISE:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local:8069/en/learn/#/topics/c/7420d24fcc8f5eb78e3f3947ada0a787&quot;&gt;Prokaryotic and eukaryotic cells&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source: Khan Academy (English - US curriculum)&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;http://ares.local/www2/search.php?searchstring=cell+structure+theory+prokaryotic+notes&amp;amp;sources[]=kha&amp;amp;sources[]=kicd&amp;amp;sources[]=khak&amp;amp;sources[]=wiki&amp;amp;sources[]=wikig&amp;amp;sources[]=wikih&amp;amp;sources[]=wikiSp&amp;amp;sources[]=wikiq&amp;amp;sources[]=wikic&amp;amp;sources[]=wikip&amp;amp;sources[]=wikia&amp;amp;sources[]=wikim&amp;amp;sources[]=ted&amp;amp;sources[]=ted11&amp;amp;sources[]=tedin&amp;amp;sources[]=g4st&amp;amp;sources[]=g4e&amp;amp;sources[]=g5st&amp;amp;sources[]=g5e&amp;amp;sources[]=dlc&amp;amp;sources[]=bg&amp;amp;sources[]=te&amp;amp;sources[]=phet&amp;amp;sources[]=mg&amp;amp;sources[]=gdl&amp;amp;sources[]=ck12&amp;amp;sources[]=tess&amp;amp;sources[]=uk&amp;amp;sources[]=kol&amp;amp;sources[]=edu&amp;amp;sources[]=sea&amp;amp;sources[]=bound&amp;amp;sources[]=cbc&quot;&gt;🔍 Search ARES for similar readings&lt;/a&gt;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Teacher delivers a focused 12-minute direct instruction sequence consolidating cell theory and the prokaryote/eukaryote distinction, explicitly correcting the most common card-sort errors observed. Learners annotate their ARES diagram resource cards using a colour-coding system: GREEN = present in both prokaryotes and eukaryotes, BLUE = eukaryotes only, RED = plant eukaryotes only. Learners then write a 4-sentence Claim–Evidence–Reasoning (CER) paragraph in their notebooks responding to: &#x27;Use cell theory to explain how Amina&#x27;s body was able to produce new skin cells to close the wound on her finger.&#x27;&lt;/p&gt;&lt;/td&gt;&lt;td&gt;&lt;p&gt;Begin with: &#x27;Let me address what I saw during the card sort. Ribosomes — almost every group put these under Eukaryote only. Let&#x27;s look at the diagram together.&#x27; Point to prokaryote diagram. &#x27;Ribosomes are actually present in BOTH. This matters — it means even the simplest bacteria can make proteins. That&#x27;s why bacteria in an infected wound can be so dangerous — they&#x27;re making proteins too.&#x27; Deliver direct instruction on: (1) Three tenets of cell theory — write verbatim on board; (2) Key
